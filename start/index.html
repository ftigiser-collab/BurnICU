<style>

  --inf:#1d4268;--inf-bg:#e8eef5;--inf-bd:#b4c2d2;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.42 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;min-height:34px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
textarea{width:100%;min-height:60px;resize:vertical}
b{font-weight:650}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:30;background:rgba(243,246,249,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:14px;min-height:58px;padding-top:6px;padding-bottom:6px}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--red)}

.tright{display:flex;align-items:center;gap:8px;flex:none}
.clock{color:var(--mut);font-size:13px;margin-right:4px}

.btn.sm{padding:3px 9px;font-size:13px;border-radius:7px}

.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-size:20px;line-height:1;text-align:center}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px}

.kv{display:flex;flex-direction:column;line-height:1.15}

.sep{width:1px;align-self:stretch;background:var(--line)}
.now{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;border-left:5px solid var(--ok)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}

.itx{min-width:0}
.it.st-done .itx{color:var(--mut)}
.it.st-na .itx{color:var(--dim);text-decoration:line-through}
.itx .sub{display:block;color:var(--mut);font-size:13px}

.due{font-size:12.5px;white-space:nowrap;padding:1px 8px;border-radius:7px;color:var(--mut);background:var(--raise);margin-top:2px}
.due.d-due{background:var(--amb-bg);color:var(--amb);font-weight:600}

.ib{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--teal);color:var(--teal);font:italic 700 13px/19px Georgia,serif;text-align:center;margin-top:1px}

.info p{margin:3px 0}

.side .info{margin-left:0}
.inl{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px}

.seg button{padding:4px 10px;font-size:13px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--teal);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.lbl{font-size:12.5px;color:var(--mut)}
.side .card{padding:10px 14px}
.side h3{font-size:14px;margin:0 0 6px;color:var(--navy);display:flex;align-items:center;gap:6px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 0;border-top:1px solid var(--raise);font-size:13.5px;align-items:center}

.sl .t2{color:var(--mut);font-size:12.5px}
.sl.o .t1{color:var(--red);font-weight:600}
.sl.d .t1{color:var(--amb);font-weight:600}
.nt{display:grid;grid-template-columns:18px 1fr 24px;gap:6px;padding:4px 0;font-size:13.5px;align-items:start}

.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}

.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}

.tile .tv{font-size:22px;font-weight:700;color:var(--navy)}
.tile .tv small{font-size:13px;font-weight:500;color:var(--mut)}
.tile .tk{font-size:12.5px;color:var(--mut)}
.tile input{width:100%;min-height:30px;margin-top:3px}
.tile.low{border-color:var(--red-bd);background:var(--red-bg)}

.tile.hi{border-color:var(--amb-bd);background:var(--amb-bg)}
.box{border-radius:10px;padding:9px 12px;margin-bottom:8px;border:1px solid}
.box.ok{background:var(--ok-bg);border-color:var(--ok-bd)}
.box.w{background:var(--amb-bg);border-color:var(--amb-bd)}
.box.e{background:var(--red-bg);border-color:var(--red-bd)}
.box.i{background:var(--inf-bg);border-color:var(--inf-bd)}
.box .bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:15px}
.box .bt{font-size:13.5px;margin-top:2px}
.crit{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;align-items:center}
.cc{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 8px;font-size:13px;border:1px solid var(--line2);background:#fff}
.cc.y{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.cc.n{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.cc.u{background:#fff;color:var(--mut)}
.cc.x{background:var(--raise);color:var(--dim)}
.cc input{width:56px;min-height:24px;padding:1px 5px;font-size:13px}
.vgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:1100px){.vgrid{grid-template-columns:1fr}}
.hl{margin:0;padding-left:18px;font-size:13.5px}
.hl li{margin:3px 0}
.hl li.w{color:#7a4a00}.hl li.e{color:var(--red);font-weight:600}
.nform{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:13.5px}
.nform .ins{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nform input,.nform select{min-height:30px;padding:3px 7px}
.nform input.t{width:74px}.nform input.n{width:90px}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:75vh}

.vt tr.pre td{color:var(--dim)}
.vt .ok{color:var(--ok);font-weight:600}.vt .low{color:var(--red);font-weight:700}.vt .hi{color:var(--amb);font-weight:600}
.vt td.diu-low{background:var(--red-bg)}.vt td.diu-ok{background:var(--ok-bg)}.vt td.diu-hi{background:var(--amb-bg)}
.vt .grey{color:var(--dim)}

.dec{display:inline-block;border-radius:6px;padding:0 6px;font-weight:700;font-size:12.5px}
.dec.up{background:var(--red-bg);color:var(--red)}.dec.dn{background:var(--ok-bg);color:var(--ok)}.dec.eq{background:var(--raise);color:var(--mut)}
.ex{display:inline-flex;align-items:center;gap:2px;background:var(--raise);border-radius:6px;padding:0 5px;margin-right:3px;font-size:12px}

.dlt{color:var(--dim);font-size:12px;padding:0 3px}
.dlt:hover{color:var(--red)}
.tb2{border-collapse:collapse;width:100%;font-size:13.5px}
.tb2 th,.tb2 td{padding:4px 8px;border-bottom:1px solid var(--raise);text-align:right}
.tb2 th:first-child,.tb2 td:first-child{text-align:left}
.tb2 th{font-size:12px;color:var(--mut);font-weight:600}
.dlgbg{position:fixed;inset:0;background:rgba(22,41,74,.38);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.dlg{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(22,41,74,.3);width:min(720px,100%);padding:16px 20px}
.dlg h2{margin:0 0 10px;color:var(--navy);font-size:18px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.menu{position:fixed;top:56px;right:20px;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 40px rgba(22,41,74,.2);min-width:280px;padding:6px}

.menu button:hover,.menu a:hover{background:var(--raise)}
.menu .ft{font-size:12px;color:var(--dim);padding:6px 12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:8px 16px;z-index:70;font-size:14px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.leg{font-size:12px;color:var(--mut);margin-top:6px}
.mut{color:var(--mut)}
.small{font-size:12.5px}
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:9mm 9mm 10mm}
  html,body{background:#fff;font-size:8.6pt}
  #app{display:none!important}
  #print{display:block}
}
.pp{color:#000;font-size:8.6pt;line-height:1.3}
.pp .pg{page-break-after:always;break-after:page}
.pp .pg:last-child{page-break-after:auto;break-after:auto}

</head>
<body>
<div id="app"></div>
<div id="print" class="pp" aria-hidden="true"></div>
<script>
"use strict";
(() => {
/* =====================================================================
   BurnStart — Verbrennung ≥ 20 % VKOF, Aufnahme und Tag 0–5
   Gekoppelt mit BurnICU: liest und schreibt direkt den BurnICU-Speicher
   (gleiche Domain). Eigener Speicher nur für den Verlaufsspiegel und die
   Bedienung. Hausstandard: SOPs der V1 gehen vor Literatur.
   ===================================================================== */
const APP_VERSION = "1.0.0";
const BKEY = "burnicu_v3";
const SKEY = "burnstart_v1";
const H = 36e5, MIN = 6e4, EPOCH = "1970-01-01T00:00:00.000Z";

/* ---------- Hilfsfunktionen ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const pad = (n) => String(n).padStart(2, "0");
const tMs = (x) => x == null || x === "" ? null : typeof x === "number" ? x : new Date(x).getTime();
const isoOf = (ms) => new Date(ms).toISOString();
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const fT = (x) => { const d = new Date(tMs(x)); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fHH = (x) => pad(new Date(tMs(x)).getHours());
const fD = (x) => { const d = new Date(tMs(x)); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "."; };
const fDT = (x) => fD(x) + " " + fT(x);
const fWDT = (x) => WD[new Date(tMs(x)).getDay()] + " " + fDT(x);
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const fRel = (ms) => sameDay(ms, Date.now()) ? fT(ms) : WD[new Date(ms).getDay()] + " " + fT(ms);
const numDE = (v) => {
  if (v == null || v === "") return null;
  const n = parseFloat(String(v).replace(",", ".").replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? n : null;
};
const fN = (v, d = 1) => v == null || !Number.isFinite(v) ? "" : (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString("de-DE", { maximumFractionDigits: d });
const r0 = (n) => Math.round(n).toLocaleString("de-DE");
const tsd = (v) => v == null || !Number.isFinite(v) ? "" : (v < 0 ? "−" : "") + String(Math.round(Math.abs(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const r10 = (v) => Math.round(v / 10) * 10;
const byT = (a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : 0;
const last = (a) => a && a.length ? a[a.length - 1] : null;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hourFloor = (ms) => { const d = new Date(ms); d.setMinutes(0, 0, 0); return d.getTime(); };
const hourRound = (x) => { const d = new Date(tMs(x)); d.setMinutes(d.getMinutes() + 30, 0, 0); d.setMinutes(0, 0, 0); return d.getTime(); };
const clone = (o) => JSON.parse(JSON.stringify(o));
const dtLocal = (ms) => { if (ms == null || !Number.isFinite(ms)) return ""; const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayYMD = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
/* hh:mm → Zeitpunkt in der jüngsten Vergangenheit (max. 30 min Zukunft) relativ zu ref */
function hhmmVor(s, ref) {
  const m = String(s || "").match(/^\s*(\d{1,2})\s*[:.,]?\s*(\d{2})\s*$/);
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  if (h > 23 || mi > 59) return null;
  const d = new Date(ref);
  d.setHours(h, mi, 0, 0);
  let t = d.getTime();
  if (t > ref + 30 * MIN) t -= 864e5;
  return t;
}
const normHHMM = (s) => { const t = hhmmVor(s, Date.now()); return t == null ? "" : fT(t); };

/* ---------- Speicher ---------- */
const DEF_B = () => ({ version: 1, shiftStart: null, shiftNote: "", patients: {}, archive: [] });
let storageOk = true;
let hasBicu = false;
function readB() {
  try {
    const r = localStorage.getItem(BKEY);
    if (r) {
      const s = JSON.parse(r);
      if (s && s.patients) { hasBicu = true; return s; }
    }
  } catch (e) {}
  hasBicu = false;
  return DEF_B();
}
function writeB(s) {
  try { localStorage.setItem(BKEY, JSON.stringify(s)); storageOk = true; hasBicu = true; } catch (e) { storageOk = false; }
}
function readS() { try { const r = localStorage.getItem(SKEY); if (r) return JSON.parse(r) || {}; } catch (e) {} return {}; }
function writeS(o) { try { localStorage.setItem(SKEY, JSON.stringify(o)); } catch (e) {} }

const S0 = readS();
const UI = { sel: S0.sel || null, tab: S0.tab || "check", open: {}, fold: {}, showNA: false, notif: !!S0.notif, dlg: null, menu: false, toast: "", focusNext: null, hist: false, upd: null };
function saveUI() { const s = readS(); s.sel = UI.sel; s.tab = UI.tab; s.notif = UI.notif; writeS(s); }

/* ---------- Patientendaten (Struktur wie BurnICU) ---------- */
const BURN_DX_RE = /verbrenn|verbrüh|brandverletz|\bVKOF\b|stromunfall|hochspannung|elektrounfall|blitzunfall|inhalationstrauma|flammen|explosionstrauma/i;
const VKOF_RE = /(\d{1,2}(?:[,.]\d)?)\s*%\s*(?:VKOF|KOF)/i;
const emptyBurn = () => ({ unfall: "", vkof: "", tief: "", alter: "", gegeben: "", gegebenT: "", rate: "", inhal: false, strom: false, myo: false });
const burnOf = (p) => ({ ...emptyBurn(), ...(p.burn || {}) });
const c48Of = (p) => p.c48 || {};
const isDone = (p, k) => !!((c48Of(p).done || {})[k]);
const bsOf = (p) => ({ alb: [], extra: [], rekap: [], na: {}, doneT: {}, hd: "auto", lsg: "ra", ...(p.bs || {}) });
const hasBurn = (p) => { const b = burnOf(p); return !!(b.unfall || b.vkof); };
const isBurnPat = (p) => hasBurn(p) || BURN_DX_RE.test(p.diagnose || "") || !!p.unterwegs;
function patKg(p) {
  const g = parseFloat(String(p.gewicht || "").replace(",", "."));
  if (Number.isFinite(g) && g > 0) return g;
  const m = String(p.info || "").match(/(\d{2,3})\s*kg/i);
  return m ? Number(m[1]) : null;
}
function patAlter(p) {
  const a = numDE(burnOf(p).alter);
  if (a != null) return a;
  const m = String(p.info || "").match(/(\d{1,3})\s*(?:J\b|J\.|Jahre|jährig)/i);
  return m ? Number(m[1]) : null;
}
function patSex(p) {
  if (p.sex === "m" || p.sex === "w") return p.sex;
  const s = " " + String(p.info || "").toLowerCase() + " ";
  if (/[\s,;(]w[\s,;.)]|weibl/.test(s)) return "w";
  if (/[\s,;(]m[\s,;.)]|männl/.test(s)) return "m";
  return null;
}
function patVk(p) {
  const v = numDE(burnOf(p).vkof);
  if (v != null) return v;
  const m = String(p.diagnose || "").match(VKOF_RE);
  return m ? numDE(m[1]) : null;
}
const piccoAktiv = (p) => !!p && !p.piccoAus && (!!p.piccoAn || (p.picco || []).length > 0);
const devAct = (p, typ) => (p.devices || []).find((d) => !d.ende && d.typ === typ);
function newPatient(o) {
  return { id: uid(), name: "", zimmer: 1, platz: "", mine: true, aufnahme: todayYMD(), info: "", gewicht: "", diagnose: "", vorerkrankungen: [], verlauf: [], todos: [], systeme: {}, labs: {}, volumen: { status: "", pulm: "", note: "", b24: [], bkum: [], ziel: "", zielMenge: "" }, infekt: { foki: [], erreger: [], therapie: [] }, status: {}, orga: [], notiz: "", uebPunkte: [], burn: emptyBurn(), diurese: [], picco: [], meds: [], eingriffe: [], created: nowISO(), ...o };
}

/* ---------- Verlaufsspiegel: BurnICU kürzt Diurese (72 h), Labor (48 h) und einige Listen — hier bleibt der Verlauf bis Tag 5 erhalten ---------- */
const VLABS = ["Laktat", "ScvO2", "Na+", "K+", "Albumin", "COHb", "CK", "Myoglobin", "Hb", "MAP", "Anti-Xa"];
const SERCFG = { diurese: { ret: 72, cap: 96 }, infRate: { cap: 80 }, iap: { cap: 60 }, picco: { cap: 40 }, lab: { ret: 48 } };
const skey = (x) => x.id || (x.t + "|" + x.v);
function mergeSer(mir, cur, cfg) {
  cur = (cur || []).filter((x) => x && x.t);
  if (!cur.length) return [];
  const ids = new Set(cur.map(skey));
  const minT = cur.reduce((m, x) => x.t < m ? x.t : m, cur[0].t);
  const horizon = cfg && cfg.ret ? isoOf(Date.now() - (cfg.ret - 1) * H) : null;
  const atCap = cfg && cfg.cap ? cur.length >= cfg.cap : false;
  const keep = (mir || []).filter((x) => !ids.has(skey(x)) && x.t < minT && ((horizon && x.t < horizon) || atCap));
  return keep.concat(cur).sort(byT);
}
let MIR = readS().mirror || {};
function serOf(p, key) {
  const m = MIR[p.id] || {};
  if (key.indexOf("lab:") === 0) {
    const n = key.slice(4);
    return mergeSer((m.labs || {})[n], ((p.labs || {})[n] || {}).vals, SERCFG.lab);
  }
  return mergeSer(m[key], p[key], SERCFG[key]);
}
function syncMirror(B) {
  const s = readS();
  const M = s.mirror || {};
  const now = Date.now();
  Object.values(B.patients || {}).forEach((p) => {
    if (!isBurnPat(p)) return;
    const o = M[p.id] || {};
    const n = { seen: now, labs: {} };
    ["diurese", "infRate", "iap", "picco"].forEach((k) => { const v = mergeSer(o[k], p[k], SERCFG[k]); if (v.length) n[k] = v.slice(-400); });
    VLABS.forEach((l) => { const v = mergeSer((o.labs || {})[l], ((p.labs || {})[l] || {}).vals, SERCFG.lab); if (v.length) n.labs[l] = v.slice(-200); });
    M[p.id] = n;
  });
  Object.keys(M).forEach((id) => { if (!(B.patients || {})[id] && now - (M[id].seen || 0) > 7 * 864e5) delete M[id]; });
  s.mirror = M;
  MIR = M;
  writeS(s);
}
function mirDrop(pid, key, id) {
  const s = readS();
  const m = (s.mirror || {})[pid];
  if (!m) return;
  if (key.indexOf("lab:") === 0) { const n = key.slice(4); if (m.labs && m.labs[n]) m.labs[n] = m.labs[n].filter((x) => skey(x) !== id); }
  else if (m[key]) m[key] = m[key].filter((x) => skey(x) !== id);
  writeS(s);
  MIR = s.mirror;
}

/* ---------- Schreiben in den BurnICU-Speicher ---------- */
function upd(pid, fn) {
  const B = readB();
  const p = B.patients[pid];
  if (!p) { toast("Patient nicht gefunden — in BurnICU entlassen?"); render(); return; }
  const q = clone(p);
  fn(q);
  B.patients[pid] = q;
  writeB(B);
  refresh();
}
const setBurn = (q, patch) => { q.burn = { ...burnOf(q), ...patch }; };
const setC48 = (q, k, v) => { q.c48 = { ...(q.c48 || {}), [k]: v }; };
const bsMut = (q) => { q.bs = bsOf(q); return q.bs; };
function toggleDone(q, k, force) {
  const c = q.c48 = { ...(q.c48 || {}) };
  c.done = { ...(c.done || {}) };
  const on = force != null ? force : !c.done[k];
  c.done[k] = on;
  const bs = bsMut(q);
  bs.doneT = { ...bs.doneT };
  if (on) bs.doneT[k] = nowISO(); else delete bs.doneT[k];
  if (on && bs.na[k]) { bs.na = { ...bs.na }; delete bs.na[k]; }
}
const insSorted = (arr, e) => (arr || []).concat([e]).sort(byT);
const LABMETA = { Laktat: ["bga", "mmol/l"], ScvO2: ["bga", "%"], COHb: ["bga", "%"], Hb: ["blut", "g/dl"], "Anti-Xa": ["blut", "IE/ml"], "Na+": ["niere", "mmol/l"], "K+": ["niere", "mmol/l"], CK: ["niere", "U/l"], Myoglobin: ["niere", "µg/l"], Albumin: ["leber", "g/dl"], MAP: ["", "mmHg"] };
function labSet(q, n, t, v, id) {
  const L = q.labs = { ...(q.labs || {}) };
  const m = LABMETA[n] || ["", ""];
  const cur = L[n] ? { ...L[n] } : { grp: m[0], unit: m[1], imp: false, ueb: false, vals: [] };
  let vals = (cur.vals || []).slice();
  if (id) vals = vals.filter((x) => x.id !== id);
  if (v !== "" && v != null) vals = insSorted(vals, { id: id || uid(), t: isoOf(t), v: String(v).trim().replace(".", ",") });
  cur.vals = vals;
  L[n] = cur;
}
function devUpsert(q, typ, lage, burnFlag) {
  const ds = (q.devices || []).slice();
  const i = ds.findIndex((y) => !y.ende && y.typ === typ);
  if (i >= 0) { ds[i] = { ...ds[i], ...(lage != null ? { lage } : {}), ...(burnFlag != null ? { burn: burnFlag } : {}) }; q.devices = ds; return; }
  if (!lage && !burnFlag) return;
  ds.push({ id: uid(), typ, lage: lage || "", seit: todayYMD(), burn: !!burnFlag });
  q.devices = ds;
}

/* ---------- Berechnungen ---------- */
function calc(p, now) {
  now = now || Date.now();
  const b = burnOf(p), d = c48Of(p), bs = bsOf(p);
  const kg = patKg(p), cm = numDE(p.groesse), sex = patSex(p), age = patAlter(p);
  const vk = patVk(p), tief = numDE(b.tief);
  let u = b.unfall ? tMs(b.unfall) : null;
  if (u != null && !Number.isFinite(u)) u = null;
  const h = u != null ? (now - u) / H : null;
  const o = { p, b, d, bs, kg, cm, sex, age, vk, tief, u, h, now };
  o.spec = vk != null ? vk >= 20 : true;
  o.tag = h != null && h >= 0 ? Math.floor(h / 24) + 1 : null;
  o.schock = o.spec && h != null && h >= 0 && h < 48;
  o.child = age != null ? age < 16 : kg != null && kg < 30;
  o.inhal = !!b.inhal;
  o.strom = !!b.strom || (d.mech || []).indexOf("strom") >= 0;
  o.myo = !!b.myo;
  o.intub = !!d.intub;
  o.russ = !!b.inhal || isDone(p, "rg_russ");
  o.gesicht = (d.lok || []).indexOf("gesicht") >= 0;
  if (kg && vk) {
    if (kg >= 40) {
      o.vk10 = Math.max(10, Math.ceil(vk / 10) * 10);
      o.rotKg = kg > 80 ? Math.ceil((kg - 80) / 10) * 100 : 0;
      o.rotIht = b.inhal ? 100 : 0;
      o.rot = o.vk10 * 10 + o.rotKg + o.rotIht;
    } else o.rotNA = true;
    o.ivy = 250 * kg;
    o.rescue = 6 * kg * vk;
  }
  if (o.schock || h == null || h < 48) {
    o.uoLo = o.myo ? 1.5 : o.child ? 1 : 0.3;
    o.uoHi = o.myo ? 2 : o.child ? 1.5 : null;
    o.uoMode = o.myo ? "Myoglobinurie (SOP Crush)" : o.child ? "Kind" : "SOP";
  } else {
    o.uoLo = o.myo ? 1 : 0.5;
    o.uoHi = o.myo ? 2 : null;
    o.uoMode = o.myo ? "Myoglobinurie" : "nach Schockphase";
  }
  if (cm && kg) { o.bmi = kg / Math.pow(cm / 100, 2); o.kof = Math.sqrt(cm * kg / 3600); }
  if (cm && sex) o.ibw = (cm - 100) * (sex === "w" ? 0.85 : 0.9);
  if (age != null && vk != null && sex) {
    let a = sex === "w" ? 1 : 0;
    a += age <= 20 ? 1 : age <= 40 ? 2 : age <= 60 ? 3 : age <= 80 ? 4 : 5;
    a += b.inhal ? 1 : 0;
    a += (tief || 0) > 0 ? 1 : 0;
    a += Math.min(10, Math.max(1, Math.ceil(vk / 10)));
    o.absi = a;
    o.absiTxt = a <= 3 ? "≥ 99 %" : a <= 5 ? "98 %" : a <= 7 ? "80–90 %" : a <= 9 ? "50–70 %" : a <= 11 ? "20–40 %" : a <= 13 ? "~10 %" : "< 10 %";
  }
  o.hiAvail = bs.hd === "ja" ? true : bs.hd === "nein" ? false : piccoAktiv(p);
  o.scvAvail = bs.hd === "ja" ? true : bs.hd === "nein" ? false : !!devAct(p, "ZVK") || piccoAktiv(p) || serOf(p, "lab:ScvO2").length > 0;
  o.aufH = u != null && p.created ? Math.max(0, (tMs(p.created) - u) / H) : 0;
  return o;
}
const zielTxt = (c) => {
  if (c.myo) return "200–300 ml/h bzw. 1,5–2 ml/kg/h";
  if (c.kg) return `> ${r0(c.uoLo * c.kg)} ml/h (${fN(c.uoLo, 1)} ml/kg/h)` + (c.uoHi ? `, bis ${r0(c.uoHi * c.kg)} ml/h` : "");
  return `> ${fN(c.uoLo, 1)} ml/kg/h`;
};
const atMs = (c, hh) => c.u != null ? c.u + hh * H : null;
/* Ziel-Diurese zu einem Zeitpunkt: Schockphase (h 0–48) nach SOP, danach Intensiv-Standard wie BurnICU */
const loAt = (c, T) => c.u != null && (T - c.u) / H >= 48.5 ? (c.myo ? 1 : 0.5) : (c.myo ? 1.5 : c.child ? 1 : 0.3);

/* Diurese: Eintrag = ml seit letztem Eintrag (wie BurnICU); Lücken werden gemittelt */
function diuHours(list) {
  const Hs = [];
  let prev = null;
  list.forEach((e) => {
    const tr = hourRound(e.t);
    const v = numDE(e.v) || 0;
    let n = prev == null ? 1 : Math.round((tr - prev) / H);
    if (n <= 0) {
      const lb = last(Hs);
      if (lb) { lb.v += v; lb.ids = lb.ids.concat([e.id]); lb.multi = true; } else Hs.push({ h: tr, v, n: 1, ids: [e.id], src: v });
      return;
    }
    if (n > 12) n = 1;
    for (let k = n - 1; k >= 0; k--) Hs.push({ h: tr - k * H, v: v / n, n, ids: [e.id], src: v, end: tr });
    prev = tr;
  });
  return Hs;
}
function diuInfo(p) {
  const list = serOf(p, "diurese");
  const Hs = diuHours(list);
  const map = new Map();
  Hs.forEach((x) => map.set(x.h, x));
  return { list, Hs, map, lastE: last(list), lastB: last(Hs) };
}
function rateHist(p) {
  const h = serOf(p, "infRate");
  if (h.length) return h;
  const r = numDE(burnOf(p).rate);
  return r != null ? [{ id: "legacy", t: EPOCH, v: r }] : [];
}
const albHist = (p) => (bsOf(p).alb || []).slice().sort(byT);
function valAt(hist, ms) { let r = null; for (const x of hist) { if (tMs(x.t) <= ms) r = x; else break; } return r; }
function integ(hist, a, b) {
  if (a == null || b == null || b <= a) return 0;
  let s = 0;
  hist.forEach((x, i) => {
    const st = x.t === EPOCH ? -Infinity : tMs(x.t);
    const en = i + 1 < hist.length ? tMs(hist[i + 1].t) : Infinity;
    const lo = Math.max(st, a), hi = Math.min(en, b);
    const v = numDE(x.v);
    if (hi > lo && v != null) s += v * (hi - lo) / H;
  });
  return s;
}
const TF_ML = { EK: 300, FFP: 250, TK: 250 };
const EXTRA_ART = { krist: "Kristalloid-Bolus", alb: "Albumin 20 %", alb5: "Albumin 5 %", sonst: "sonstiges" };
function extrasOf(p) {
  const a = (bsOf(p).extra || []).map((e) => ({ ...e, ml: numDE(e.ml) || 0, src: "bs", lbl: (EXTRA_ART[e.art] || e.art) + " " + tsd(numDE(e.ml) || 0) + " ml" }));
  (p.transf || []).forEach((e) => {
    const n = Number(e.n) || 1;
    const ml = (TF_ML[e.prod] || 0) * n;
    if (ml) a.push({ id: e.id, t: e.t, art: e.prod, ml, n, src: "tf", lbl: n + " " + e.prod + " (≈ " + tsd(ml) + " ml)" });
  });
  return a.sort(byT);
}
function volT0(c) {
  const g = numDE(c.b.gegeben);
  if (g == null) return { g: null, t0: null };
  const gT = c.b.gegebenT ? tMs(c.b.gegebenT) : Date.now();
  const bis = hhmmVor(c.d.gegebenBis, gT);
  const t0 = bis != null && c.u != null && bis >= c.u && bis <= gT + MIN && gT - bis < 3 * H ? bis : gT;
  return { g, t0 };
}
function vol(p, c, T) {
  if (c.u == null) return null;
  const { g, t0 } = volT0(c);
  const hist = rateHist(p);
  const f = hist.find((x) => x.t !== EPOCH);
  const start = t0 != null ? t0 : f ? Math.max(c.u, tMs(f.t)) : null;
  const from = t0 != null ? t0 : c.u;
  let kris = (g || 0) + (start != null ? integ(hist, start, T) : 0);
  let kol = integ(albHist(p), from, T);
  extrasOf(p).forEach((e) => { const t = tMs(e.t); if (t > from && t <= T) { if (e.art === "krist") kris += e.ml; else kol += e.ml; } });
  const hJ = Math.max(0, (T - c.u) / H);
  const r = { g, t0, start, kris, kol, ges: kris + kol, hJ, soll: c.rot != null ? c.rot * hJ : null };
  if (g != null && c.rot != null) { r.h0 = Math.max(0, (t0 - c.u) / H); r.soll0 = c.rot * r.h0; r.d0 = g - r.soll0; }
  r.dJ = r.soll != null ? r.kris - r.soll : null;
  return r;
}
function diuSum(di, a, b) { let s = 0, n = 0; di.Hs.forEach((x) => { if (x.h > a && x.h <= b) { s += x.v; n++; } }); return { s, n }; }

/* Reevaluation nach SOP: Diurese, HI, ScvO2, Laktat, Rekap — HI/ScvO2 nur mit Monitoring */
function lastIn(arr, T, win, fld) {
  let r = null;
  for (const x of arr) {
    const t = tMs(x.t);
    if (t > T + 5 * MIN) break;
    if (t > T - win && (!fld || (x[fld] != null && x[fld] !== ""))) r = x;
  }
  return r;
}
function rekapSer(p) {
  const a = (bsOf(p).rekap || []).slice();
  if (p.rekap && p.rekap.t && !a.some((x) => x.t === p.rekap.t)) a.push({ id: "bicu", t: p.rekap.t, v: p.rekap.v });
  return a.sort(byT);
}
function evalAt(p, c, T, diuVal) {
  const crit = [];
  const kg = c.kg;
  const lo = loAt(c, T);
  crit.push({ k: "diu", l: `Diurese > ${fN(lo, 1)} ml/kg/h`, v: diuVal != null && kg ? fN(diuVal / kg, 2) : null, st: diuVal == null || !kg ? null : diuVal / kg >= lo });
  if (c.hiAvail) {
    const x = lastIn(serOf(p, "picco"), T, 6 * H, "hi");
    const v = x ? numDE(x.hi) : null;
    crit.push({ k: "hi", l: "HI > 2,2", v: v != null ? fN(v, 1) : null, st: v == null ? null : v > 2.2 });
  } else crit.push({ k: "hi", l: "HI > 2,2", st: "na" });
  if (c.scvAvail) {
    const x = lastIn(serOf(p, "lab:ScvO2"), T, 6 * H);
    const v = x ? numDE(x.v) : null;
    crit.push({ k: "scv", l: "ScvO2 > 70 %", v: v != null ? fN(v, 0) : null, st: v == null ? null : v > 70 });
  } else crit.push({ k: "scv", l: "ScvO2 > 70 %", st: "na" });
  const ls = serOf(p, "lab:Laktat");
  const lx = lastIn(ls, T, 6 * H);
  let lst = null;
  if (lx) {
    const lv = numDE(lx.v);
    const i = ls.indexOf(lx);
    const prev = i > 0 ? numDE(ls[i - 1].v) : null;
    lst = lv == null ? null : lv <= 2 ? true : prev != null ? lv < prev : null;
  }
  crit.push({ k: "lak", l: "Laktat fällt", v: lx ? lx.v : null, st: lst });
  const rk = lastIn(rekapSer(p), T, 2 * H);
  crit.push({ k: "rek", l: "Rekap < 3 s", v: rk ? (rk.v === "ok" ? "< 3 s" : "≥ 3 s") : null, st: rk ? rk.v === "ok" : null });
  const act = crit.filter((x) => x.st !== "na");
  const mp = lastIn(serOf(p, "lab:MAP"), T, 2 * H);
  return { crit, anyFail: act.some((x) => x.st === false), allOk: act.every((x) => x.st === true), unk: act.filter((x) => x.st == null).map((x) => x.l), mapLow: !!(mp && numDE(mp.v) < 65), map: mp ? numDE(mp.v) : null };
}
function decisionAt(p, c, T, diuVal, rate) {
  if (diuVal == null) return null;
  const ev = evalAt(p, c, T, diuVal);
  if (ev.anyFail) return { k: "up", neu: rate != null ? r10(rate * 1.2) : null, ev };
  if (ev.allOk) return { k: "dn", neu: rate != null ? r10(rate * 0.9) : null, ev };
  return { k: "eq", ev };
}

/* ---------- Jetzt-Anweisung Schockphase (Logik wie BurnICU-Schockphase-Karte) ---------- */
function plan(p, c) {
  const now = c.now;
  const out = { main: null, vol: null, hints: [], ev: null };
  if (!c.schock) return out;
  const di = diuInfo(p);
  const rr = valAt(rateHist(p), now);
  const rate = rr ? numDE(rr.v) : null;
  out.rate = rate;
  out.di = di;
  const L = di.lastE;
  if (rate == null && c.rot != null) out.main = { lv: "w", h: `Laufrate fehlt — Rule of 10: ${r0(c.rot)} ml/h Ringer-Azetat`, t: "Startrate einstellen bzw. bisherige Laufraten in der Tabelle nachtragen (Zeile = Stunde, Rate gilt ab Zeilenbeginn).", neu: c.rot };
  else if (!L) out.main = { lv: "w", h: "Stundendiurese eintragen", t: `Sie steuert die Laufrate — Ziel ${zielTxt(c)}.` };
  else {
    const alt = (now - tMs(L.t)) / MIN;
    const diuV = di.lastB ? di.lastB.v : null;
    out.ev = evalAt(p, c, now, diuV);
    if (alt > 150) out.main = { lv: "w", h: `Diurese nachtragen — letzter Wert vor ${Math.floor(alt / 60)} h ${Math.round(alt % 60)} min`, t: "Erst mit aktueller Stundendiurese titrieren." };
    else if (rr && rr.t !== EPOCH && now - tMs(rr.t) < 60 * MIN) out.main = { lv: "i", h: `Laufrate halten — angepasst um ${fT(rr.t)}`, t: `Nächste Reevaluation ${fT(tMs(rr.t) + H)} (SOP: stündlich).` };
    else if (out.ev.anyFail) {
      const neu = rate != null ? r10(rate * 1.2) : null;
      const esk = neu != null && c.rot && neu > 2 * c.rot;
      out.main = { lv: "w", h: rate != null ? `Laufrate erhöhen: ${r0(rate)} → ${r0(neu)} ml/h (+20 %)` : "Laufrate erhöhen (+20 %)", t: `Nicht erfüllt: ${out.ev.crit.filter((x) => x.st === false).map((x) => x.l).join(", ")} — vorher ZVD/VCI bzw. Fluid Responsiveness prüfen.` + (esk ? " Über 2 × Rule of 10: Kolloid-Rescue (Albumin) erwägen, Ursachen prüfen (abdominelles Kompartmentsyndrom, Myoglobin, Blutung, Katheterlage)." : ""), neu };
    } else if (out.ev.allOk) {
      const neu = rate != null ? r10(rate * 0.9) : null;
      const ex = out.ev.crit.filter((x) => x.st === "na").map((x) => x.l.split(" ")[0]);
      out.main = { lv: "ok", h: rate != null ? `Laufrate senken: ${r0(rate)} → ${r0(neu)} ml/h (−10 %)` : "Laufrate senken (−10 %)", t: "Alle Ziele erfüllt (SOP)." + (ex.length ? ` ${ex.join("/")} ohne Monitoring nicht bewertet.` : ""), neu };
    } else {
      const off = out.ev.unk;
      out.main = { lv: "ok", h: "Diurese im Ziel — Laufrate halten", t: `Senken (−10 %${rate != null ? " → " + r0(r10(rate * 0.9)) + " ml/h" : ""}), sobald auch ${off.join(", ")} erfüllt ${off.length > 1 ? "sind" : "ist"}.` };
    }
  }
  /* Volumen ab Stunde 0 gegen Rule of 10: Defizit/Übertherapie aus Präklinik und Schockraum */
  const v = vol(p, c, now);
  out.v = v;
  if (v && c.rot != null) {
    const dl = !L || (now - tMs(L.t)) / MIN > 150 ? null : di.lastB && c.kg ? di.lastB.v / c.kg < c.uoLo : null;
    const base = rate != null ? rate : c.rot;
    if (v.d0 == null) out.vol = { lv: "i", miss: true, h: "Volumen präklinisch + Schockraum fehlt", t: "Menge und Uhrzeit „bis“ eintragen — dann rechnet die App ab Stunde 0 (Unfall), ob ein Defizit oder eine Übertherapie besteht." };
    else {
      const grenze = (s) => Math.max(500, 0.2 * s);
      const rest = -v.dJ;
      const zahl = `Soll bis Übernahme ${tsd(v.soll0)} ml (Rule of 10 × ${fN(v.h0, 1)} h ab Unfall), gegeben ${tsd(v.g)} ml.`;
      if (v.d0 < -grenze(v.soll0)) {
        const kopf = `Defizit aus Präklinik/Schockraum: ${tsd(-v.d0)} ml unter Soll`;
        if (rest <= 250) out.vol = { lv: "ok", h: kopf + " — inzwischen ausgeglichen", t: zahl + ` Kristalloid seit Unfall ${tsd(v.kris)} ml (Referenz jetzt ${tsd(v.soll)} ml). Weiter stündlich nach Diurese.` };
        else if (dl === false) out.vol = { lv: "i", h: kopf, t: zahl + ` Noch offen ${tsd(rest)} ml — Diurese ist im Ziel: nicht nachschieben, weiter stündlich nach Diurese titrieren.` };
        else {
          const n = v.hJ < 6 ? Math.max(2, Math.round(8 - v.hJ)) : 4;
          let neu = r10(base + rest / n);
          const cap = r10(2 * c.rot), capped = neu > cap;
          if (capped) neu = cap;
          out.vol = { lv: "w", h: kopf, t: zahl + ` Noch offen ${tsd(rest)} ml${dl == null ? " (Diurese noch unklar)" : ", Diurese unter Ziel"} → Laufrate für ${n} h auf ${r0(neu)} ml/h${capped ? " (gedeckelt auf 2 × Rule of 10)" : ""}, danach wieder stündlich nach Diurese.`, neu: neu > base ? neu : null };
        }
      } else if (v.d0 > grenze(v.soll0)) {
        const kopf = `Übertherapie aus Präklinik/Schockraum: ${tsd(v.d0)} ml über Soll`;
        if (dl === true) out.vol = { lv: "e", h: kopf + " — trotzdem Diurese unter Ziel", t: zahl + " Nicht blind weiter steigern: intraabdominellen Druck (abdominelles Kompartmentsyndrom), HI/PiCCO, Blutung, Myoglobin und Katheterlage prüfen." };
        else {
          const neu = rate != null && rate > c.rot ? Math.max(r10(c.rot), r10(rate * 0.9)) : null;
          out.vol = { lv: "w", h: kopf, t: zahl + ` Fluid Creep vermeiden: Laufrate nicht über Rule of 10 (${r0(c.rot)} ml/h)${neu ? `, jetzt −10 % auf ${r0(neu)} ml/h` : ""}; bei erfüllten Zielen weiter −10 % je Stunde.`, neu };
        }
      } else out.vol = { lv: "ok", h: "Volumen ab Unfall passt zur Rule of 10", t: `Bis Übernahme ${tsd(v.g)} ml gegeben, Soll ${tsd(v.soll0)} ml (Abweichung < 20 %). Kristalloid seit Unfall ${tsd(v.kris)} ml.` };
    }
  }
  /* weitere Hinweise */
  const Hn = out.hints;
  const add = (lv, t, act) => Hn.push({ lv, t, act });
  if (out.ev && out.ev.mapLow) add("e", `MAP ${fN(out.ev.map, 0)} < 65 mmHg: Flüssigkeitschallenge (SOP); persistierend Dobutamin bei kardialer Dysfunktion, NA > 0,25 µg/kg/min → Argipressin 0,01 IE/min erwägen.`);

  const albRate = albNow ? numDE(albNow.v) : 0;
  if (c.h < 6) add("i", `Albumin frühestens ab h 6 (${fT(atMs(c, 6))}) — vorher verlässt es mit dem Kapillarleck das Gefäß.`);
  else if (c.h < 8) add("i", "h 6–8: Albumin 20 % nur erwägen; FFP nur nach Gerinnungssituation (nicht mandatorisch).");
  else if (!albRate && rate) add("w", `Ab h 8 Albumin 20 % nach SOP: 100 ml je 1000 ml Volumen ≈ ${r0(rate / 10)} ml/h (Ziel-Albumin 2,2–2,7 g/dl); FFP nur nach Gerinnungssituation.`, { k: "alb", v: Math.round(rate / 10) });
  const alb = last(serOf(p, "lab:Albumin"));
  if (alb && c.h >= 8) {
    let a = numDE(alb.v);
    if (a != null && a > 10) a = a / 10;
    if (a != null && a > 2.7 && albRate) add("i", `Albumin ${fN(a, 1)} g/dl über Ziel (2,2–2,7) — Perfusor reduzieren bzw. pausieren.`);
    if (a != null && a < 2.2 && c.h >= 8) add("w", `Albumin ${fN(a, 1)} g/dl unter Ziel (2,2–2,7 g/dl).`);
  }
  const na = lastIn(serOf(p, "lab:Na+"), now, 12 * H);
  const nav = na ? numDE(na.v) : null;
  if (nav != null && nav > 139 && c.bs.lsg !== "delta") add("w", `Natrium ${fN(nav, 0)} > 139 mmol/l → Ringer-Azetat auf Eindrittelelektrolytlösung (Deltajonin) umstellen (Ziel 135–139).`, { k: "lsg", v: "delta" });
  if (nav != null && nav < 135 && c.bs.lsg === "delta") add("w", `Natrium ${fN(nav, 0)} < 135 mmol/l unter Deltajonin — zurück auf Ringer-Azetat? (Ziel 135–139)`, { k: "lsg", v: "ra" });
  if (v && c.ivy) {
    const v24 = c.h >= 24 ? vol(p, c, c.u + 24 * H) : v;
    const pr = v24.ges / c.ivy * 100;
    if (pr > 100) add("e", `Ivy-Index überschritten: ${tsd(v24.ges)} ml in ${c.h >= 24 ? "h 0–24" : fN(c.h, 0) + " h"} (> 250 ml/kg) — hohes Risiko für ein abdominelles Kompartmentsyndrom: IAP messen, Zufuhr drosseln.`);
    else if (pr >= 80 && c.h < 24) add("w", `${fN(pr, 0)} % des Ivy-Index (250 ml/kg in 24 h) erreicht.`);
    const mk = v24.ges / (c.kg * c.vk);
    if (mk > 6 && pr <= 100) add("w", `Über 6 ml/kg/% VKOF (${fN(mk, 1)}) — Kolloid-Rescue (Albumin) erwägen statt weiter Kristalloid.`);
  }
  const iap = last(serOf(p, "iap"));
  if (iap) {
    const iv = numDE(iap.v);
    if (iv > 20) add("e", `IAP ${fN(iv, 0)} mmHg (${fT(iap.t)}): Verdacht auf abdominelles Kompartmentsyndrom — Organdysfunktion prüfen, Volumen drosseln, Chirurgie informieren.`);
    else if (iv >= 12) add("w", `IAP ${fN(iv, 0)} mmHg: intraabdominelle Hypertonie (≥ 12) — engmaschig messen, Volumen kritisch prüfen.`);
  }
  if (c.strom && !c.myo) add("i", "Stromunfall: Urinfarbe/Myoglobin prüfen — bei Myoglobinurie Ziel 1,5–2 ml/kg/h bzw. 200–300 ml/h (Häkchen „Myoglobinurie“ oben setzen).");
  if (c.rotNA) add("w", "Unter 40 kg gilt die Rule of 10 nicht — Kinderschema der Klinik, Zieldiurese 1–1,5 ml/kg/h.");
  if (c.h >= 24) add("i", `h 24–48: Rate schrittweise senken (−10 %-Schritte bei erfüllten Zielen); Schockphase endet ${fRel(atMs(c, 48))}.`);
  return out;
}

    info: I("Curling-Ulkus: Schleimhautischämie im Verbrennungsschock plus Stressreaktion; frühe enterale Ernährung schützt zusätzlich.", "REVISE (Cook, NEJM 2024): Pantoprazol bei invasiv Beatmeten senkt klinisch relevante obere GI-Blutungen (1,0 vs. 3,5 %), Letalität unverändert. Burn-Protokolle: Prophylaxe ab > 20 % VKOF.") },
  { k: "a_screen", ph: "auf", to: 24, t: () => "MRE-Screening-Abstriche bei Aufnahme (Hausstandard)",
    info: I("Brandwunden werden binnen Tagen besiedelt — zuerst grampositiv, ab etwa Tag 5 zunehmend gramnegativ einschließlich Pseudomonas. Die Aufnahmeflora ist die Referenz für spätere kalkulierte Therapien.") },
  { k: "a_stuhl", ph: "auf", to: 24, t: () => "Stuhlgang bei Aufnahme dokumentieren (danach spätestens alle 3 Tage)", info: I(null, null, "Ernährung und Abführen (Dok-ID 1620057).") },
  { k: "a_bg", ph: "auf", to: 24, t: () => "Arbeits- oder Wegeunfall? → BG-Verfahren (D-Arzt-Bericht) anstoßen",
    info: I("Berufsgenossenschaftliches Heilverfahren früh melden — relevant für Reha, Kompressionsversorgung und Kostenübernahme.") },
  /* ---- h 0–8 ---- */
  { k: "o_tit", ph: "h0", at: 1, t: () => "Stündliche Reevaluation läuft: Diurese, HI, ScvO2, Laktat, Rekap → alle erfüllt −10 %, eines nicht +20 % <button class='btn lnk' data-act='tab' data-v='vol'>→ Volumen</button>",
    info: I("Das Kapillarleck ist dynamisch — eine feste Formelrate über 24 h führt entweder zu Unter- oder, häufiger, zu Überinfusion.",
      "Fluid Creep (Pruitt, J Trauma 2000; Saffle, J Burn Care Res 2007): Volumina über 6 ml/kg/% VKOF gehen mit abdominellem und Extremitäten-Kompartmentsyndrom, ARDS und höherer Letalität einher. Gegenmittel ist konsequentes Heruntertitrieren.",
      "Volumentherapie: erstmals nach 60 min, dann stündlich; vor STEP UP ZVD, VCI-Sonografie, Fluid Responsiveness (Leg Raise).") },
  { k: "o_analgo", ph: "h0", at: 1, t: (x) => x.c.intub ? "Analgosedierung nach SOP: Aufnahmetag Sufentanil + Midazolam; Beatmung > 48 h absehbar → Sufentanil + Propofol (max. 5 Tage)" : "Analgesie nach SOP: Basis (Metamizol 4 g/24 h) + Opioid retard und akut",
    info: I("Verbrennungsschmerz ist nozizeptiv und neuropathisch mit primärer und sekundärer Hyperalgesie; Opioidbedarf und Toleranz steigen schnell, Verbandswechsel sind Spitzen.", null, "Analgesie, Sedierung, Delir (Dok-ID 1620165).") },
  { k: "o_bronch", ph: "h0", at: 1, cond: (x) => x.c.intub, t: () => "Bronchoskopie (intubiert, V. a. IHT): Ausmaß, Sekret/Ruß absaugen, AIS 0–4 dokumentieren", inp: [{ f: "ais", l: "AIS", u: "" }],
    info: I("Das endoskopische Grading (AIS) beschreibt Ausmaß und Schwere; die Bronchoskopie ist zugleich Therapie (Ruß, Fibrin-Casts).", null, "Inhalationstrauma: fiberoptische Bronchoskopie, Bronchoskopie bei Sekretretention.") },
  { k: "o_wund", ph: "h0", at: 1, t: () => "Wunden: Blasen und Verunreinigungen aseptisch abtragen, Erstverband nach Stationsstandard, Fotodoku",

  { k: "o_en", ph: "h0", at: 2, t: () => "Enteral starten: Tag 1 <b>20 ml/h</b> Fresubin HPenergy — spätestens 24 h nach Aufnahme",

      "ESPEN-Leitlinie Verbrennung (Rousseau, Clin Nutr 2013): Beginn innerhalb von 12 h. Mosier et al. (J Burn Care Res 2011): frühe enterale Ernährung mit weniger Infektionen assoziiert.", "Ernährung: so früh wie möglich, spätestens 24 h; Tag 1 20 ml/h.") },
  { k: "o_vkof", ph: "h0", at: 4, t: () => "VKOF nachmessen (Lund-Browder; Grad 1 zählt nicht) — ändert die Rule of 10", inp: [{ f: "vkof", l: "VKOF", u: "%" }, { f: "tief", l: "2b/3", u: "%" }],
    info: I("Grad 1 (Erythem) hat kein relevantes Kapillarleck. Präklinische Schätzungen weichen oft ab — überschätzt bei kleinen, unterschätzt bei Adipösen; jede Überschätzung bedeutet Überinfusion.") },
  { k: "o_iap", ph: "h0", at: 4, cond: (x) => x.c.vk > 20 || x.c.inhal, t: () => "IAP (Blasendruck) alle 4 h — Messung etabliert",
    info: I("Darmwand- und Mesenterialödem plus Aszites unter hohen Volumina → intraabdominelle Hypertonie (≥ 12 mmHg) bis zum abdominellen Kompartmentsyndrom (> 20 mmHg mit neuer Organdysfunktion: Oligurie, Beatmungsdruck ↑).",

  { k: "o_alb", ph: "h0", at: 6, t: () => "Ab h 6: Gerinnung prüfen — FFP nur nach Gerinnungssituation · Albumin 20 % nur erwägen (ab h 8 nach SOP)",

      "Navickis et al. (J Burn Care Res 2016, Meta-Analyse): Albumin in der Schockphase mit geringerer Letalität und weniger Kompartmentsyndromen assoziiert. ABA 2024: Albumin bei großen Verbrennungen bzw. steigendem Bedarf, Zeitpunkt offen; FFP nicht routinemäßig.",
      "Volumentherapie: ab h 6 Albumin 100 ml je 1000 ml und FFP 1 je 1000 ml — auf der V1: h 6–8 Albumin nur erwägen, FFP nur nach Gerinnung.") },

  { k: "y_alb", ph: "h8", at: 8, t: (x) => { const r = valAt(rateHist(x.p), x.c.now); return `Albumin 20 % per Perfusor: 100 ml je 1000 ml Volumen${r ? ` ≈ <b>${r0(numDE(r.v) / 10)} ml/h</b>` : ""} — Ziel-Albumin 2,2–2,7 g/dl`; },

    info: I("Hypoalbuminämie senkt den onkotischen Druck und verstärkt das Ödem auch in nicht verbrannter Haut; nach Abklingen des Lecks hält Albumin Volumen im Gefäß und spart Kristalloid.", "Navickis 2016 (Meta-Analyse): weniger Letalität und Kompartmentsyndrome; ABA 2024: Albumin empfohlen bei großen Verbrennungen.", "Volumentherapie: Albumin 20 % Perfusor 100 ml je 1000 ml Volumen, Ziel 2,2–2,7 g/dl (Labor in g/dl).") },
  { k: "y_na", ph: "h8", at: 8, t: () => "Natrium > 139 → Ringer-Azetat auf Deltajonin umstellen (Ziel 135–139)", inp: [{ lab: "Na+", u: "mmol/l" }],

  { k: "y_ivy", ph: "h8", at: 8, t: (x) => `Ivy-Index im Blick: 250 ml/kg = <b>${x.c.ivy ? tsd(x.c.ivy) + " ml" : "___"}</b> in 24 h → Gefahr abdominelles Kompartmentsyndrom`,

  { k: "y_ck", ph: "h8", at: 8, cond: (x) => x.c.strom, t: () => "Strom: CK/Myoglobin seriell alle 6 h bis fallend — CK > 5.000 U/l bzw. Myoglobin > 4.000 ng/ml → SOP Crush", inp: [{ lab: "CK", u: "U/l" }, { lab: "Myoglobin", u: "µg/l" }],

  { k: "y_auge", ph: "h8", at: 8, cond: (x) => x.c.gesicht, t: () => "Gesichtsbeteiligung: Augen untersuchen (Fluoreszein, Lidschluss), Augenkonsil",
    info: I("Lidödem und spätere Lidretraktion führen zur Expositionskeratopathie; Hitze oder Chemikalien können eine Limbusischämie verursachen — früh erkennen, bevor das Ödem die Untersuchung unmöglich macht.") },
  { k: "y_bz", ph: "h8", at: 8, t: () => "BZ-Ziel 80–150 mg/dl (max. 180) — Insulin nach Schema",

  { k: "y_lab", ph: "h8", at: 12, t: () => "Laborkontrolle: Hb/Hk, Na/K, Laktat, CK, Albumin" },
  { k: "y_enox", ph: "h8", at: 12, t: () => "Enoxaparin beginnen — Anti-Xa 4 h nach der 3. Gabe",

  { k: "y_op", ph: "h8", at: 12, t: () => "OP-Plan: Exzision ≤ 72 h — Fläche, EK-Bereitstellung (1 EK je 2,5 % Fläche), TXA, Aufklärung",

  /* ---- h 24–48 ---- */
  { k: "g_rate", ph: "h24", at: 24, t: () => "Rate schrittweise senken (−10 % bei erfüllten Zielen) — Schockphase endet h 48",

  { k: "g_mb", ph: "h24", at: 24, t: (x) => { const k = x.c.ibw ? 24 * x.c.ibw : null; return `Ernährung Tag 2: 75 % von 24 kcal/kg Idealgewicht${k ? ` = <b>${r0(0.75 * k)} kcal ≈ ${r0(0.75 * k / 1.5 / 24)} ml/h</b> Fresubin HPenergy` : " (Größe/Geschlecht fehlt)"}; Zink, Selen, Vitamin E, Propranolol`; },
    info: I("Hypermetabolismus ab > 20 % VKOF: Grundumsatz bis 2,5-fach, katecholamingetrieben, anhaltend bis zu Jahren (Jeschke, PLoS One 2011); Muskelabbau ist die Folge, wenn nicht gegengesteuert wird.",
      "Propranolol: Herndon et al. (NEJM 2001, Kinder) senkt Ruheumsatz und Katabolie; Ali et al. (Crit Care 2015, Erwachsene) schnellere Wundheilung. Spurenelemente: Berger et al. (Am J Clin Nutr 2007) weniger Infektionen. Glutamin: RE-ENERGIZE (Heyland, NEJM 2022) ohne Nutzen — nicht routinemäßig.",

  { k: "t3_ern", ph: "t3", at: 48, t: (x) => { const k = x.c.ibw ? 24 * x.c.ibw : null; return `Ernährung 100 %${k ? `: <b>${r0(k)} kcal/d ≈ ${r0(k / 1.5 / 24)} ml/h</b>` : ""} Fresubin HPenergy (Tag 3–5 nach Toleranz), Protein 1,5 g/kg`; },

  { k: "t3_axa", ph: "t3", at: 48, t: () => "Anti-Xa nach der 3. Enoxaparin-Gabe kontrolliert, Dosis angepasst", inp: [{ lab: "Anti-Xa", u: "IE/ml" }] },

  { k: "t3_sepsis", ph: "t3", at: 48, t: () => "Ab Tag 3 täglich Sepsis-Trigger (ABA): Temp > 39 / < 36,5 °C, HF > 110, AF > 25, Thrombozyten ↓, Insulinbedarf ↑, Nahrungsintoleranz",

const INFO_CO = I("CO bindet etwa 250-mal stärker an Hämoglobin als O2, verschiebt die Bindungskurve nach links und hemmt die Cytochromoxidase. Das Pulsoxymeter misst COHb als Oxyhämoglobin mit — SpO2 normal trotz Gewebehypoxie.",
  "COHb-Halbwertszeit: Raumluft etwa 4–5 h, 100 % O2 etwa 60–90 min, HBO etwa 20–30 min. Weaver et al. (NEJM 2002): HBO senkte kognitive Spätfolgen nach CO-Vergiftung; bei Brandverletzten meist logistisch limitiert → Einzelfall.",
  "Inhalationstrauma: 100 % O2 (HFNC, Reservoirmaske, bei Vigilanzminderung Intubation); COHb > 10 % → 6 h Sauerstoff.");

const INFO_IHT = I("Hitze und Ruß schädigen das Bronchialepithel; Exsudat und Fibrin bilden Casts, die kleine Atemwege verlegen; Surfactant-Störung und Pneumonierisiko steigen.",
  "Miller et al. (J Burn Care Res 2009, retrospektiv): vernebeltes Heparin plus Acetylcystein mit besserer Lungenfunktion; insgesamt geringe Evidenz. Lungenprotektive Beatmung nach ARDSNet (NEJM 2000).",
  "Inhalationstrauma: Heparin p.i. bei Rußablagerungen 4–6 × 10.000 IE + 3 ml MucoClear; β2-Mimetika 4–6 ×/d; VT 6 ml/kg, hoher PEEP; Antibiotika nur bei Pneumonie.");
function coVerdacht(p) {
  const d = c48Of(p).done || {};
  const co = serOf(p, "lab:COHb").map((v) => numDE(v.v)).filter((n) => n != null);
  if (d.rg_cohb || d.rg_spo2 || co.some((n) => n >= 10)) return true;
  return !!((d.rg_raum || d.rg_russ || burnOf(p).inhal) && (d.rg_bew || d.rg_cosy) && !co.length);
}
function cyanVerdacht(p) {
  const d = c48Of(p).done || {};
  const lak = last(serOf(p, "lab:Laktat"));
  const lv = lak ? numDE(lak.v) : null;
  const expo = d.rg_raum || d.rg_russ || burnOf(p).inhal;
  const zeichen = d.rg_bew || d.rg_kreis || d.rg_lak || (lv != null && lv > 10);
  return !!(expo && zeichen);
}
function intoxRelevant(p, c) {
  const d = c48Of(p);
  const dn = d.done || {};
  return c.inhal || !!d.geschl || (d.mech || []).some((m) => m === "flamme" || m === "expl") || [...C48_EXPO, ...C48_CO_RG, ...C48_CN_RG].some(([k]) => dn[k]) || serOf(p, "lab:COHb").length > 0;
}
const NICHT = [
  ["Keine Kühlung bei > 10 % VKOF", I("Hypothermie verstärkt Koagulopathie und Letalität; die Kühlung hilft nur in den ersten Minuten bei kleinen Flächen.", "AWMF S2k 044-001 (2025): keine Kühlung bei > 10 % VKOF.")],

  ["Kein HES, keine Gelatine", I("Kolloide auf Stärke- bzw. Gelatinebasis lagern sich ab und schädigen die Niere; im Kapillarleck kein Vorteil.", "HES bei kritisch Kranken mit mehr Nierenersatz und Letalität (6S, NEJM 2012; CHEST 2012); AWMF 2025: kein HES, keine Gelatine.")],
  ["h 0–48 kein NaCl 0,9 %, Jonosteril oder Ringer-Laktat — Ringer-Azetat", I("NaCl 0,9 %: hyperchlorämische Azidose; laktathaltige Lösung verfälscht Laktat als Perfusionsmarker.", null, "Volumentherapie und Natriumstörungen: Ringer-Azetat, im Haus laktatfreie Lösungen; Na⁺ > 139 → Deltajonin.")],

/* Status eines Checklistenpunkts */
function itemState(p, c, it) {
  if (isDone(p, it.k)) return "done";
  if (bsOf(p).na[it.k]) return "na";
  const ph = PH_BY[it.ph];
  const at = it.at != null ? it.at : ph.at;
  let to = it.to != null ? it.to : ph.to;
  if (it.ph === "auf") to = Math.max(to, c.aufH + 2);
  if (c.h == null) return it.ph === "auf" ? "due" : "wait";
  if (c.h < at) return "wait";
  if (c.h <= to) return "due";
  return "over";
}
function itemWin(c, it) {
  const ph = PH_BY[it.ph];
  const at = it.at != null ? it.at : ph.at;
  let to = it.to != null ? it.to : ph.to;
  if (it.ph === "auf") to = Math.max(to, c.aufH + 2);
  return { at, to };
}
function visItems(p, c, ph) { const x = { p, c }; return ITEMS.filter((it) => (!ph || it.ph === ph) && (!it.cond || it.cond(x))); }
function intoxItems(p) {
  const L = [];
  if (coVerdacht(p)) L.push(...C48_CO_RH);
  if (cyanVerdacht(p)) L.push(...C48_CN_RH);
  if (burnOf(p).inhal || isDone(p, "rg_russ")) L.push(...C48_IHT);
  return L;
}

/* Laufende Aufgaben mit Fälligkeit */
function laufend(p, c) {
  const L = [];
  const now = c.now;
  if (c.schock) {
    const di = diuInfo(p);
    const nx = di.lastE ? hourRound(di.lastE.t) + H : hourFloor(now);
    L.push({ k: "diu", t: "Stundendiurese + Reevaluation", due: nx, st: now >= nx + 10 * MIN ? "o" : now >= nx - 5 * MIN ? "d" : "", info: di.lastB ? `zuletzt ${r0(di.lastB.v)} ml (${fHH(di.lastB.h - H)}–${fHH(di.lastB.h)} Uhr)` : "noch kein Wert" });
    if (c.vk > 20 || c.inhal) {
      const s = serOf(p, "iap"), li = last(s);
      const nxi = li ? tMs(li.t) + 4 * H : now;
      L.push({ k: "iap", t: "IAP (Blasendruck) alle 4 h", due: nxi, st: now >= nxi + 15 * MIN ? "o" : now >= nxi - 10 * MIN ? "d" : "", info: li ? `zuletzt ${li.v} mmHg um ${fT(li.t)}` : "noch keine Messung", inp: "iap" });
    }
  }
  if (c.strom && c.h != null && c.h < 72) {
    const s = serOf(p, "lab:CK"), lc = last(s);
    const fall = s.length >= 2 && c.h > 24 && numDE(lc.v) < numDE(s[s.length - 2].v);
    if (!fall) {
      const nx = lc ? tMs(lc.t) + 6 * H : now;
      const mx = s.reduce((m, x) => Math.max(m, numDE(x.v) || 0), 0);
      L.push({ k: "ck", t: "CK/Myoglobin alle 6 h bis fallend", due: nx, st: now >= nx + 15 * MIN ? "o" : now >= nx - 10 * MIN ? "d" : "", info: lc ? `CK zuletzt ${lc.v} U/l · Max ${tsd(mx)}${mx > 5000 ? " → SOP Crush" : ""}` : "noch kein Wert", inp: "ck" });
    }
  }
  if (coVerdacht(p) && !isDone(p, "rh_cobga")) {
    const o2 = bsOf(p).doneT.rh_o2;
    const nx = o2 ? tMs(o2) + 6 * H : now;
    L.push({ k: "co", t: "COHb-Kontrolle nach 6 h O2", due: nx, st: now >= nx ? "d" : "", info: o2 ? `100 % O2 seit ${fT(o2)}` : "Start 100 % O2 abhaken", inp: "cohb" });
  }
  if (c.h != null && c.h >= 48 && piccoAktiv(p)) {
    const s = serOf(p, "picco"), lp = last(s);
    const nx = lp ? tMs(lp.t) + 8 * H : now;
    L.push({ k: "picco", t: "PiCCO-Messung 1 × pro Schicht", due: nx, st: now >= nx ? "d" : "", info: lp ? `zuletzt ${fRel(tMs(lp.t))}${lp.hi != null ? ` · HI ${fN(numDE(lp.hi), 1)}` : ""}` : "noch keine Messung" });
  }
  return L;
}
function dueList(p, c) {
  const out = [];
  if (c.vk != null && c.vk < 20) return out;
  ITEMS.forEach((it) => {
    if (it.cond && !it.cond({ p, c })) return;
    const st = itemState(p, c, it);
    if (st === "due" || st === "over") out.push({ it, st });
  });
  intoxItems(p).forEach(([k, t]) => { if (!isDone(p, k) && !bsOf(p).na[k]) out.push({ it: { k, t: () => t, ph: "iv" }, st: "due" }); });
  return out.sort((a, b) => (a.st === "over" ? 0 : 1) - (b.st === "over" ? 0 : 1));
}

/* ---------- Ansicht ---------- */
const APP = document.getElementById("app");

function toast(t) { UI.toast = t; clearTimeout(toast.tm); toast.tm = setTimeout(() => { UI.toast = ""; render(); }, 2600); }

function vHeader(pats, cur) {

function vPatient(p) {
  const c = calc(p);

  let h = vBar(p, c);

function kv(l, v, miss, big) { return `<div class="kv${big ? " big" : ""}"><small>${l}</small><b class="${miss ? "miss" : ""}">${v}</b></div>`; }

  t.push(kv("VKOF", c.vk != null ? `${fN(c.vk, 1)} %${c.tief != null ? ` (2b/3: ${fN(c.tief, 0)} %)` : ""}` : "fehlt", c.vk == null, true));
  t.push(kv("Unfall", c.u != null ? fWDT(c.u) : "fehlt", c.u == null));

/* ---------- Checkliste ---------- */

const cbx = (f, on, t) => `<label><input type="checkbox" id="f_${f}" data-f="${f}"${on ? " checked" : ""}> ${t}</label>`;

  if (f === "zimmer") {
    const z = Number(v);
    if (Object.values(readB().patients).some((x) => x.id !== pid && Number(x.zimmer) === z)) { toast(`Zimmer ${z} ist belegt`); render(); return; }
  }
  if (f.indexOf("dev:") === 0) { upd(pid, (q) => devUpsert(q, f.slice(4), v.trim(), null)); return; }
  if (FIELD[f]) upd(pid, (q) => FIELD[f](q, v, on));
}
function setRate(pid, kind, t, n) {
  upd(pid, (q) => {
    if (kind === "alb") { const bs = bsMut(q); bs.alb = insSorted(bs.alb, { id: uid(), t: isoOf(t), v: n }); return; }
    let h = (q.infRate || []).slice().sort(byT);
    const legacy = numDE(burnOf(q).rate);
    if (!h.length && legacy != null && legacy !== n) h.push({ id: uid(), t: EPOCH, v: legacy });
    h = insSorted(h, { id: uid(), t: isoOf(t), v: n });
    q.infRate = h.slice(-80);
    if (t >= Date.now() - 5 * MIN) setBurn(q, { rate: String(n) });
  });
}
function commitCell(el) {
  const pid = UI.sel;
  const kind = el.dataset.kind;
  const S = Number(el.dataset.s), E = S + H;
  const raw = el.value.trim();
  const n = numDE(raw);
  const tLab = Math.min(E - 5 * MIN, Date.now());
  if (raw !== "" && n == null && kind !== "rek") return toast("Zahl erwartet");
  const B = readB();
  const p0 = B.patients[pid];
  if (!p0) return;
  if (kind === "diu") {
    if (n != null && (n < 0 || n > 6000)) return toast("Diurese unplausibel");
    const di = diuInfo(p0);
    const ids = di.list.filter((e) => hourRound(e.t) === E).map((e) => e.id);
    if (n == null && !ids.length) return;
    upd(pid, (q) => {
      q.diurese = (q.diurese || []).filter((e) => ids.indexOf(e.id) < 0);
      if (n != null) q.diurese = insSorted(q.diurese, { id: uid(), t: isoOf(E), v: String(Math.round(n)) });
    });
    ids.forEach((id) => mirDrop(pid, "diurese", id));
    if (n != null) {
      const prev = last(di.list.filter((e) => hourRound(e.t) < E && ids.indexOf(e.id) < 0));
      const gap = prev ? Math.round((E - hourRound(prev.t)) / H) : 1;
      if (gap > 1 && gap <= 12) toast(`${Math.round(n)} ml gelten seit dem letzten Eintrag ${fT(hourRound(prev.t))} (${gap} h, Ø ${Math.round(n / gap)} ml/h) — fehlende Stunde zuerst eintragen, falls es ein Stundenwert war`);
    }
    return;
  }
  if (kind === "rate" || kind === "alb") {
    const hist = kind === "rate" ? (p0.infRate || []) : bsOf(p0).alb;
    const inH = hist.filter((x) => { const t = tMs(x.t); return x.t !== EPOCH && t >= S && t < E; }).sort(byT);
    const lx = last(inH);
    if (n != null && (n < 0 || n > 5000)) return toast("Rate unplausibel");
    if (n == null && !lx) return;
    upd(pid, (q) => {
      if (kind === "rate") {
        let h = (q.infRate || []).slice();
        if (lx) h = h.filter((x) => x.id !== lx.id);
        if (n != null) h = insSorted(h, { id: lx ? lx.id : uid(), t: lx ? lx.t : isoOf(S), v: Math.round(n) });
        q.infRate = h.sort(byT).slice(-80);
        const ln = last(q.infRate);
        if (ln) setBurn(q, { rate: String(ln.v) });
      } else {
        const bs = bsMut(q);
        let h = (bs.alb || []).slice();
        if (lx) h = h.filter((x) => x.id !== lx.id);
        if (n != null) h = insSorted(h, { id: lx ? lx.id : uid(), t: lx ? lx.t : isoOf(S), v: Math.round(n) });
        bs.alb = h;
      }
    });
    if (lx && n == null && kind === "rate") mirDrop(pid, "infRate", lx.id);
    return;
  }
  if (kind === "lak" || kind === "scv") {
    const name = kind === "lak" ? "Laktat" : "ScvO2";
    const ex = last(serOf(p0, "lab:" + name).filter((x) => { const t = tMs(x.t); return t >= S && t < E; }));
    if (raw === "" && !ex) return;
    upd(pid, (q) => labSet(q, name, ex ? tMs(ex.t) : tLab, raw, ex ? ex.id : null));
    if (ex && raw === "") mirDrop(pid, "lab:" + name, skey(ex));
    return;
  }
  if (kind === "hi") {
    const ex = last(serOf(p0, "picco").filter((x) => { const t = tMs(x.t); return t >= S && t < E && x.hi != null; }));
    if (n != null && (n < 0.5 || n > 10)) return toast("HI unplausibel");
    if (n == null && !ex) return;
    upd(pid, (q) => {
      let a = (q.picco || []).slice();
      if (ex) {
        const i = a.findIndex((x) => x.id === ex.id);
        if (i >= 0) { if (n == null) { const o = { ...a[i] }; delete o.hi; a[i] = o; if (!["gedi", "svri", "elwi", "cpi"].some((k) => o[k] != null)) a.splice(i, 1); } else a[i] = { ...a[i], hi: n }; }
      } else if (n != null) a = insSorted(a, { id: uid(), t: isoOf(tLab), hi: n });
      q.picco = a.slice(-40);
      if (n != null && !q.piccoAus) q.piccoAn = true;
    });
    if (ex && n == null) mirDrop(pid, "picco", ex.id);
    return;
  }
  if (kind === "iap") {
    const ex = last(serOf(p0, "iap").filter((x) => { const t = tMs(x.t); return t >= S && t < E; }));
    if (n != null && (n < 0 || n > 60)) return toast("IAP unplausibel");
    if (n == null && !ex) return;
    upd(pid, (q) => {
      let a = (q.iap || []).filter((x) => !ex || x.id !== ex.id);
      if (n != null) a = insSorted(a, { id: ex ? ex.id : uid(), t: ex ? ex.t : isoOf(tLab), v: String(n) });
      q.iap = a.slice(-60);
    });
    if (ex && n == null) mirDrop(pid, "iap", ex.id);
    return;
  }
  if (kind === "rek") {
    upd(pid, (q) => {
      const bs = bsMut(q);
      let a = (bs.rekap || []).filter((x) => { const t = tMs(x.t); return !(t >= S && t < E); });
      if (raw) a = insSorted(a, { id: uid(), t: isoOf(tLab), v: raw });
      bs.rekap = a;
      const lr = last(a);
      if (lr && (!q.rekap || q.rekap.t <= lr.t)) q.rekap = { v: lr.v, t: lr.t };
    });
  }
}
function tFromInput(id) { const v = document.getElementById(id); return v ? hhmmVor(v.value, Date.now()) : null; }

/* ---------- Aktionen ---------- */
function act(a, el) {
  const pid = UI.sel;
  const ds = el.dataset;
  switch (a) {
    case "sel": UI.sel = ds.id; UI.open = {}; UI.fold = {}; saveUI(); break;
    case "tab": UI.tab = ds.v; if (ds.auf) { UI.tab = "check"; UI.fold.sr = false; } saveUI(); window.scrollTo(0, 0); break;
    case "info": UI.open[ds.k] = !UI.open[ds.k]; break;
    case "fold": { const k = ds.k; const cur = document.querySelector(`[data-act="fold"][data-k="${k}"] .fold`); const isOpen = cur && cur.textContent === "▾"; UI.fold[k] = isOpen; break; }
    case "hist": UI.hist = !UI.hist; break;
    case "tick": if (pid) upd(pid, (q) => toggleDone(q, ds.k)); return;
    case "na": if (pid) upd(pid, (q) => { const bs = bsMut(q); bs.na = { ...bs.na }; if (bs.na[ds.k]) delete bs.na[ds.k]; else bs.na[ds.k] = true; }); return;
    case "set": if (pid) upd(pid, (q) => { const k = ds.f.slice(2); setC48(q, k, c48Of(q)[k] === ds.v ? "" : ds.v); }); return;
    case "setrate": if (pid) { setRate(pid, "ra", Date.now(), Number(ds.v)); toast(`Laufrate ${ds.v} ml/h ab ${fT(Date.now())}`); } return;
    case "albset": if (pid) { setRate(pid, "alb", Date.now(), Number(ds.v)); toast(`Albumin ${ds.v} ml/h ab ${fT(Date.now())}`); } return;
    case "lsg": if (pid) upd(pid, (q) => { bsMut(q).lsg = ds.v; }); return;
    case "hd": if (pid) upd(pid, (q) => { bsMut(q).hd = ds.v; }); return;
    case "rekap": if (pid) upd(pid, (q) => { const bs = bsMut(q); const e = { id: uid(), t: nowISO(), v: ds.v }; bs.rekap = insSorted(bs.rekap, e).slice(-200); q.rekap = { v: ds.v, t: e.t }; }); return;
    case "addrate": {
      const t = tFromInput("n_rt"), n = numDE((document.getElementById("n_rv") || {}).value);
      if (t == null || n == null || n < 0 || n > 5000) return toast("Uhrzeit und Rate eintragen");
      setRate(pid, (document.getElementById("n_rk") || {}).value === "alb" ? "alb" : "ra", t, Math.round(n));
      toast("Rate ab " + fT(t) + " eingetragen");
      return;
    }
    case "adddiu": {
      const von = tFromInput("n_dv"), bis = tFromInput("n_db"), n = numDE((document.getElementById("n_dm") || {}).value);
      if (von == null || bis == null || n == null) return toast("von, bis und ml eintragen");
      const a = hourRound(von), b = hourRound(bis);
      if (b <= a) return toast("„bis“ muss nach „von“ liegen");
      const p0 = readB().patients[pid];
      const list = diuInfo(p0).list;
      const before = list.filter((e) => hourRound(e.t) <= a);
      const inside = list.filter((e) => { const t = hourRound(e.t); return t > a && t <= b; });
      if (inside.length) return toast("Zeitraum überschneidet vorhandene Diurese-Einträge");
      const lb = last(before);
      if (lb && hourRound(lb.t) < a) return toast(`Zwischen ${fT(hourRound(lb.t))} und ${fT(a)} fehlt die Diurese — erst dort eintragen`);
      const nh = Math.round((b - a) / H);
      upd(pid, (q) => {
        if (lb) q.diurese = insSorted(q.diurese, { id: uid(), t: isoOf(b), v: String(Math.round(n)) });
        else for (let k = 1; k <= nh; k++) q.diurese = insSorted(q.diurese, { id: uid(), t: isoOf(a + k * H), v: String(Math.round(n / nh)) });
      });
      toast(`Diurese ${n} ml (${fT(a)}–${fT(b)}) eingetragen`);
      return;
    }
    case "addextra": {
      const t = tFromInput("n_xt"), art = (document.getElementById("n_xa") || {}).value, n = numDE((document.getElementById("n_xm") || {}).value);
      if (t == null || n == null || n <= 0) return toast("Uhrzeit und Menge eintragen");
      upd(pid, (q) => {
        if (art === "FFP" || art === "EK") q.transf = (q.transf || []).concat([{ id: uid(), t: isoOf(t), prod: art, n: Math.round(n), ind: "Schockphase" }]).slice(-200);
        else { const bs = bsMut(q); bs.extra = insSorted(bs.extra, { id: uid(), t: isoOf(t), art, ml: Math.round(n) }); }
      });
      toast("Zusatzgabe eingetragen");
      return;
    }
    case "delextra": if (pid) upd(pid, (q) => { if (ds.src === "tf") q.transf = (q.transf || []).filter((e) => e.id !== ds.id); else { const bs = bsMut(q); bs.extra = bs.extra.filter((e) => e.id !== ds.id); } }); return;
    case "deldiu": { const ids = ds.ids.split(","); upd(pid, (q) => { q.diurese = (q.diurese || []).filter((e) => ids.indexOf(e.id) < 0); }); ids.forEach((id) => mirDrop(pid, "diurese", id)); return; }
    case "menu": UI.menu = !UI.menu; break;
    case "dlg": UI.dlg = ds.v; UI.menu = false; break;
    case "close": UI.dlg = null; break;
    case "print": doPrint(ds.v); return;
    case "reload": location.reload(); return;
    case "updcheck": UI.menu = false; checkUpdate(true); break;
    case "notif": UI.menu = false; toggleNotif(); break;
    case "create": createPatient(); return;
    case "adopt": adoptPatient(); return;
    default: return;
  }
  render();
}
function createPatient() {
  const g = (id) => (document.getElementById(id) || {}).value || "";
  const B = readB();
  const z = Number(g("np_z"));
  if (!(z >= 1 && z <= 8)) return toast("Kein freies Zimmer — in BurnICU erst entlassen");
  if (Object.values(B.patients).some((x) => Number(x.zimmer) === z)) return toast("Zimmer belegt");
  const mech = Array.from(document.querySelectorAll(".np_m:checked")).map((x) => x.value);
  const iht = !!(document.getElementById("np_iht") || {}).checked;
  const vk = g("np_vk").trim();
  const mt = MECH.filter((m) => mech.indexOf(m[0]) >= 0).map((m) => m[2]).join(" + ");
  const p = newPatient({ name: g("np_name").trim(), zimmer: z || 1, gewicht: g("np_kg").trim(), groesse: g("np_cm").trim(), sex: g("np_s"),
    diagnose: `${mt || "Verbrennung"}${vk ? ", " + vk + " % VKOF" : ""}${iht ? ", Inhalationstrauma" : ""}`,
    burn: { ...emptyBurn(), unfall: g("np_u") ? new Date(g("np_u")).toISOString() : "", vkof: vk, tief: g("np_t").trim(), alter: g("np_a").trim(), inhal: iht, strom: mech.indexOf("strom") >= 0 },
    c48: { done: {}, mech } });
  B.patients[p.id] = p;
  writeB(B);
  UI.sel = p.id; UI.dlg = null; UI.tab = "check"; UI.fold = {};
  saveUI();
  refresh();
  toast("Angelegt — auch in BurnICU sichtbar");
}
function adoptPatient() {
  const id = (document.getElementById("np_ex") || {}).value;
  if (!id) return;
  upd(id, (q) => { if (!BURN_DX_RE.test(q.diagnose || "")) q.diagnose = (q.diagnose ? q.diagnose + ", " : "") + "Verbrennung"; });
  UI.sel = id; UI.dlg = null; UI.tab = "check"; UI.fold = { sr: false };
  saveUI();
  render();
}

/* ---------- Rendern, Ereignisse, Takt ---------- */
function render() {
  const ae = document.activeElement;
  let keep = null;
  if (ae && ae.id && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) keep = { id: ae.id, v: ae.value, dirty: ae.tagName !== "SELECT" && ae.type !== "checkbox" && ae.value !== ae.defaultValue, s: ae.selectionStart, e: ae.selectionEnd };
  const sx = window.scrollX, sy = window.scrollY;
  const tw = document.querySelector(".tblw");
  const tws = tw ? [tw.scrollLeft, tw.scrollTop] : null;
  APP.innerHTML = view();
  window.scrollTo(sx, sy);
  const tw2 = document.querySelector(".tblw");
  if (tw2 && tws) { tw2.scrollLeft = tws[0]; tw2.scrollTop = tws[1]; }
  const fid = UI.focusNext || (keep && keep.id);
  UI.focusNext = null;
  if (fid) {
    const el = document.getElementById(fid);
    if (el) {
      el.focus({ preventScroll: true });
      if (keep && keep.id === fid && keep.dirty) el.value = keep.v;
      try { if (keep && keep.id === fid && keep.s != null) el.setSelectionRange(keep.s, keep.e); else if (el.select && el.tagName === "INPUT") el.select(); } catch (e) {}
    }
  }
  const B = lastB || readB();
  let n = 0;
  burnPats(B).forEach((p) => { const c = calc(p); if (c.vk == null || c.vk >= 20) n += dueList(p, c).filter((x) => x.st === "over").length + laufend(p, c).filter((x) => x.st === "o").length; });
  document.title = (n ? `(${n}) ` : "") + "BurnStart";
}
function refresh() {
  try { syncMirror(readB()); } catch (e) {}
  render();
  notifyTick();
}
let committing = false;
APP.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("dlgbg") && e.target !== el) return;
  e.preventDefault();
  act(el.dataset.act, el);
});
APP.addEventListener("change", (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.f) return;
  if (el.dataset.committed) { delete el.dataset.committed; return; }
  committing = true;
  setTimeout(() => { committing = false; commitField(el); }, 0);
});
APP.addEventListener("keydown", (e) => {
  const el = e.target;
  if (e.key !== "Enter" || !el.dataset || !el.dataset.f || el.tagName === "TEXTAREA") return;
  e.preventDefault();
  if (el.dataset.f === "cell") {
    const col = el.dataset.col, i = Number(el.dataset.i);
    const nx = APP.querySelector(`[data-col="${col}"][data-i="${i + 1}"]`);
    UI.focusNext = nx ? nx.id : null;
  }
  el.dataset.committed = "1";
  if (el.value !== el.defaultValue || el.type === "checkbox") commitField(el);
  else if (UI.focusNext) { const nx = document.getElementById(UI.focusNext); UI.focusNext = null; if (nx) { nx.focus(); try { nx.select(); } catch (x) {} } }
});
window.addEventListener("storage", (e) => {
  if (e.key === BKEY || e.key === null) {
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && ae.value !== ae.defaultValue) { pendingRender = true; return; }
    refresh();
  }
});
let pendingRender = false;
APP.addEventListener("focusout", () => { if (pendingRender) { pendingRender = false; setTimeout(refresh, 30); } });
setInterval(() => {
  const ae = document.activeElement;
  if (UI.dlg || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) { notifyTick(); return; }
  refresh();
}, 60 * 1e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { refresh(); checkUpdate(false); } });
window.addEventListener("afterprint", () => { document.getElementById("print").innerHTML = ""; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (UI.dlg || UI.menu)) { UI.dlg = null; UI.menu = false; render(); } });

/* ---------- Erinnerungen (Browser-Benachrichtigung, solange die App offen ist) ---------- */
const notified = new Set();
function toggleNotif() {
  if (UI.notif) { UI.notif = false; saveUI(); toast("Erinnerungen aus"); return; }
  if (!("Notification" in window)) return toast("Dieser Browser kann keine Benachrichtigungen");
  Notification.requestPermission().then((r) => {
    UI.notif = r === "granted";
    saveUI();
    toast(UI.notif ? "Erinnerungen an — solange die App offen ist" : "Benachrichtigungen im Browser nicht erlaubt");
    render();
  });
}
function notifyTick() {
  if (!UI.notif || !("Notification" in window) || Notification.permission !== "granted") return;
  const B = lastB || readB();
  burnPats(B).forEach((p) => {
    const c = calc(p);
    if (c.vk != null && c.vk < 20) return;
    const msgs = [];
    laufend(p, c).forEach((x) => { if (x.st) msgs.push([`${p.id}:${x.k}:${x.due}`, `${x.t} ${x.st === "o" ? "überfällig" : "fällig"}`]); });
    dueList(p, c).forEach(({ it, st }) => msgs.push([`${p.id}:${it.k}:${st}`, (st === "over" ? "überfällig: " : "fällig: ") + it.t({ p, c }).replace(/<[^>]+>/g, "").slice(0, 90)]));
    msgs.forEach(([k, t]) => {
      if (notified.has(k)) return;
      notified.add(k);
      try { new Notification(`Zi ${p.zimmer} ${p.name || ""}`.trim(), { body: t, tag: k, icon: "icons/icon-192.png" }); } catch (e) {}
    });
  });
}
/* beim Start die bereits fälligen Punkte nicht alle auf einmal melden */
(function primeNotified() {
  try {
    const B = readB();
    burnPats(B).forEach((p) => { const c = calc(p); dueList(p, c).forEach(({ it, st }) => notified.add(`${p.id}:${it.k}:${st}`)); laufend(p, c).forEach((x) => { if (x.st === "o") notified.add(`${p.id}:${x.k}:${x.due}`); }); });
  } catch (e) {}
})();

/* ---------- Update und Offline ---------- */
function checkUpdate(manual) {
  if (!/^https?:/.test(location.protocol)) { if (manual) toast("Update-Prüfung nur online"); return; }
  fetch("version.json?u=" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((j) => {
    if (j && j.version && j.version !== APP_VERSION) { UI.upd = j.version; render(); }
    else if (manual) toast("Aktuell: v" + APP_VERSION);
  }).catch(() => { if (manual) toast("Offline — keine Prüfung möglich"); });
}
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
const qp = new URLSearchParams(location.search);
if (qp.get("p")) { UI.sel = qp.get("p"); if (qp.get("tab")) UI.tab = qp.get("tab"); saveUI(); }
window.BS = { calc, plan, readB, diuHours, vol, evalAt, ITEMS, itemState, laufend, dueList, printCheck, printVol, APP_VERSION };
refresh();
checkUpdate(false);
})();
</script>
