function renderBeds(){
  let h = `<div class="card"><h3>Station</h3>
    <div class="tiny">Tippe auf ein Bett, um Daten zu erfassen. In der Patientenansicht wechselst du mit einer Wischgeste nach links oder rechts das Bett; der Griff unter der Zeitachse öffnet die 24-Stunden-Übersicht.</div></div>
    <div class="beds">`;
  S.beds.forEach(p=>{
    const c = calc(p);
    const occupied = !!(p.label || p.weight || p.tbsa || p.injury);
    const A = occupied ? alerts(p,c) : [];
    const worst = A.some(a=>a.lv==="e") ? "e" : A.some(a=>a.lv==="w") ? "w" : null;
    h += `<button class="bed${occupied?" occ":""}" data-bed="${p.id}">
      <div class="no">Bett ${p.id}</div>
      <div class="lb ${occupied?"":"free"}">${occupied ? esc(p.label||"ohne Kürzel") : "frei"}</div>`;
    if(c.day!=null) h += `<div class="day">Tag ${c.day}</div>`;
    if(occupied){
      const bits=[];
      if(c.tbsa!=null) bits.push(`${r0(c.tbsa)} % VKOF`);
      if(c.kg!=null)   bits.push(`${r0(c.kg)} kg`);
      if(c.absi!=null) bits.push(`ABSI ${c.absi}`);
      h += `<div class="meta">${bits.join(" · ")||"&nbsp;"}</div><div class="flags">`;
      if(c.uoAct==="up"||c.uoAct==="down") h += `<span class="fl w">Diurese ${c.uoAct==="up"?"↓":"↑"}</span>`;
      if(c.abaHits && c.abaHits.length>=3) h += `<span class="fl e">Sepsis-Trigger</span>`;
      if(c.wGraftHold && c.wGraftHold.length) h += `<span class="fl i">Graft POD ${c.wGraftHold[0].pod}</span>`;
      if(p.inhal)  h += `<span class="fl i">Inhalation</span>`;
      if(p.rhabdo) h += `<span class="fl i">Rhabdo</span>`;
      if(p.strom)  h += `<span class="fl i">Strom</span>`;
      if(worst==="e") h += `<span class="fl e">${A.filter(a=>a.lv==="e").length} kritisch</span>`;
      else if(worst==="w") h += `<span class="fl w">${A.filter(a=>a.lv==="w").length} prüfen</span>`;
      h += `</div>`;
    } else {
      h += `<div class="meta">&nbsp;</div>`;
    }
    h += `</button>`;
  });
  h += `</div>`;
  $("#v-beds").innerHTML = h;
  $("#v-beds").querySelectorAll("[data-bed]").forEach(b=>{
    b.onclick = ()=>{ S.cur = +b.dataset.bed; trFI=null; save(); go("pat"); };
  });
}


/* ---------- 24-Stunden-Plan: Volumenregime und Pflichtinterventionen ---------- */
function plan24(p,c){
  const A=[]; const t=c.tbsa;
  const add=(k,t0,t1,txt,cond)=>{ if(cond===undefined||cond) A.push({k,t0,t1,txt}); };
  add("vkof",   0,2,  "VKOF mit Lund-Browder nachmessen — nur Grad 2 und 3 zählen");
  add("bga",    0,1,  "BGA mit COHb, MetHb und Laktat");
  add("dk",     0,1,  "Blasenkatheter, stündliche Diurese als Steuerparameter");
  add("waerme", 0,24, "Wärme: Raum aufheizen, Warmluftdecke, Infusionen wärmen, Temperatur dokumentieren");
  add("eschar", 0,4,  "Escharotomie prüfen: > 2/3 Zirkumferenz, Beatmungsdruck, Doppler distal");
  add("analg",  0,2,  "Analgesiekonzept: Hintergrund- und Prozedurschmerz getrennt festlegen");
  add("lager",  0,2,  "Oberkörper 20–45°, Extremitäten hoch, Antikontrakturlagerung");
  add("tet",    0,4,  "Tetanusschutz prüfen");
  add("foto",   0,6,  "Fotodokumentation und Lund-Browder-Schema anlegen");
  add("broncho",0,6,  "Bronchoskopie: Ruß, Ödem, AIS-Grad dokumentieren — keine Steroide, keine Prophylaxe", p.inhal);
  add("auge",   0,6,  "Augenkonsil, Hornhautschutz" + (p.strom?" — Katarakt-Risiko":""), p.inhal || p.strom || t>=15);
  add("ck",     0,6,  "CK und Myoglobin, bei Myoglobinurie Zieldiurese 2 ml/kg/h", p.rhabdo||p.strom);
  add("ekg",    0,24, "EKG-Monitoring mindestens 24 h", p.rhabdo||p.strom);
  add("komp",   0,24, "Kompartment engmaschig prüfen, auch beim sedierten Patienten", p.strom||p.rhabdo);
  add("explor", 0,24, "Tiefenausdehnung nur intraoperativ beurteilbar — Hautläsion täuscht", p.strom);
  add("ern",    6,12, "Enterale Ernährung beginnen — niedrig starten, dann steigern");
  add("alb",    8,12, "Albumin erwägen bei Instabilität oder übermäßigem Bedarf");
  add("iap",    8,24, "IAP messen, mindestens 8-stündlich", t!=null && t>=30);
  add("bil",   12,12, "Kumulativbilanz gegen Ivy-Index prüfen");
  add("ulcus",  0,6,  "Ulkus- und Thromboembolieprophylaxe ansetzen");
  add("deesk", 24,24, "Volumen deeskalieren, VKOF und Tiefe neu bewerten");
  add("succ",  24,24, "Ab jetzt kein Succinylcholin mehr");
  add("op",    24,24, "Erste Nekrektomie planen — Flächen- und Zeitlimit vereinbaren");
  return A;
}

function renderPlan(p,c){
  if(c.pkTotal==null || c.h==null) return "";
  const items = plan24(p,c);
  const done = p.done||{};
  const nowPct = Math.min(100, Math.max(0, c.h/24*100));
  const past = c.h>=24;
  const pos = x => (x/24*100);
  // Pflichtpunkte, deren Fenster abgelaufen ist und die nicht abgehakt sind
  const overdue = items.filter(i=>!done[i.k] && c.h > i.t1);
  const openNow = items.filter(i=>!done[i.k] && c.h >= i.t0 && c.h <= i.t1);

  let h = `<details class="acc" data-k="plan" ${accOpen("plan", !past)}><summary>24-Stunden-Plan</summary><div class="body">`;

  // Grafik
  h += `<div class="plan">
    <div class="lane-lab">Volumen</div>
    <div class="lane">
      <div class="blk a" style="left:0;width:${pos(8)}%">
        <b>${r0(c.pkRate8)}</b> ml/h
        <span>Hälfte in 8 h</span>
      </div>
      <div class="blk b" style="left:${pos(8)}%;width:${pos(16)}%">
        <b>${r0(c.pkTotal/2/16)}</b> ml/h
        <span>Rest über 16 h</span>
      </div>
      ${!past?`<div class="now" style="left:${nowPct}%"></div>`:""}
    </div>
    <div class="lane-lab">Pflichtpunkte</div>
    <div class="lane m">
      ${(()=>{ const g={};
        items.forEach(i=>{ (g[i.t0]=g[i.t0]||[]).push(i); });
        return Object.keys(g).map(k=>{
          const t0=+k, grp=g[k];
          const anyOver = grp.some(i=>!done[i.k] && c.h>i.t1);
          const anyNow  = grp.some(i=>!done[i.k] && c.h>=i.t0 && c.h<=i.t1);
          const allDone = grp.every(i=>done[i.k]);
          const st = anyOver?"o":anyNow?"n":allDone?"d":"";
          const side = t0===0 ? "left:0;margin-left:0" : t0>=24 ? "right:0;margin-left:0" : `left:${pos(t0)}%`;
          return `<div class="tick ${st}" style="${side}"><span>${grp.length}</span></div>`;
        }).join(""); })()}
      ${!past?`<div class="now" style="left:${nowPct}%"></div>`:""}
    </div>
    <div class="ax">${[0,4,8,12,16,20,24].map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="axlab">Stunden ab Unfallzeitpunkt</div>
  </div>`;

  if(overdue.length) h += `<div class="note w"><b>${overdue.length} Punkt${overdue.length>1?"e":""} überfällig</b> — Zeitfenster abgelaufen und nicht abgehakt.</div>`;
  else if(openNow.length) h += `<div class="note i"><b>${openNow.length} Punkt${openNow.length>1?"e":""} jetzt fällig.</b></div>`;

  // Liste
  h += `<div class="plist">`;
  items.forEach(i=>{
    const st = done[i.k] ? "done" : (c.h>i.t1 ? "over" : (c.h>=i.t0 ? "now" : "fut"));
    const win = i.t0===i.t1 ? `ab ${i.t0} h` : `${i.t0}–${i.t1} h`;
    h += `<label class="prow ${st}">
      <input type="checkbox" data-plan="${i.k}" ${done[i.k]?"checked":""}>
      <span class="win">${win}</span>
      <span class="txt">${esc(i.txt)}</span>
    </label>`;
  });
  h += `</div>
  <div class="formula">Fenster orientierend nach Leitlinie und Hausablauf · abgehakte Punkte erscheinen im Übergabetext</div>
  </div></details>`;
  return h;
}

/* ============================================================
   Ansicht: Patient
   ============================================================ */
function tl(h){
  if(h==null) return "";
  const span = 168;                      // 7 Tage Achse
  const pos = Math.min(100, Math.max(0, h/span*100));
  return `<div class="tl"><div class="bar">
      <span class="zl" style="left:6px">SCHOCK</span>
      <span class="zl" style="left:32%">FLOW</span>
      <div class="mk" style="left:${pos}%"></div>
    </div><div class="ax"><span>Unfall</span><span>24 h</span><span>Tag 3</span><span>Tag 5</span><span>Tag 7+</span></div></div>`;
}

function renderPat(){
  const p = P(), c = calc(p), A = alerts(p,c), ph = phaseOf(c.h);
  const on = (b)=>b?"on":"";
  const iv = v => v===null||v===undefined?"":v;

  let h = `<div class="card">
    <div class="printhdr">
      <div class="t">Bett ${p.id}${p.label?" · "+esc(p.label):""}</div>
      <div class="s">${c.day!=null?"Burn-Tag "+c.day+" · ":""}${c.tbsa!=null?r0(c.tbsa)+" % VKOF · ":""}${c.kg!=null?r0(c.kg)+" kg · ":""}gedruckt am ${new Date().toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})} · Arbeitshilfe, keine Handlungsanweisung</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:9px">
      <div style="font-size:17px;font-weight:800">Bett ${p.id}</div>
      <select id="bedSel" style="width:auto;padding:5px 26px 5px 9px;font-size:12px">
        ${S.beds.map(b=>`<option value="${b.id}" ${b.id===p.id?"selected":""}>Bett ${b.id}${b.label?" · "+esc(b.label):""}</option>`).join("")}
      </select>
      <button class="btn sm" id="btnPrint" style="margin-left:auto">Drucken</button>
      <button class="btn d sm" id="btnClear">Bett leeren</button>
    </div>
    <div class="grid g2">
      <div><label class="f">Kürzel (kein Name)</label><input type="text" id="f_label" value="${esc(p.label)}" placeholder="z. B. M.K. / Fall 12"></div>
      <div><label class="f">Unfallzeitpunkt</label><input type="datetime-local" id="f_injury" value="${esc(p.injury)}"></div>
    </div>
    <div class="grid g3" style="margin-top:8px">
      <div><label class="f">Alter (J)</label><input type="number" inputmode="numeric" id="f_age" value="${iv(p.age)}"></div>
      <div><label class="f">Gewicht (kg)</label><input type="number" inputmode="decimal" id="f_weight" value="${iv(p.weight)}"></div>
      <div><label class="f">Größe (cm)</label><input type="number" inputmode="numeric" id="f_height" value="${iv(p.height)}"></div>
    </div>
    <div class="grid g2" style="margin-top:8px">
      <div><label class="f">VKOF (%) — nur Grad 2 und 3</label><input type="number" inputmode="decimal" id="f_tbsa" value="${iv(p.tbsa)}"></div>
      <div><label class="f">Geschlecht</label>
        <div class="seg tight"><button data-sex="m" class="${on(p.sex==="m")}">männlich</button><button data-sex="w" class="${on(p.sex==="w")}">weiblich</button></div>
      </div>
    </div>
    <div class="seg em" style="margin-top:8px">
      <button data-tg="tbsa3" class="${on(p.tbsa3)}">3.-gradig</button>
      <button data-tg="inhal" class="${on(p.inhal)}">Inhalation</button>
      <button data-tg="rhabdo" class="${on(p.rhabdo)}">Rhabdo</button>
      <button data-tg="strom" class="${on(p.strom)}">Strom</button>
    </div>`;

  if(c.h!=null){
    h += tl(c.h) + `<div class="chips">
      <span class="chip">Burn-Tag <b>${c.day}</b></span>
      <span class="chip">seit Unfall <b>${r1(c.h)} h</b></span>
      ${ph?`<span class="chip">${ph.n}</span>`:""}
    </div>`;
  }
  if(c.h!=null && c.pkTotal!=null){
    h += `<button class="axh" id="axHandle"><span class="g"></span>24-Stunden-Achse<span class="c">↑</span></button>`;
  }
  h += `</div>`;

  // Warnungen
  if(A.length){
    h += `<div class="card"><h3>Jetzt beachten</h3>`;
    ["e","w","o","i"].forEach(lv=>A.filter(a=>a.lv===lv).forEach(a=>{
      h += `<div class="note ${lv}">${a.t}</div>`;
    }));
    h += `</div>`;
  }

  // Phasen-Checkliste
  if(ph){
    h += `<details class="acc" data-k="pruef" ${accOpen("pruef",true)}><summary>Prüfpunkte · ${ph.n}</summary><div class="body">
      <ul style="margin:0;padding-left:18px;font-size:13px">${ph.li.map(x=>`<li style="margin-bottom:4px">${x}</li>`).join("")}</ul>
    </div></details>`;
  }

  // 24-Stunden-Plan
  h += renderPlan(p,c);

  // Kennzahlen
  h += `<details class="acc" data-k="kenn" ${accOpen("kenn",true)}><summary>Kennzahlen</summary><div class="body"><div class="grid g2">
    <div class="res"><div class="lab">Körperoberfläche</div><div class="val sm num">${r2(c.bsa)} m²</div><div class="sub">Mosteller</div></div>
    <div class="res"><div class="lab">BMI</div><div class="val sm num">${r1(c.bmi)}</div><div class="sub">kg/m²</div></div>
    <div class="res ${c.absi>=10?"dang":c.absi>=8?"warn":""}"><div class="lab">ABSI</div><div class="val sm num">${c.absi??"–"}</div><div class="sub">Überleben ${c.absiTxt||"–"}</div></div>
    <div class="res"><div class="lab">Revised Baux</div><div class="val sm num">${r0(c.rbaux)}</div><div class="sub">Alter + %VKOF + 17 bei Inhalation</div></div>
    <div class="res em"><div class="lab">Verdunstung</div><div class="val sm num">${r0(c.evap)} ml/h</div><div class="sub">≈ ${r1(c.evap?c.evap*24/1000:null)} l/Tag, steht in keiner Bilanz</div></div>
    <div class="res"><div class="lab">Zieldiurese</div><div class="val sm num">${p.rhabdo?r0(c.uoRhab):r0(c.uoLo)+"–"+r0(c.uoHi)} ml/h</div><div class="sub">${p.rhabdo?"2 ml/kg/h bei Rhabdomyolyse":(c.kg<30?"1 ml/kg/h (Kind < 30 kg)":"0,5–1,0 ml/kg/h")}${p.strom&&!p.rhabdo?" · bei Myoglobinurie auf 2 ml/kg/h anheben":""}</div></div>
  </div>
  <div class="formula">KOF = √(kg × cm / 3600) · Verdunstung = (25 + %VKOF) × KOF · ABSI aus Geschlecht, Alter, VKOF, Inhalation, Grad 3</div>
  </div></details>`;

  // Volumen
  h += `<details class="acc" data-k="vol" ${accOpen("vol", c.h!=null&&c.h<48)}><summary>Volumen · Schockphase</summary><div class="body">
    <div class="grid g2">
      <div class="res"><div class="lab">Parkland 24 h</div><div class="val num">${r0(c.pkTotal)} ml</div><div class="sub">4 ml × kg × % · Hälfte in 8 h</div></div>
      <div class="res"><div class="lab">Brooke / ABA-Start</div><div class="val num">${r0(c.brTotal)} ml</div><div class="sub">2 ml × kg × %</div></div>
    </div>
    <div class="chips">
      <span class="chip">Parkland erste 8 h <b>${r0(c.pkRate8)} ml/h</b></span>
      <span class="chip">Brooke erste 8 h <b>${r0(c.brRate8)} ml/h</b></span>
      <span class="chip">Rule of Ten <b>${c.rot!=null?r0(c.rot)+" ml/h":"n. a."}</b></span>
    </div>
    <div class="hr"></div>
    <div class="grid g2">
      <div><label class="f">Bisher gegeben seit Unfall (ml)</label><input type="number" inputmode="numeric" id="f_fluidGiven" value="${iv(p.fluidGiven)}" placeholder="inkl. Präklinik"></div>
      <div class="res ${c.devPk!=null&&Math.abs(c.devPk)>25?"warn":""}"><div class="lab">Soll nach Parkland jetzt</div><div class="val sm num">${r0(c.sollPk)} ml</div>
        <div class="sub">${c.devPk!=null?(c.devPk>0?"+":"")+r0(c.devPk)+" % Abweichung":"Brooke-Soll "+r0(c.sollBr)+" ml"}</div></div>
    </div>`;
  if(c.restRate!=null){
    h += `<div class="res ${c.restCatchUp?"warn":""}" style="margin-top:8px"><div class="lab">Restrate bis Ende ${esc(c.phase)}</div>
      <div class="val num">${r0(c.restRate)} ml/h</div>
      <div class="sub">${r0(c.restMl)} ml über ${r1(c.restH)} h · anschließend neu titrieren</div></div>`;
    if(c.restCatchUp) h += `<div class="note w">Der Rückstand ließe sich rechnerisch nur mit einer unplausiblen Rate aufholen. <b>Nicht bolusartig nachholen</b> — nach Perfusion und Diurese titrieren und die Ursache des Rückstands klären.</div>`;
  } else if(c.restShort){
    h += `<div class="res" style="margin-top:8px"><div class="lab">Bis Ende ${esc(c.phase)}</div>
      <div class="val sm num">${r0(c.restMl)} ml</div>
      <div class="sub">weniger als 1 h Restzeit — Rate wäre irreführend, jetzt für die Folgephase neu planen</div></div>`;
  }
  h += `<div class="chips">
      <span class="chip">Ivy-Index <b>${r0(c.ivy)} ml</b></span>
      <span class="chip">Colloid-Rescue ab <b>${r0(c.rescue)} ml</b></span>
      ${c.mlkgpct!=null?`<span class="chip">aktuell <b>${r1(c.mlkgpct)} ml/kg/%</b></span>`:""}
    </div>
    <div class="formula">Uhr läuft ab Unfallzeitpunkt · Formel = Startwert, Steuerung über Diurese und Perfusion</div>
    </div></details>`;

  // Ernährung
  const feed = FEEDS[p.feedIdx]||FEEDS[0];
  h += `<details class="acc" data-k="ern" ${accOpen("ern",false)}><summary>Ernährung</summary><div class="body">
    <div class="grid g2">
      <div class="res"><div class="lab">Energieziel</div><div class="val sm num">${r0(c.kcalLo)}–${r0(c.kcalHi)} kcal/d</div><div class="sub">25–30 kcal/kg, besser Kalorimetrie</div></div>
      <div class="res"><div class="lab">Proteinziel</div><div class="val sm num">${r1(c.protLo)}–${r1(c.protHi)} g/d</div><div class="sub">1,5–2,0 g/kg</div></div>
    </div>
    <div class="grid g3" style="margin-top:8px">
      <div><label class="f">Ziel kcal (Kalorimetrie)</label><input type="number" inputmode="numeric" id="f_kcalTarget" value="${iv(p.kcalTarget)}" placeholder="${r0(c.kcalHi)}"></div>
      <div><label class="f">Erreicht kcal</label><input type="number" inputmode="numeric" id="f_kcalAct" value="${iv(p.kcalAct)}"></div>
      <div><label class="f">Erreicht Protein g</label><input type="number" inputmode="numeric" id="f_protAct" value="${iv(p.protAct)}"></div>
    </div>`;
  if(c.kcalPct!=null||c.protPct!=null){
    h += `<div class="grid g2" style="margin-top:8px">
      <div class="res ${c.kcalPct<80?"warn":""}"><div class="lab">Energie erreicht</div><div class="val sm num">${r0(c.kcalPct)} %</div></div>
      <div class="res ${c.protPct<80?"warn":""}"><div class="lab">Protein erreicht</div><div class="val sm num">${r0(c.protPct)} %</div><div class="sub">der häufigste Fehler</div></div>
    </div>`;
  }
  h += `<div class="hr"></div>
    <label class="f">Sondenkost</label>
    <select id="f_feedIdx">${FEEDS.map((f,i)=>`<option value="${i}" ${i===p.feedIdx?"selected":""}>${esc(f.n)}${f.k?` · ${r2(f.k)} kcal/ml · ${r1(f.p)} g/100 ml`:""}</option>`).join("")}</select>`;
  if(feed.k===null){
    h += `<div class="grid g2" style="margin-top:8px">
      <div><label class="f">kcal/ml</label><input type="number" inputmode="decimal" id="f_feedK" value="${iv(p.feedK)}"></div>
      <div><label class="f">Protein g/100 ml</label><input type="number" inputmode="decimal" id="f_feedP" value="${iv(p.feedP)}"></div>
    </div>`;
  }
  if(c.mlProt!=null){
    h += `<div class="grid g2" style="margin-top:8px">
      <div class="res"><div class="lab">Für Proteinziel 2,0 g/kg</div><div class="val sm num">${r0(c.mlProt)} ml/d</div><div class="sub">= ${r0(c.rateProt)} ml/h · bringt ${r0(c.kcalAtProt)} kcal</div></div>
      <div class="res"><div class="lab">Für Kalorienziel</div><div class="val sm num">${r0(c.mlKcal)} ml/d</div><div class="sub">= ${r0(c.rateKcal)} ml/h · bringt ${r0(c.protAtKcal)} g Protein</div></div>
    </div>`;
    if(c.gapProt>1) h += `<div class="note w">Bei Steuerung nach Kalorien fehlen <b>${r0(c.gapProt)} g Protein</b> — entspricht etwa <b>${r0(c.powder)} g Proteinpulver</b> (88 g/100 g). Pulver zusetzen statt Laufrate erhöhen.</div>`;
  }
  h += `<div class="hr"></div>
    <div class="grid g2">
      <div><label class="f">Propofol 2 % (ml/h)</label><input type="number" inputmode="decimal" id="f_propofol" value="${iv(p.propofol)}"></div>
      <div class="res"><div class="lab">Propofol-Kalorien</div><div class="val sm num">${r0(c.propKcal)} kcal/d</div><div class="sub">≈ 1,1 kcal/ml — mitbilanzieren</div></div>
    </div>
    <div class="chips"><span class="chip">Glukose-Obergrenze <b>${r0(c.gluMax)} g/d</b> (5 mg/kg/min)</span><span class="chip">Fett <b>&lt; 35 % E</b></span></div>
    </div></details>`;

  // ---------- Diurese-Titration ----------
  h += `<details class="acc" data-k="uo" ${accOpen("uo", c.h!=null&&c.h<72)}><summary>Diurese · Titration</summary><div class="body">
    <div class="grid g3">
      <div><label class="f">Urin letzte Stunde (ml)</label><input type="number" inputmode="numeric" id="uo_ml" placeholder="z. B. 55"></div>
      <div><label class="f">Aktuelle Laufrate (ml/h)</label><input type="number" inputmode="numeric" id="f_curRate" value="${iv(p.curRate)}"></div>
      <div style="display:flex;align-items:flex-end"><button class="btn p" id="uo_add" style="width:100%">Eintragen</button></div>
    </div>`;
  if(c.uoLastKg!=null){
    const cls = c.uoAct==="hold" ? "" : c.uoAct==="down" ? "warn" : "dang";
    h += `<div class="res ${cls}" style="margin-top:9px">
      <div class="lab">Letzte Stunde</div>
      <div class="val num">${r1(c.uoLastKg)} ml/kg/h</div>
      <div class="sub">${r0(c.uoLast)} ml · ${c.uoMode==="rhabdo"?"Ziel 2 ml/kg/h (Rhabdomyolyse)":c.uoMode==="kind"?"Ziel 1 ml/kg/h (Kind < 30 kg)":"Ziel 0,5–1,0 ml/kg/h"}</div></div>
      <div class="note ${c.uoAct==="hold"?"i":"w"}"><b>${c.uoAct==="hold"?"Beibehalten":c.uoAct==="up"?"Erhöhen":"Senken"}</b> — ${esc(c.uoTxt)}${
        c.uoNew?` <b>${r0(c.uoNew[0])}${c.uoNew[0]!==c.uoNew[1]?"–"+r0(c.uoNew[1]):""} ml/h</b>`:""}</div>`;
    // Verlaufsbalken der letzten Stunden
    const S8=c.uoSeries.slice(-12), mx=Math.max(c.uoTargetHi*1.6, ...S8.map(x=>x.v));
    h += `<div style="display:flex;align-items:flex-end;gap:3px;height:52px;margin-top:9px;position:relative;
      border-bottom:1px solid var(--line);padding-bottom:1px">
      <div style="position:absolute;left:0;right:0;bottom:${c.uoTargetLo/mx*100}%;border-top:1px dashed #9FC0BA"></div>
      <div style="position:absolute;left:0;right:0;bottom:${c.uoTargetHi/mx*100}%;border-top:1px dashed #9FC0BA"></div>
      ${S8.map(x=>{const inb=x.v>=c.uoTargetLo&&x.v<=c.uoTargetHi;
        return `<div title="${r1(x.v)}" style="flex:1;height:${Math.max(3,Math.min(100,x.v/mx*100))}%;border-radius:2px 2px 0 0;
        background:${inb?"var(--acc)":x.v<c.uoTargetLo?"var(--dang)":"var(--warn)"};opacity:.85"></div>`;}).join("")}
    </div><div class="tiny" style="margin-top:3px">letzte ${S8.length} Einträge · gestrichelt = Zielkorridor</div>
    <button class="btn sm" id="uo_undo" style="margin-top:8px">Letzten Eintrag löschen</button>`;
  } else {
    h += `<div class="note i">Noch kein Wert erfasst. Stündlich den Urin eintragen — die App vergleicht mit dem Zielkorridor und schlägt die Ratenanpassung vor.</div>`;
  }
  h += `${p.strom&&!p.rhabdo?`<div class="note o">Stromunfall hinterlegt: Das höhere Ziel von 2 ml/kg/h gilt <b>bei Myoglobinurie</b>, nicht bei jeder Stromverletzung. CK und Myoglobin prüfen, dann gegebenenfalls Rhabdo setzen.</div>`:""}<div class="formula">Ziel ${c.uoModede==="rhabdo"?"2 ml/kg/h (Rhabdomyolyse)":c.uoMode==="kind"?"1 ml/kg/h (Kind < 30 kg)":"0,5–1,0 ml/kg/h (Erwachsene)"} · Anpassung in Schritten von 20–25 % · Reevaluation nach 1–2 h<br>Höhere Ziele gelten nur bei Rhabdomyolyse und im Kindesalter — die ABA steuert Erwachsene inzwischen auf 0,5 ml/kg/h.</div>
    </div></details>`;

  // ---------- Lund-Browder ----------
  const bandName = ["0 J.","1–4 J.","5–9 J.","10–14 J.","15–17 J.","Erwachsen"][c.band];
  h += `<details class="acc" data-k="lb" ${accOpen("lb",false)}><summary>VKOF · Lund-Browder</summary><div class="body">
    <div class="tiny">Altersgruppe <b>${bandName}</b> nach eingetragenem Alter. Region antippen, dann Anteil und Tiefe wählen. <b>Grad 1 ist bewusst nicht wählbar</b> — er zählt nicht zur VKOF.</div>`;
  if(c.lbCount){
    h += `<div class="grid g2" style="margin-top:9px">
      <div class="res"><div class="lab">Summe Grad 2 + 3</div><div class="val num">${r1(c.lbAll)} %</div><div class="sub">${c.lbCount} Region${c.lbCount>1?"en":""} markiert</div></div>
      <div class="res em"><div class="lab">davon tief (2b/3)</div><div class="val num">${r1(c.lbDeep)} %</div><div class="sub">operationspflichtiger Anteil</div></div>
    </div>
    <button class="btn p" id="lb_apply" style="width:100%;margin-top:8px">Als VKOF übernehmen (${r1(c.lbAll)} %)</button>`;
    if(c.lbDiff!=null && Math.abs(c.lbDiff)>=1)
      h += `<div class="note w">Eingetragen sind ${r0(c.tbsa)} % — Lund-Browder ergibt ${r1(c.lbAll)} % (${c.lbDiff>0?"+":""}${r1(c.lbDiff)}).</div>`;
  }
  h += `<div style="margin-top:9px">`;
  REGIONS.forEach(r=>{
    const e=(p.lb||{})[r.k], act=!!(e&&e.d), pc=regPct(r,c.band);
    const contrib = act ? pc*((e.f||100)/100) : null;
    h += `<div style="border-bottom:1px solid var(--line);padding:6px 0">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn sm" data-lbtoggle="${r.k}" style="min-width:132px;text-align:left;${act?"border-color:var(--ember);color:var(--ember)":""}">${r.n}</button>
        <span class="tiny num">max ${r1(pc)} %</span>
        ${act?`<span class="chip" style="margin-left:auto"><b>${r1(contrib)} %</b></span>`:""}
      </div>`;
    if(act){
      h += `<div class="seg tight" style="margin-top:6px">${SHARES.map(f=>`<button data-lbf="${r.k}|${f}" class="${(e.f||100)===f?"on":""}">${f} %</button>`).join("")}</div>
        <div class="seg em tight" style="margin-top:5px">${DEPTHS.map(([v,lab])=>`<button data-lbd="${r.k}|${v}" class="${e.d===v?"on":""}">${lab}</button>`).join("")}</div>`;
    }
    h += `</div>`;
  });
  h += `</div></div></details>`;

  // ---------- Sepsis-Trend ----------
  h += `<details class="acc" data-k="sep" ${accOpen("sep", c.day!=null&&c.day>=3)}><summary>Sepsis-Trend · ab Tag 3</summary><div class="body">
    <div class="tiny">Einmal täglich eintragen. Die Richtung zählt mehr als der Einzelwert.</div>
    ${(()=>{ const td=(p.trend||[]).find(x=>x.d===todayISO());
      const v=k=>td&&td[k]!=null?esc(td[k]):"";
      if(td && td.fi!=null) trFI=td.fi;
      return `<div class="grid g3" style="margin-top:9px">
      <div><label class="f">Noradrenalin µg/kg/min</label><input type="number" step="0.01" inputmode="decimal" id="tr_nor" value="${v("nor")}"></div>
      <div><label class="f">Insulin IE/h</label><input type="number" step="0.5" inputmode="decimal" id="tr_ins" value="${v("ins")}"></div>
      <div><label class="f">Reflux ml/24 h (Trend)</label><input type="number" inputmode="numeric" id="tr_refl" value="${v("refl")}"></div>
      <div><label class="f">Thrombozyten /nl</label><input type="number" inputmode="numeric" id="tr_thr" value="${v("thr")}"></div>
      <div><label class="f">Temperatur °C</label><input type="number" step="0.1" inputmode="decimal" id="tr_temp" value="${v("temp")}"></div>
      <div><label class="f">Herzfrequenz /min</label><input type="number" inputmode="numeric" id="tr_hf" value="${v("hf")}"></div>
      <div><label class="f">AMV l/min</label><input type="number" step="0.5" inputmode="decimal" id="tr_amv" value="${v("amv")}"></div>`; })()}
      <div style="grid-column:span 3"><label class="f">Nahrungsintoleranz &gt; 24 h (Distension, Reflux &gt; 2× Laufrate oder Diarrhö &gt; 2500 ml/d)</label>
        <div class="seg tight"><button data-fi="1" id="fi1" class="${trFI==="1"?"on":""}">ja</button><button data-fi="0" id="fi0" class="${trFI==="0"?"on":""}">nein</button></div></div>
      <div style="display:flex;align-items:flex-end;grid-column:span 3"><button class="btn p" id="tr_add" style="width:100%">Tageswert speichern</button></div>
    </div>`;
  if(c.trLast){
    const arrow=(d,goodDown)=>{ if(d==null||d===0) return `<span style="color:var(--dim)">→</span>`;
      const bad = goodDown ? d>0 : d<0;
      return `<span style="color:${bad?"var(--warn)":"var(--acc)"}">${d>0?"↑":"↓"}</span>`; };
    const L=c.trLast;
    h += `<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:10px">
      <tr><td style="padding:4px 0;color:var(--mut)">Noradrenalin</td><td class="num" style="text-align:right">${L.nor??"–"} ${arrow(c.trD.nor,true)}</td>
          <td style="padding-left:12px;color:var(--mut)">Insulin</td><td class="num" style="text-align:right">${L.ins??"–"} ${arrow(c.trD.ins,true)}</td></tr>
      <tr><td style="padding:4px 0;color:var(--mut)">Reflux</td><td class="num" style="text-align:right">${L.refl??"–"} ${arrow(c.trD.refl,true)}</td>
          <td style="padding-left:12px;color:var(--mut)">Thrombozyten</td><td class="num" style="text-align:right">${L.thr??"–"} ${arrow(c.trD.thr,false)}</td></tr>
      <tr><td style="padding:4px 0;color:var(--mut)">Temperatur</td><td class="num" style="text-align:right">${L.temp??"–"} ${arrow(c.trD.temp,true)}</td>
          <td style="padding-left:12px;color:var(--mut)">Einträge</td><td class="num" style="text-align:right">${c.trSeries.length}</td></tr>
    </table>`;
    const cls = c.abaHits.length>=3?"dang":c.abaHits.length===2?"warn":"";
    h += `<div class="res ${cls}" style="margin-top:9px"><div class="lab">ABA-Trigger</div>
      <div class="val num">${c.abaHits.length} von 6</div>
      <div class="sub">${c.abaHits.length?esc(c.abaHits.join(" · ")):"keiner positiv"}${c.abaMiss?" · "+c.abaMiss+" Wert(e) nicht erfasst":""}</div></div>`;
    if(c.abaHits.length>=3) h += `<div class="note e">Ab drei Triggern Fokus suchen. <b>Die Diagnose muss an einen gefundenen Fokus gebunden werden</b> — Trigger allein sind keine Sepsis.</div>`;
    h += `<button class="btn sm" id="tr_undo" style="margin-top:8px">Letzten Tageswert löschen</button>`;
  }
  h += `</div></details>`;

  // ---------- Wundkarte ----------
  h += `<details class="acc" data-k="wund" ${accOpen("wund",false)}><summary>Wundkarte · Transplantate und Spenderstellen</summary><div class="body">
    <div class="tiny">Status je Region mit Datum. Die App rechnet POD und Freigaben mit.</div>`;
  if(c.wound){
    if(c.wOpenPct) h += `<div class="res em" style="margin-top:9px"><div class="lab">Noch offen</div><div class="val num">${r1(c.wOpenPct)} % KOF</div>
      <div class="sub">${c.wOpen.map(x=>x.n).join(", ")}</div></div>`;
    const notes=c.wound.filter(x=>x.note);
    if(notes.length) h += `<div style="margin-top:8px">${notes.map(x=>
      `<div class="note ${x.hold?"o":x.ready?"i":"i"}" style="margin-top:5px"><b>${x.n}</b> — ${esc(x.note)}</div>`).join("")}</div>`;
  }
  h += `<div style="margin-top:9px">`;
  REGIONS.forEach(r=>{
    const e=(p.wound||{})[r.k], act=!!(e&&e.st);
    h += `<div style="border-bottom:1px solid var(--line);padding:6px 0">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn sm" data-wtoggle="${r.k}" style="min-width:132px;text-align:left;${act?"border-color:"+WSTAT[e.st].c+";color:"+WSTAT[e.st].c:""}">${r.n}</button>
        ${act?`<span class="tiny">${WSTAT[e.st].n}${e.dt?" · "+e.dt.split("-").reverse().join(".").slice(0,5):""}</span>`:`<span class="tiny">–</span>`}
        ${act&&e.pod!=null?"":""}
      </div>`;
    if(act){
      h += `<div class="seg" style="margin-top:6px">${Object.entries(WSTAT).map(([k2,v])=>
        `<button data-wst="${r.k}|${k2}" class="${e.st===k2?"on":""}" style="min-width:88px">${v.n}</button>`).join("")}</div>
        <div style="margin-top:5px"><input type="date" data-wdt="${r.k}" value="${esc(e.dt||"")}"></div>`;
    }
    h += `</div>`;
  });
  h += `</div></div></details>`;

  // Burn-spezifische Übergabe
  h += `<details class="acc" data-k="ueb" ${accOpen("ueb",false)}><summary>Burn-spezifische Übergabe</summary><div class="body">`;
  HAND_FIELDS.forEach(([k,lab,ph2])=>{
    h += `<div style="margin-bottom:9px"><label class="f">${lab}</label>
      <textarea id="h_${k}" placeholder="${esc(ph2)}">${esc((p.hand||{})[k]||"")}</textarea></div>`;
  });
  h += `<div style="margin-bottom:9px"><label class="f">Freie Notizen</label><textarea id="f_notes">${esc(p.notes)}</textarea></div>
    <button class="btn p" id="btnHand" style="width:100%">Übergabetext erzeugen und kopieren</button>
    <div id="handOut"></div>
    </div></details>`;

  const _sy = window.scrollY;
  $("#v-pat").innerHTML = h;
  document.querySelectorAll("details.acc[data-k]").forEach(d=>{
    d.addEventListener("toggle", ()=>{ UIST[d.dataset.k] = d.open; });
  });
  bindPat();
  window.scrollTo(0,_sy);
}

function bindPat(){
  const p = P();
  const txt = (id,key)=>{ const el=$("#"+id); if(!el) return;
    el.oninput = ()=>{ p[key]=el.value; p.updated=Date.now(); save(); };
    el.onblur  = ()=>renderPat(); };
  const live = (id,key)=>{ const el=$("#"+id); if(!el) return;
    el.oninput = ()=>{ p[key]=el.value; p.updated=Date.now(); save(); softUpdate(); }; };

  ["label","injury"].forEach(k=>txt("f_"+k,k));
  ["age","weight","height","tbsa","fluidGiven","kcalTarget","kcalAct","protAct","feedK","feedP","propofol"].forEach(k=>live("f_"+k,k));
  ["age","weight","height","tbsa","fluidGiven","kcalTarget","kcalAct","protAct","feedK","feedP","propofol"].forEach(k=>{
    const el=$("#f_"+k); if(el) el.onblur=()=>renderPat();
  });
  const nt=$("#f_notes"); if(nt) nt.oninput=()=>{p.notes=nt.value;p.updated=Date.now();save();};
  HAND_FIELDS.forEach(([k])=>{ const el=$("#h_"+k); if(el) el.oninput=()=>{ p.hand=p.hand||{}; p.hand[k]=el.value; p.updated=Date.now(); save(); }; });

  const fs=$("#f_feedIdx"); if(fs) fs.onchange=()=>{ p.feedIdx=+fs.value; save(); renderPat(); };
  document.querySelectorAll("[data-sex]").forEach(b=>b.onclick=()=>{ p.sex=b.dataset.sex; save(); renderPat(); });
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{ p[b.dataset.tg]=!p[b.dataset.tg]; save(); renderPat(); });
  const bs=$("#bedSel"); if(bs) bs.onchange=()=>{ S.cur=+bs.value; trFI=null; save(); renderPat(); };
  const bc=$("#btnClear"); if(bc) bc.onclick=()=>{
    if(confirm("Bett "+p.id+" vollständig leeren? Das lässt sich nicht rückgängig machen.")){
      S.beds[p.id-1]=blank(p.id); save(); renderPat(); renderBeds(); toast("Bett "+p.id+" geleert");
    }};
  // --- 24-Stunden-Plan ---
  document.querySelectorAll("[data-plan]").forEach(cb=>cb.onchange=()=>{
    p.done=p.done||{};
    if(cb.checked) p.done[cb.dataset.plan]=Date.now(); else delete p.done[cb.dataset.plan];
    p.updated=Date.now(); save(); renderPat(); renderBeds();
  });

  // --- Diurese ---
  const cr=$("#f_curRate"); if(cr) cr.oninput=()=>{ p.curRate=cr.value; save(); };
  const ua=$("#uo_add"); if(ua) ua.onclick=()=>{
    const v=num($("#uo_ml").value);
    if(v==null){ toast("Bitte Urinmenge eintragen"); return; }
    p.uo=p.uo||[]; p.uo.push({t:Date.now(), ml:v});
    if(p.uo.length>48) p.uo=p.uo.slice(-48);
    p.updated=Date.now(); save(); renderPat(); renderBeds();
  };
  const uu=$("#uo_undo"); if(uu) uu.onclick=()=>{ p.uo.pop(); save(); renderPat(); };

  // --- Lund-Browder ---
  document.querySelectorAll("[data-lbtoggle]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.lbtoggle; p.lb=p.lb||{};
    if(p.lb[k]&&p.lb[k].d) delete p.lb[k]; else p.lb[k]={f:100,d:"2b"};
    save(); renderPat();
  });
  document.querySelectorAll("[data-lbf]").forEach(b=>b.onclick=()=>{
    const [k,f]=b.dataset.lbf.split("|"); p.lb[k].f=+f; save(); renderPat();
  });
  document.querySelectorAll("[data-lbd]").forEach(b=>b.onclick=()=>{
    const [k,d]=b.dataset.lbd.split("|"); p.lb[k].d=d; save(); renderPat();
  });
  const la=$("#lb_apply"); if(la) la.onclick=()=>{
    const cc=calc(p);
    p.tbsa=Math.round(cc.lbAll*10)/10;
    p.tbsa3=cc.lbDeep>0;
    p.updated=Date.now(); save(); renderPat(); renderBeds();
    toast("VKOF auf "+r1(cc.lbAll)+" % gesetzt");
  };

  // --- Sepsis-Trend ---
  document.querySelectorAll("[data-fi]").forEach(b=>b.onclick=()=>{
    trFI=b.dataset.fi;
    document.querySelectorAll("[data-fi]").forEach(x=>x.classList.toggle("on", x.dataset.fi===trFI));
  });
  const ta=$("#tr_add"); if(ta) ta.onclick=()=>{
    const g=id=>{ const el=$("#tr_"+id); const v=el?el.value.trim():""; return v===""?null:v; };
    const e={d:todayISO(), nor:g("nor"), ins:g("ins"), refl:g("refl"), thr:g("thr"), temp:g("temp"), hf:g("hf"), amv:g("amv"), fi:trFI};
    if(Object.keys(e).slice(1).every(k=>e[k]===null)){ toast("Mindestens einen Wert eintragen"); return; }
    p.trend=p.trend||[];
    const i=p.trend.findIndex(x=>x.d===e.d);
    if(i>=0){
      // Zusammenführen: leere Felder überschreiben keinen bereits gespeicherten Wert
      const alt=p.trend[i];
      Object.keys(e).forEach(k=>{ if(e[k]==null && alt[k]!=null) e[k]=alt[k]; });
      p.trend[i]=e;
    } else p.trend.push(e);
    if(p.trend.length>30) p.trend=p.trend.slice(-30);
    p.updated=Date.now(); save(); renderPat(); renderBeds(); toast("Tageswert gespeichert");
  };
  const tu=$("#tr_undo"); if(tu) tu.onclick=()=>{ p.trend.pop(); save(); renderPat(); };

  // --- Wundkarte ---
  document.querySelectorAll("[data-wtoggle]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.wtoggle; p.wound=p.wound||{};
    if(p.wound[k]&&p.wound[k].st) delete p.wound[k]; else p.wound[k]={st:"burn", dt:todayISO()};
    save(); renderPat();
  });
  document.querySelectorAll("[data-wst]").forEach(b=>b.onclick=()=>{
    const [k,st]=b.dataset.wst.split("|");
    p.wound[k].st=st; if(!p.wound[k].dt) p.wound[k].dt=todayISO();
    save(); renderPat(); renderBeds();
  });
  document.querySelectorAll("[data-wdt]").forEach(el=>el.onchange=()=>{
    p.wound[el.dataset.wdt].dt=el.value; save(); renderPat();
  });

  const ax=$("#axHandle");
  if(ax){
    ax.onclick = sheetOpen;
    let sy=null;
    ax.addEventListener("touchstart", e=>{ sy = e.touches[0].clientY; }, {passive:true});
    ax.addEventListener("touchend",  e=>{
      if(sy!=null && e.changedTouches[0] && sy - e.changedTouches[0].clientY > 40){ sheetOpen(); }
      sy=null;
    }, {passive:true});
  }
  const bp=$("#btnPrint"); if(bp) bp.onclick=()=>{
    // Zum Drucken alles aufklappen, danach den vorherigen Zustand wiederherstellen
    const acc=[...document.querySelectorAll("#v-pat details")];
    const before=acc.map(d=>d.open);
    acc.forEach(d=>d.open=true);
    const back=()=>{ acc.forEach((d,i)=>d.open=before[i]); window.removeEventListener("afterprint",back); };
    window.addEventListener("afterprint",back);
    setTimeout(()=>{ window.print(); setTimeout(back,800); },60);
  };
  const bh=$("#btnHand"); if(bh) bh.onclick=handover;

  // Nur die abgeleiteten Werte neu zeichnen, ohne Fokus zu verlieren
  function softUpdate(){ renderBeds(); }
}

function handover(){
  const p=P(), c=calc(p);
  const L=[];
  L.push(`BETT ${p.id}${p.label?" · "+p.label:""}`);
  if(c.day!=null) L.push(`Burn-Tag ${c.day} (${r1(c.h)} h seit Unfall)`);
  const st=[]; if(c.age!=null)st.push(`${r0(c.age)} J.`); st.push(p.sex==="w"?"weiblich":"männlich");
  if(c.kg!=null)st.push(`${r0(c.kg)} kg`); if(c.cm!=null)st.push(`${r0(c.cm)} cm`);
  if(c.bsa!=null)st.push(`KOF ${r2(c.bsa)} m²`);
  L.push(st.join(", "));
  if(c.tbsa!=null) L.push(`VKOF ${r0(c.tbsa)} %${p.tbsa3?", drittgradige Anteile":""}${p.inhal?", Inhalationstrauma":""}${p.rhabdo?", Rhabdomyolyse":""}`);
  if(c.absi!=null) L.push(`ABSI ${c.absi} (Überleben ${c.absiTxt}), rBaux ${r0(c.rbaux)}`);
  L.push("");
  L.push(`ZIELWERTE`);
  if(c.uoLo) L.push(`  Diurese ${p.rhabdo?r0(c.uoRhab):r0(c.uoLo)+"–"+r0(c.uoHi)} ml/h${p.strom&&!p.rhabdo?" (Strom: bei Myoglobinurie auf "+r0(c.uoRhab)+" ml/h anheben)":""}`);
  if(c.kcalLo) L.push(`  Energie ${r0(num(p.kcalTarget)||c.kcalHi)} kcal/d, Protein ${r1(c.protLo)}–${r1(c.protHi)} g/d`);
  if(c.evap) L.push(`  Verdunstung ca. ${r0(c.evap)} ml/h (${r1(c.evap*24/1000)} l/d)`);
  if(c.pkTotal) L.push(`  Parkland 24 h ${r0(c.pkTotal)} ml, Ivy-Grenze ${r0(c.ivy)} ml`);
  if(num(p.fluidGiven)!=null) L.push(`  bisher gegeben ${r0(num(p.fluidGiven))} ml${c.mlkgpct!=null?` (${r1(c.mlkgpct)} ml/kg/%)`:""}`);
  if(num(p.kcalAct)!=null||num(p.protAct)!=null) L.push(`  erreicht ${r0(num(p.kcalAct))} kcal / ${r0(num(p.protAct))} g Protein`);
  L.push("");
  if(c.wound){
    L.push("WUNDKARTE");
    c.wound.forEach(x=>L.push(`  ${x.n}: ${WSTAT[x.st].n}${x.pod!=null?` (Tag ${x.pod})`:""}${x.note?" — "+x.note:""}`));
    if(c.wOpenPct) L.push(`  noch offen: ${r1(c.wOpenPct)} % KOF`);
    L.push("");
  }
  if(c.lbCount) L.push(`LUND-BROWDER: ${r1(c.lbAll)} % gesamt, davon ${r1(c.lbDeep)} % tief (2b/3)`);
  if(c.uoLastKg!=null) L.push(`DIURESE zuletzt: ${r1(c.uoLastKg)} ml/kg/h (${r0(c.uoLast)} ml) — ${c.uoTxt}`);
  if(c.abaHits) L.push(`ABA-TRIGGER: ${c.abaHits.length} von 6${c.abaHits.length?" ("+c.abaHits.join(", ")+")":""}`);
  if(c.lbCount||c.uoLastKg!=null||c.abaHits) L.push("");
  HAND_FIELDS.forEach(([k,lab])=>{
    const v=(p.hand||{})[k]; if(v && v.trim()) L.push(`${lab.toUpperCase()}: ${v.trim()}`);
  });
  if(p.notes && p.notes.trim()){ L.push(""); L.push(`NOTIZEN: ${p.notes.trim()}`); }
  const A=alerts(p,c).filter(a=>a.lv==="e"||a.lv==="w");
  if(A.length){ L.push(""); L.push("OFFENE PUNKTE"); A.forEach(a=>L.push("  - "+a.t.replace(/<[^>]+>/g,""))); }
  const out=L.join("\n");
  const box=$("#handOut");
  box.innerHTML=`<textarea style="margin-top:9px;min-height:220px;font-size:12px" readonly>${esc(out)}</textarea>`;
  const ta=box.querySelector("textarea");
  const done=()=>toast("Übergabetext kopiert");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(out).then(done).catch(()=>{ta.select();toast("Text markiert — bitte kopieren");});
  } else { ta.select(); try{document.execCommand("copy");done();}catch(e){toast("Text markiert — bitte kopieren");} }
}

/* ============================================================
   Ansicht: Rechner (ohne Patient, z. B. Schockraum)
   ============================================================ */
const QC = {kg:80, tbsa:40, h:0, area:10, age:45};
function renderCalc(){
  const {kg,tbsa,h,area,age}=QC;
  const pk=4*kg*tbsa, br=2*kg*tbsa, half=pk/2;
  const rate8=half/8, rot=tbsa*10+(kg>80?Math.floor((kg-80)/10)*100:0);
  const soll = h<8 ? half*(h/8) : h<24 ? half+half*((h-8)/16) : pk;
  const restH = h<8?Math.max(.25,8-h):h<24?Math.max(.25,24-h):null;
  const restMl= h<8?half-soll:h<24?pk-soll:null;
  const bl = area*100, bh = area*150;
  let html = `<div class="card"><h3>Schnellrechner</h3>
    <div class="tiny">Für den Schockraum, ohne Patient anzulegen. Ändert keine Bettdaten.</div>
    <div class="grid g3" style="margin-top:9px">
      <div><label class="f">Gewicht (kg)</label><input type="number" inputmode="decimal" id="q_kg" value="${kg}"></div>
      <div><label class="f">VKOF (%)</label><input type="number" inputmode="decimal" id="q_tbsa" value="${tbsa}"></div>
      <div><label class="f">Stunden seit Unfall</label><input type="number" inputmode="decimal" id="q_h" value="${h}"></div>
    </div>
    <div class="grid g2" style="margin-top:9px">
      <div class="res"><div class="lab">Parkland 24 h</div><div class="val num">${r0(pk)} ml</div><div class="sub">erste 8 h: ${r0(rate8)} ml/h</div></div>
      <div class="res"><div class="lab">Brooke / ABA 24 h</div><div class="val num">${r0(br)} ml</div><div class="sub">erste 8 h: ${r0(rate8/2)} ml/h</div></div>
    </div>
    <div class="chips">
      <span class="chip">Rule of Ten <b>${r0(rot)} ml/h</b></span>
      <span class="chip">Soll bis Stunde ${r1(h)} <b>${r0(soll)} ml</b></span>
      ${restH?`<span class="chip">Restrate <b>${r0(restMl/restH)} ml/h</b></span>`:""}
      <span class="chip">Zieldiurese <b>${r0(.5*kg)}–${r0(kg)} ml/h</b></span>
      <span class="chip">Ivy-Grenze <b>${r0(250*kg)} ml</b></span>
      <span class="chip">Colloid-Rescue <b>${r0(6*kg*tbsa)} ml</b></span>
    </div>
  </div>

  <div class="card"><h3>Blutverlust Nekrektomie</h3>
    <div><label class="f">Geplante Exzisionsfläche (% KOF)</label><input type="number" inputmode="decimal" id="q_area" value="${area}"></div>
    <div class="res" style="margin-top:8px"><div class="lab">Erwarteter Verlust</div><div class="val num">${r0(bl)}–${r0(bh)} ml</div>
      <div class="sub">≈ 100–150 ml pro % exzidierter KOF · 0,5–1 ml/cm²</div></div>
    <div class="note i">Vor Schnitt festlegen: maximale Fläche, maximale Zeit, Temperatur- und Transfusionsgrenze. TXA 15 mg/kg. Transfusionstrigger Hb 7 g/dl.</div>
  </div>

  <div class="card"><h3>Neuner-Regel</h3>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px">

["Analgesie und Sedierung","schmerz analgesie ketamin gabapentin dexmedetomidin delir", `
<ul><li><b>Hintergrundschmerz und Prozedurschmerz getrennt planen.</b></li>
<li>Schmerz standardisiert ca. 8-stündlich erfassen; beim Beatmeten BPS/CPOT.</li>
<li>Koanalgetika laut LL: Gabapentinoide, Amitriptylin/SSNRI, α2-Agonisten (Clonidin, Dexmedetomidin).</li>
<li><b>Ketamin</b> und <b>Lidocain i.v.</b> erwägen; <b>Regionalverfahren</b> besonders für Spenderareale.</li>

<li>Methadon als Ausstiegswerkzeug nach wochenlanger Therapie.</li>

["Nekrektomie · Anästhesie","op nekrektomie blutverlust txa succinylcholin wärme meek", `
<ul><li>Blutverlust <b>0,5–1 ml/cm²</b>, ca. <b>100–150 ml pro % exzidierter KOF</b>. Meist max. 15–20 % KOF pro Sitzung.</li>
<li><b>TXA</b> 15 mg/kg vor Schnitt. Transfusionstrigger <b>Hb 7 g/dl</b>, kein Erythropoetin.</li>
<li>Tumeszenz mit verdünntem Adrenalin — Tachykardie/Hypertonie ansagen, nicht als Analgesiemangel deuten.</li>
<li><b>Kein Succinylcholin</b> ab ca. 24–48 h nach Trauma. Resistenz gegen nicht-depolarisierende Relaxanzien.</li>
<li>OP-Saal aufheizen, alle Infusionen wärmen — Kerntemperatur ist ein <b>Abbruchkriterium</b>.</li>
<li>Vor Schnitt vereinbaren: maximale Fläche, maximale Zeit, Temperatur- und Transfusionsgrenze.</li>
<li>Tangential blutet mehr als epifaszial. MEEK verlängert die OP durch Präparation.</li></ul>`],

["Verlegung auf Normalstation","verlegung normalstation kompression nachsorge übergabe", `
<ul><li>Wunden weitgehend geschlossen, Verbandwechsel ohne Narkose möglich.</li>
<li>Keine i.v.-Katecholamine, respiratorisch stabil, Trachealkanüle sicher pflegbar.</li>
<li>Ernährung bedarfsdeckend, Analgesie oralisiert mit <b>Ausschleichplan</b>.</li></ul>
<p><b>Was zwingend mitwandert:</b></p>
<ul><li><b>Kompression 15–25 mmHg, 23 h/Tag, 12–24 Monate</b> — Anmeldung schon auf der ITS, Maßanfertigung braucht Vorlauf.</li>

["Vitamin C · VICTORY 2026","vitamin c victory ascorbinsäure obsolet", `
<p><b>Hochdosis-Vitamin C ist bei Schwerbrandverletzten obsolet.</b></p>
<ul><li>VICTORY (JAMA, 10.06.2026): 50 mg/kg alle 6 h über 96 h vs. Placebo bei ≥ 20 % VKOF, 24 Zentren, n = 238.</li>
<li>Abbruch nach Interimsanalyse wegen Schadens. <b>28-Tage-Mortalität 15,0 % vs. 7,6 %</b> (aRR 1,96; p = 0,001).</li>

function renderRef(){
  let h = `<div class="search"><input type="text" id="refQ" placeholder="Suchen: Volumen, Sepsis, Ernährung, Escharotomie …"></div><div id="refList"></div>`;
  $("#v-ref").innerHTML = h;
  const list = $("#refList");
  const draw = q=>{
    const s = (q||"").trim().toLowerCase();
    const items = REF.filter(([t,tags,body]) => !s || (t+" "+tags+" "+body).toLowerCase().includes(s));
    list.innerHTML = items.length
      ? items.map(([t,,b])=>`<details class="ref"><summary>${t}</summary><div class="body">${b}</div></details>`).join("")
      : `<div class="card"><div class="tiny">Kein Treffer für „${esc(q)}". Versuche einen Oberbegriff wie Volumen, Wunde, Infektion oder Ernährung.</div></div>`;
    if(s && items.length<=3) list.querySelectorAll("details").forEach(d=>d.open=true);
  };
  draw("");
  $("#refQ").oninput = e=>draw(e.target.value);
}


/* ============================================================
   Wischgesten: Betten durchblättern und 24-Stunden-Achse
   ============================================================ */
let SHEET = false;

function bedOrder(){
  // Belegte Betten zuerst in Bettreihenfolge; leere bleiben erreichbar
  const occ = S.beds.filter(b=>b.label||b.weight||b.tbsa||b.injury).map(b=>b.id);
  return occ.length ? occ : S.beds.map(b=>b.id);
}
function stepBed(dir){
  const o = bedOrder();
  let i = o.indexOf(S.cur);
  if(i<0){ i = 0; } else { i = (i + dir + o.length) % o.length; }
  S.cur = o[i]; trFI = null; save();
  const p = P();
  if(SHEET) renderSheet(dir); else { window.scrollTo(0,0); renderPat(); }
  toast(`Bett ${p.id}${p.label?" · "+p.label:""}`);
}

/* ---------- Vollbild: 24-Stunden-Achse ---------- */
function sheetOpen(){ SHEET = true; $("#sheet").classList.add("on"); document.body.style.overflow="hidden"; renderSheet(0); }
function sheetClose(){ SHEET = false; $("#sheet").classList.remove("on"); document.body.style.overflow=""; renderPat(); }

function renderSheet(dir){
  const p = P(), c = calc(p);
  const box = $("#sheet");
  const o = bedOrder();
  let h = `<div class="sh-top">
      <button class="sh-nav" id="shPrev" aria-label="vorheriges Bett">‹</button>
      <div class="sh-ttl"><b>Bett ${p.id}</b>${p.label?" · "+esc(p.label):""}
        <span>${c.day!=null?`Burn-Tag ${c.day} · ${r1(c.h)} h seit Unfall`:"kein Unfallzeitpunkt hinterlegt"}</span></div>
      <button class="sh-nav" id="shNext" aria-label="nächstes Bett">›</button>
      <button class="sh-x" id="shClose" aria-label="schließen">✕</button>
    </div>
    <div class="sh-dots">${o.map(id=>`<span class="${id===p.id?"on":""}"></span>`).join("")}</div>
    <div class="sh-body" id="shBody">`;

  if(c.pkTotal==null || c.h==null){
    h += `<div class="note i">Für die 24-Stunden-Achse fehlen Gewicht, VKOF oder Unfallzeitpunkt. Trage sie in der Patientenansicht ein.</div>`;
  } else {
    const pos = x => x/24*100;
    const nowPct = Math.min(100, Math.max(0, c.h/24*100));
    const past = c.h>=24;
    const items = plan24(p,c), done = p.done||{};
    const rateNow = c.h<8 ? c.pkRate8 : c.h<24 ? c.pkTotal/2/16 : null;
    const over = items.filter(i=>!done[i.k] && c.h>i.t1);
    const now  = items.filter(i=>!done[i.k] && c.h>=i.t0 && c.h<=i.t1);
    const soon = items.filter(i=>!done[i.k] && c.h<i.t0);

    h += `<div class="sh-key">
      <div class="res"><div class="lab">Laufrate jetzt</div><div class="val">${rateNow!=null?r0(rateNow)+" ml/h":"nach Bedarf"}</div>
        <div class="sub">${c.h<8?"Parkland, erste Hälfte":c.h<24?"Parkland, zweite Hälfte":"Schockphase beendet — deeskalieren"}</div></div>
      <div class="res em"><div class="lab">Zieldiurese</div><div class="val">${p.rhabdo?r0(c.uoRhab):r0(c.uoLo)+"–"+r0(c.uoHi)}<small> ml/h</small></div>
        <div class="sub">${c.uoMode==="rhabdo"?"2 ml/kg/h · Rhabdomyolyse":c.uoMode==="kind"?"1 ml/kg/h · Kind < 30 kg":"0,5–1,0 ml/kg/h"}</div></div>
    </div>

    <div class="plan big">
      <div class="lane-lab">Volumenregime</div>
      <div class="lane">
        <div class="blk a" style="left:0;width:${pos(8)}%"><b>${r0(c.pkRate8)}</b> ml/h<span>Hälfte in 8 h</span></div>
        <div class="blk b" style="left:${pos(8)}%;width:${pos(16)}%"><b>${r0(c.pkTotal/2/16)}</b> ml/h<span>Rest über 16 h</span></div>
        ${!past?`<div class="now" style="left:${nowPct}%"></div>`:""}
      </div>
      <div class="lane-lab">Pflichtpunkte</div>
      <div class="lane m">
        ${(()=>{ const g={}; items.forEach(i=>{ (g[i.t0]=g[i.t0]||[]).push(i); });
          return Object.keys(g).map(k=>{ const t0=+k, grp=g[k];
            const st = grp.some(i=>!done[i.k]&&c.h>i.t1) ? "o"
                     : grp.some(i=>!done[i.k]&&c.h>=i.t0&&c.h<=i.t1) ? "n"
                     : grp.every(i=>done[i.k]) ? "d" : "";
            const side = t0===0 ? "left:0;margin-left:0" : t0>=24 ? "right:0;margin-left:0" : `left:${pos(t0)}%`;
            return `<div class="tick ${st}" style="${side}"><span>${grp.length}</span></div>`; }).join(""); })()}
        ${!past?`<div class="now" style="left:${nowPct}%"></div>`:""}
      </div>
      <div class="ax">${[0,4,8,12,16,20,24].map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="axlab">Stunden ab Unfallzeitpunkt${past?" · Fenster abgelaufen":""}</div>
    </div>`;

    const grp = (t,cls,arr)=> arr.length ? `<div class="sh-grp ${cls}"><div class="sh-gt">${t} <b>${arr.length}</b></div>${
      arr.map(i=>`<label class="prow ${cls==="over"?"over":cls==="now"?"now":"fut"}">
        <input type="checkbox" data-plan="${i.k}"><span class="win">${i.t0===i.t1?`ab ${i.t0} h`:`${i.t0}–${i.t1} h`}</span>
        <span class="txt">${esc(i.txt)}</span></label>`).join("")}</div>` : "";
    h += grp(past?"Offen geblieben":"Überfällig","over",over) + grp("Jetzt fällig","now",now) + grp("Später","fut",soon);
    if(!over.length && !now.length && !soon.length) h += `<div class="note i">Alle Pflichtpunkte der ersten 24 Stunden sind abgehakt.</div>`;
  }

  h += `</div><div class="sh-hint">◀ ▶ wischen für das nächste Bett · nach unten wischen zum Schließen</div>`;
  box.innerHTML = h;
  if(dir) { box.classList.remove("sl","sr"); void box.offsetWidth; box.classList.add(dir>0?"sl":"sr"); }
  $("#shClose").onclick = sheetClose;
  $("#shPrev").onclick  = ()=>stepBed(-1);
  $("#shNext").onclick  = ()=>stepBed(1);
  box.querySelectorAll("[data-plan]").forEach(cb=>cb.onchange=()=>{
    p.done = p.done||{};
    if(cb.checked) p.done[cb.dataset.plan]=Date.now(); else delete p.done[cb.dataset.plan];
    p.updated=Date.now(); save(); renderSheet(0); renderBeds();
  });
}

/* ---------- Gestenerkennung ----------
   Grundregel: Wurde während der Berührung gescrollt, war es kein Wisch.
   -------------------------------------- */
(function(){
  let T=null;
  const H_MIN = 90;    // Mindestweg waagerecht
  const H_RATIO = 2.2; // waagerecht muss deutlich überwiegen
  const V_CLOSE = 130; // Mindestweg zum Schließen des Vollbilds
  const V_RATIO = 2.5;

  const noSwipe = el => {
    const t=(el.tagName||"").toLowerCase();
    if(["input","textarea","select","option"].includes(t)) return true;
    return !!(el.closest && el.closest("input,textarea,select,.formula,.ref .body table,.plist,.sh-grp"));
  };
  const curView = () => (document.querySelector("nav button.on")||{}).dataset?.v;
  const scrollPos = () => SHEET ? ($("#sheet").scrollTop||0) : (window.scrollY||0);

  document.addEventListener("touchstart", e=>{
    if(e.touches.length!==1){ T=null; return; }
    const t=e.touches[0];
    T={x:t.clientX, y:t.clientY, t:Date.now(), el:e.target, sc:scrollPos(), moved:false};
  }, {passive:true});

  document.addEventListener("touchmove", e=>{
    if(!T || e.touches.length!==1) return;
    // Sobald sich die Ansicht bewegt hat, ist es ein Scrollvorgang
    if(Math.abs(scrollPos() - T.sc) > 4) T.moved = true;
  }, {passive:true});

  document.addEventListener("touchend", e=>{
    const st=T; T=null;
    if(!st || !e.changedTouches[0]) return;
    if(st.moved) return;                               // es wurde gescrollt
    if(Math.abs(scrollPos() - st.sc) > 4) return;      // Nachlauf des Scrollens
    if(noSwipe(st.el)) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-st.x, dy=t.clientY-st.y, dt=Date.now()-st.t;
    if(dt>700) return;

    // Waagerecht: Bett wechseln
    if(Math.abs(dx)>H_MIN && Math.abs(dx) > Math.abs(dy)*H_RATIO){
      if(SHEET || curView()==="pat") stepBed(dx<0 ? 1 : -1);
      return;
    }
    // Senkrecht nach unten schließt das Vollbild — nur ganz oben und nur eindeutig
    if(SHEET && dy>V_CLOSE && Math.abs(dy) > Math.abs(dx)*V_RATIO && st.sc<=2){ sheetClose(); }
  }, {passive:true});
})();

/* ============================================================
   Navigation, Sichern/Laden, Start
   ============================================================ */
function go(v){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  window.scrollTo(0,0);
  if(v==="beds") renderBeds();
  if(v==="pat")  renderPat();
  if(v==="calc") renderCalc();
  if(v==="ref")  renderRef();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));

$("#btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = URL.createObjectURL(blob); a.download = `verbrennungs-station_${d}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast("Sicherung gespeichert");
};
$("#btnImport").onclick = ()=>$("#fileIn").click();
$("#fileIn").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.beds)) throw 0;
      while(d.beds.length < N_BEDS) d.beds.push(blank(d.beds.length+1));
      S = {beds:d.beds.slice(0,N_BEDS), cur:d.cur||1};
      S.beds.forEach((b,i)=>b.id=i+1);
      save(); go("beds"); toast("Daten geladen");
    }catch(err){ toast("Datei nicht lesbar"); }
    e.target.value="";
  };
  rd.readAsText(f);
};

// Burn-Tage wandern über Mitternacht weiter
setInterval(()=>{ const v=document.querySelector("nav button.on").dataset.v; if(v==="beds") renderBeds(); }, 60000);

renderBeds();
$("#verline").textContent = "Version " + APP_VERSION;

/* Offlinebetrieb ist optional: Liegt eine sw.js daneben, wird sie genutzt.
   Fehlt sie, läuft die App unverändert weiter — die Registrierung scheitert still. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing; if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller) toast("Neue Version geladen — App neu öffnen");
        });
      });
    }).catch(()=>{});
  });
}

$("#hsub").textContent = `${N_BEDS} Betten · lokal gespeichert`;
