<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BurnICU — V1 Schicht- und Übergabeliste</title>
<meta name="description" content="Schicht- und Übergabeliste der Verbrennungs-Intensivstation (V1). Daten bleiben lokal auf dem Gerät.">
<meta name="theme-color" content="#f3f6f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BurnICU">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>try{localStorage.setItem('burnicu_theme','light');}catch(e){}document.documentElement.dataset.theme='light';</script>
<style>
:root{
  --bg:#0e151c; --surf:#151f29; --raise:#1c2936; --raise2:#243546;
  --line:#26364a; --line2:#35506a;
  --txt:#e7eef5; --mut:#8ea3b8; --dim:#5f7891;
  --grn:#2ee6a6; --blu:#5b9bd5; --amb:#f2b544; --red:#ff6b6b;
  --grn-soft:rgba(46,230,166,.14); --blu-soft:rgba(91,155,213,.16);
  --amb-soft:rgba(242,181,68,.16); --red-soft:rgba(255,107,107,.16);
  --on-accent:#062a1e; --tint-blu:#d6e8f8; --tint-grn:#bff3e0; --tint-amb:#ffe2a8; --tint-red:#ffd0d0;
  --stripe:rgba(255,255,255,.02); --overlay:rgba(5,9,13,.7); --bar:rgba(14,21,28,.94);
  --r:12px;
}
/* Helles Layout — Farben aus dem Logo (Navy #1d4268, Teal #2c9faa) */
html[data-theme="light"]{
  --bg:#f3f6f9; --surf:#ffffff; --raise:#eef2f6; --raise2:#e1e8f0;
  --line:#d6dee7; --line2:#b4c2d2;
  --txt:#16294a; --mut:#4f6482; --dim:#8394aa;
  --grn:#1f8f9b; --blu:#1d4268; --amb:#b8730a; --red:#c62f38;
  --grn-soft:rgba(44,159,170,.16); --blu-soft:rgba(29,66,104,.12);
  --amb-soft:rgba(184,115,10,.14); --red-soft:rgba(198,47,56,.12);
  --on-accent:#ffffff; --tint-blu:#16294a; --tint-grn:#0f5c64; --tint-amb:#6d4300; --tint-red:#8f1d24;
  --stripe:rgba(22,41,74,.035); --overlay:rgba(22,41,74,.45); --bar:rgba(243,246,249,.94);
}
html[data-theme="light"] .cnt{color:#fff}
html[data-theme="light"] .dot.on{box-shadow:none}
html[data-theme="light"] .paper{box-shadow:0 6px 30px rgba(22,41,74,.18);border:1px solid var(--line)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
input,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--bar);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.brand b{font-weight:600}
.brand span{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{min-height:40px;padding:0 14px;border-radius:9px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab.on{background:var(--raise2);color:var(--txt)}
.cnt{background:var(--red);color:#1a0a0a;border-radius:10px;padding:0 7px;font-size:12px;font-weight:600;line-height:18px}
.cnt.amb{background:var(--amb)}
.shiftbtn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.shiftbtn.on{border-color:rgba(46,230,166,.45);color:var(--grn)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.iconbtn{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);padding:0 10px}
.iconbtn:active{background:var(--raise)}
main{flex:1;padding:16px;max-width:1440px;width:100%;margin:0 auto}
.viewhead{display:flex;align-items:baseline;gap:14px;margin:4px 0 14px}
.viewhead h1{font-size:20px;font-weight:600;margin:0}
.viewhead .sub{color:var(--mut)}
.viewhead .grow{flex:1}

/* buttons */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--grn);color:var(--on-accent);border-color:transparent}
.btn.blue{background:var(--blu-soft);border-color:var(--blu);color:var(--tint-blu)}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,.4)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line2);color:var(--mut);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--surf)}
.chip.on{background:var(--blu-soft);border-color:var(--blu);color:var(--tint-blu)}
.chip.grn{background:var(--grn-soft);border-color:var(--grn);color:var(--tint-grn)}
.chip.static{min-height:26px;font-size:13px;padding:0 9px;border-color:var(--line);color:var(--txt)}

/* Zimmerplan */
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.rooms{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.rooms{grid-template-columns:repeat(2,1fr)}}
.room{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.room-h{color:var(--mut);font-size:13px;padding:0 4px;display:flex;justify-content:space-between}
.bed{display:grid;grid-template-columns:28px 1fr auto;grid-template-rows:auto auto;align-items:center;gap:2px 8px;min-height:64px;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line);width:100%}
.bed.mine{border-color:rgba(46,230,166,.45);background:linear-gradient(90deg,var(--grn-soft),var(--raise) 55%)}
.bed.other{color:var(--mut)}
.bed.empty{border-style:dashed;color:var(--dim);background:transparent}
.bed.hasHot{box-shadow:inset 3px 0 0 var(--red)}
.bed-pl{grid-row:1/3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);color:var(--mut);font-weight:600;font-size:14px}
.bed.mine .bed-pl{color:var(--grn)}
.bed-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed-meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.bed-sub{grid-column:2/3;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed.empty .bed-sub{grid-column:2/4}

/* Liste */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.pcard{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;position:relative}
.pcard.mine{border-left:3px solid var(--grn)}
.pcard.hasHot{border-left-color:var(--red)}
.pcard-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bedtag{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:600;font-size:14px}
.pcard-h b{font-size:17px}
.tag{color:var(--mut);font-size:13px}
.ve{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:flex-start}
.lb{flex:none;width:76px;color:var(--dim);font-size:12px;padding-top:5px;text-transform:none}
.sysdots{display:flex;gap:6px;flex-wrap:wrap}
.sd{min-width:34px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--raise);color:var(--dim);border:1px solid var(--line);padding:0 7px}
.sd.auff{background:var(--amb-soft);color:var(--amb);border-color:rgba(242,181,68,.45)}
.sd.hot{background:var(--red-soft);color:var(--red);border-color:rgba(255,107,107,.5)}
.sd.bess{background:var(--grn-soft);color:var(--grn);border-color:rgba(46,230,166,.45)}
.sd.has{color:var(--mut)}
.others{margin-top:22px}
.others h2{font-size:15px;color:var(--mut);font-weight:500;margin:0 0 8px}
.orow{display:grid;grid-template-columns:64px 160px 1fr 1fr;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;background:var(--surf);border:1px solid var(--line);margin-bottom:6px;color:var(--mut)}
.orow b{color:var(--txt)}
.orow .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.orow{grid-template-columns:64px 1fr}.orow .hidesm{display:none}}

/* Kette */
.kette{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.kette .arr{color:var(--dim);padding:0 3px;font-size:15px}
.pill{display:inline-flex;align-items:baseline;gap:6px;min-height:30px;padding:3px 10px;border-radius:8px;background:var(--raise);border:1px solid var(--line);font-size:14px;line-height:1.3}
.pill .pd{color:var(--dim);font-size:11px}
.pill.cur{border-color:var(--line2);background:var(--raise2);font-weight:500}
.pill.new{box-shadow:inset 0 -2px 0 var(--grn)}
.pill.more{color:var(--dim);border-style:dashed}
.kette.compact .pill{min-height:24px;padding:1px 8px;font-size:13px}
.empty{color:var(--dim);font-size:14px;padding:4px 0}

/* Fokus */
.fgroup{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fgroup-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;width:100%}
.fitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fitem .what{flex:1}
.fitem .src{color:var(--dim);font-size:12px;white-space:nowrap}
.fitem.sys .what{color:var(--txt)}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--grn)}
.check.on{border-color:var(--grn);background:var(--grn-soft)}
.flame{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim);flex:none;font-size:13px;font-weight:700}
.flame.on{background:var(--red-soft);border-color:rgba(255,107,107,.6);color:var(--red)}

/* Patient detail */
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h1{margin:0;font-size:22px;font-weight:600}
.phead .grow{flex:1}
.minetoggle{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:8px;color:var(--mut)}
.minetoggle.on{border-color:rgba(46,230,166,.5);color:var(--grn);background:var(--grn-soft)}
.pgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
@media (max-width:980px){.pgrid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-h h2{margin:0;font-size:15px;font-weight:600}
.sec-h .hint{color:var(--dim);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.auff{box-shadow:0 0 0 2px var(--amb)}
.sec.hot{box-shadow:0 0 0 2px var(--red)}
.sec.bess{box-shadow:0 0 0 2px var(--grn)}
.flag{min-width:40px;height:32px;border-radius:8px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:12px;color:var(--mut);flex:none}
.flag.auff{background:var(--amb-soft);border-color:var(--amb);color:var(--amb)}
.flag.hot{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.flag.bess{background:var(--grn-soft);border-color:var(--grn);color:var(--grn)}
.flagpick{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 10px}
.flagpick .flag{min-height:40px;padding:0 14px;font-size:14px;opacity:.75}
.flagpick .flag.ok{color:var(--txt)}
.flagpick .flag.sel{opacity:1;outline:2px solid currentColor;outline-offset:1px}
.entries{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.entry{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:baseline;padding:7px 8px;border-radius:8px;width:100%;border-left:2px solid transparent}
.entry:nth-child(even){background:var(--stripe)}
.entry.new{border-left-color:var(--grn)}
.entry.last{font-weight:500}
.entry .et{color:var(--dim);font-size:12px}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1}
.addbtn{width:44px;height:44px;border-radius:10px;background:var(--blu-soft);border:1px solid var(--blu);color:var(--tint-blu);display:grid;place-items:center;font-size:22px;flex:none}
.addbtn.grn{background:var(--grn-soft);border-color:rgba(46,230,166,.5);color:var(--grn)}
.chipsrow{margin-top:8px}
.editrow{display:flex;flex-direction:column;gap:8px;background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:8px}
.editrow .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.task{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;width:100%}
.task .tt{flex:1;padding:6px 0;line-height:1.3}
.task.done .tt{color:var(--dim);text-decoration:line-through}
.task.hot .tt{color:var(--tint-red);font-weight:500}
.task .td{color:var(--dim);font-size:12px;white-space:nowrap}
.task.new .tt::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grn);margin-left:8px;vertical-align:middle}

/* Modal */
.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal{background:var(--surf);border:1px solid var(--line2);border-radius:16px;padding:18px;width:min(880px,100%);display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--mut);font-size:13px}
.roomgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rbtn{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);display:grid;place-items:center;font-weight:600}
.rbtn.on{background:var(--blu-soft);border-color:var(--blu);color:var(--tint-blu)}
.rbtn.busy{color:var(--dim);background:transparent;border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;padding:0 18px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--blu-soft);color:var(--tint-blu)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .acts .left{margin-right:auto}
.warn{color:var(--amb);font-size:14px}
.menu{position:absolute;right:16px;top:60px;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:6px;z-index:30;min-width:220px;display:flex;flex-direction:column}
.menu button{min-height:44px;padding:0 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.menu button:active{background:var(--raise)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu .danger{color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raise2);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.banner{background:var(--amb-soft);border:1px solid var(--amb);color:var(--tint-amb);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}

/* Druck */
.druck-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.paper{background:#fff;color:#111;max-width:210mm;margin:0 auto;padding:14mm 14mm 16mm;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);
  font:8pt/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.paper h1{font-size:13pt;margin:0;font-weight:700}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5pt solid #111;padding-bottom:4pt;margin-bottom:8pt}
.ph .meta{color:#444;font-size:9.5pt}
.pnote{border:1pt solid #999;padding:4pt 6pt;margin-bottom:8pt;background:#f5f5f5}
.pp{border:1.2pt solid #111;border-radius:3pt;padding:4pt 6pt 4pt;margin-bottom:5pt;break-inside:avoid;page-break-inside:avoid}
.pp:last-of-type{margin-bottom:0}
.pp-h{border-bottom:.8pt solid #333;padding-bottom:2pt}
.pp-h{display:flex;gap:7pt;align-items:baseline;flex-wrap:wrap;margin-bottom:3pt}
.pp-h .zi{font-weight:700;border:1.2pt solid #111;padding:0 5pt;border-radius:3pt}
.pp-h .nm{font-weight:700;font-size:10.5pt}
.pp-h .tg{color:#555;font-size:9.5pt}
.pp-h .ve{color:#333;font-size:9.5pt;flex-basis:100%}
.pr{display:grid;grid-template-columns:58pt 1fr;gap:5pt;padding:.8pt 0}
.pr .l{color:#666;font-size:9pt;padding-top:1pt}
.pr .v{min-width:0}
.pk .sp{color:#888;padding:0 3pt}
.pk .cur{font-weight:600}
.pk .n{border-bottom:1.5pt solid #111}
.pk .d{color:#888;font-size:8.5pt;margin-right:2pt}
.pk .ctx{color:#777}
.bs .h{font-weight:700}
.bs .h::before{content:"■ ";color:#111}
.bs .o::before{content:"□ "}
.bs span{margin-right:10pt;display:inline-block}
.pl .o::before{content:"☐ ";}
.pl .d{color:#888;text-decoration:line-through}
.pl .d::before{content:"☑ "}
.pl span{margin-right:10pt;display:inline-block}
.psys{margin-top:2pt;border-top:.8pt solid #333;padding-top:2pt;display:grid;grid-template-columns:1fr 1fr;gap:0;column-gap:12pt;position:relative}
.psys .pr{border-top:.5pt solid #ccc;padding:2pt 0}
.psys .pr:nth-child(1),.psys .pr:nth-child(2){border-top:0}
.psys::after{content:"";position:absolute;top:2pt;bottom:0;left:50%;border-left:.5pt solid #ccc}
.psys .pr{grid-template-columns:52pt 1fr}
.psys .pr.f-auff .l{color:#a86b00;font-weight:600}
.psys .pr.f-hot .l{color:#b00020;font-weight:700}
.psys .pr.f-hot .l::before{content:"■ "}
.psys .pr.f-bess .l{color:#1a7f4b;font-weight:600}
.psys .pr.f-bess .l::before{content:"↗ "}
.ptab{width:100%;border-collapse:collapse;margin-top:6pt;font-size:9.5pt}
.ptab th{text-align:left;border-bottom:1pt solid #111;padding:2pt 4pt;font-weight:600;color:#333}
.ptab td{border-bottom:.5pt solid #ccc;padding:3pt 4pt;vertical-align:top}
.ptab td:first-child{white-space:nowrap;font-weight:600}
.pfoot{margin-top:10pt;color:#777;font-size:8.5pt;display:flex;justify-content:space-between}
.psec{margin-top:10pt;font-size:11pt;font-weight:700;border-bottom:1pt solid #111;padding-bottom:2pt}
.pempty{color:#777;font-style:italic;padding:6pt 0}

@media print{
  @page{margin:11mm 12mm}
  html,body{background:#fff;color:#111}
  .topbar,.no-print,.toast,.menu,.modal-bg{display:none!important}
  main{padding:0;max-width:none}
  .paper{box-shadow:none;border-radius:0;padding:0;max-width:none;margin:0}
  .pk .n{border-bottom:1.5pt solid #000}
}

@media (max-width:900px){
  .topbar{gap:8px;padding:8px 10px}
  .brand{display:none}
  .tabs{margin-left:0;flex:1;overflow-x:auto;scrollbar-width:none}
  .tab{padding:0 10px}
  .shiftbtn{padding:0 10px}
  main{padding:12px}
}

/* Vorerkrankungen-Picker */
.cdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chip.ve{gap:7px}
.chip.ve .x{color:var(--mut);margin-left:2px;font-size:16px;line-height:1}
.chip.static.ve{min-height:28px;gap:6px}
.vesel{padding:8px;border:1px dashed var(--line2);border-radius:10px;margin-bottom:8px}
.vegroup{margin-top:12px}
.vegroup-h{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin-bottom:6px}
.addbtn:disabled{opacity:.35}

/* zweite Chip-Zeile: Symbole + Verlaufswörter */
.tier2{margin-top:6px}
.tier2 .chip{min-height:30px;font-size:13px;padding:0 10px;color:var(--dim);border-color:var(--line)}
.tier2 .chip.sym{min-width:44px;min-height:30px;justify-content:center;font-size:17px;font-weight:600;color:var(--txt);border-color:var(--line2);background:var(--raise)}
.tier2 .tsep{width:1px;align-self:stretch;background:var(--line2);margin:0 4px;flex:none}

/* Hauptdiagnose */
.diag-row{flex-basis:100%;display:flex;gap:10px;align-items:flex-start;margin-top:2px}
.diag-row .lb{width:auto;white-space:nowrap}
input.diag{background:var(--surf);border-color:var(--line);font-size:17px;font-weight:600;color:var(--grn);padding:8px 12px}
input.diag::placeholder{color:var(--dim);font-weight:400}
.diag-line{font-size:16px;font-weight:600;color:var(--grn);margin-top:-4px}
.pp-h .dg{font-weight:600;flex-basis:100%;margin-top:1pt}

/* Chip-Gruppen als Reiter */
.gtabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.gtab{min-height:34px;padding:0 12px;color:var(--dim);font-size:13px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.gtab.on{color:var(--txt);border-bottom-color:var(--blu)}
.gtabs + .chipsrow{margin-top:8px}

/* Labor je System */
.labblock{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.lab-h{color:var(--dim);font-size:12px;margin-bottom:4px}
.labrow{display:grid;grid-template-columns:32px 118px 1fr 22px;gap:6px;align-items:center;padding:3px 0;border-radius:8px}
.labrow.imp{background:var(--amb-soft)}
.star{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim);font-size:17px}
.star.on{color:var(--amb)}
.labname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labname .unit{color:var(--dim);font-weight:400;font-size:11px;margin-left:4px}
.labvals{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 1px;min-width:0}
.labvals .arr{color:var(--dim);padding:0 2px;font-size:13px}
.lv{display:inline-flex;align-items:baseline;gap:4px;min-height:28px;padding:2px 8px;border-radius:7px;background:var(--raise);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.lv .pd{color:var(--dim);font-size:10px}
.lv.cur{font-weight:600;border-color:var(--line2);background:var(--raise2)}
.lv.new{box-shadow:inset 0 -2px 0 var(--grn)}
.lv.more{color:var(--dim);border-style:dashed}
.trend{font-size:16px;font-weight:700;text-align:center}
.tup,.tdown{color:var(--txt)} .tflat{color:var(--dim)}
.labchips{flex:1}
.chip.dash{border-style:dashed;color:var(--dim)}
input.labinput{max-width:280px}
.chip.static.lab{gap:6px}
.chip.static.lab .tr{font-weight:700}

/* Druck */
.plab{display:block;margin-top:1pt;color:#333;font-size:9pt}
.plab .pl1{display:inline-block;margin-right:8pt;white-space:nowrap;font-size:8.5pt;color:#444}
.plab .pl1 .lold{font-size:7pt;color:#888;font-weight:400}
.plab .pl1 .lcur{color:#111}
.plab .pl1.imp{color:#000}
.plab .pl1.imp .pln{font-weight:600}
.plab .pl1.imp .lcur{font-weight:700;font-size:10.5pt}
.plab .pl1.imp .lold{font-size:7pt;font-weight:400;color:#888}
.plab .sp{color:#999;padding:0 1pt}
.plab .n{border-bottom:1pt solid #000}
.plab .tr{font-weight:700}

/* To-Do mit Priorität */
.prio{min-height:28px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--mut);display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.prio.p1{background:var(--red-soft);border-color:rgba(255,107,107,.6);color:var(--red)}
.prio.p2{background:var(--amb-soft);border-color:rgba(242,181,68,.5);color:var(--amb)}
.prio.p3{color:var(--mut)}
.prio.sel{outline:2px solid currentColor;outline-offset:1px}
.task.done .prio{opacity:.4}
.prioseg{display:flex;gap:8px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.prioseg .prio{min-height:36px;padding:0 14px;font-size:13px;opacity:.7}
.prioseg .prio.sel{opacity:1}
.fitem .bedtag{flex:none}
/* Druck */
.ptodo .o.p1{font-weight:700}
.ptodo .o.p1::before{content:"☐ ‼ "}
.ptodo .o.p3{color:#777}

/* Volumen-Panel */
.volpanel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
@media (max-width:980px){.volpanel{grid-template-columns:1fr}}
.voltile{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.voltile-h{color:var(--mut);font-size:13px}
.volbig{font-size:22px;font-weight:600;line-height:1.2}
.voltile.st-hypo{border-color:rgba(91,155,213,.6)} .voltile.st-hypo .volbig{color:var(--blu)}
.voltile.st-eu{border-color:rgba(46,230,166,.5)} .voltile.st-eu .volbig{color:var(--grn)}
.voltile.st-hyper{border-color:rgba(242,181,68,.6)} .voltile.st-hyper .volbig{color:var(--amb)}
.voltile.st-none .volbig,.voltile.zi-none .volbig{color:var(--dim);font-weight:400;font-size:18px}
.volseg{display:flex}
.volseg button{flex:1;min-height:40px;padding:0 6px;font-size:14px;text-align:center}
.volseg button.on.st-hypo{background:var(--blu-soft);color:var(--tint-blu)}
.volseg button.on.st-eu{background:var(--grn-soft);color:var(--tint-grn)}
.volseg button.on.st-hyper{background:var(--amb-soft);color:var(--tint-amb)}
.mlrow{border-top:1px solid var(--line);padding-top:6px}
.mlrow:first-of-type{border-top:0;padding-top:0}
.mlhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mllab{color:var(--mut);font-size:13px}
.mlbig{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.mlbig.pos{color:var(--amb)} .mlbig.neg{color:var(--blu)}
.volwarn{color:var(--red);font-size:14px;font-weight:500}
.volpanel.warn .voltile:last-child{border-color:rgba(255,107,107,.6)}
.chip.static.vs{min-height:28px;gap:5px}
.chip.static.vs.st-hypo{border-color:var(--blu);color:var(--tint-blu)}
.chip.static.vs.st-eu{border-color:var(--grn);color:var(--tint-grn)}
.chip.static.vs.st-hyper{border-color:var(--amb);color:var(--tint-amb)}
.chip.static.vs.warnchip{border-color:var(--red);color:var(--tint-red)}
.volrow.warn .lb{color:var(--red)}
/* Druck */
.pvol .v{font-size:8.5pt;color:#444}
.pvol .pwarn{font-weight:600;color:#b00020}

/* Logo im Kopf */
.brand .logo{height:40px;width:auto;display:block}
.brand span{margin-top:2px}
.menu .foot{color:var(--dim);font-size:12px;padding:8px 12px 4px}
.updbar{display:flex;align-items:center;gap:12px;justify-content:space-between}

/* ===== v1.1: Systemfarben, Übergabe-Markierung, Labor gesamt, Volumen iv/pulm, Infektio ===== */
.sec.sys{border-left:5px solid var(--sc);overflow:hidden}
@supports not (background:color-mix(in srgb,red 10%,transparent)){.sec.sys .sec-h{background:var(--raise)}}
.sec.sys .sec-h h2{color:var(--sc)}
html[data-theme="light"] .sec.sys .sec-h h2{color:color-mix(in srgb,var(--sc) 60%,#16294a)}
.sysbadge{min-width:34px;height:26px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--sc);color:#0e151c;flex:none}
html[data-theme="light"] .sysbadge{color:#fff}
.sd{border-left:3px solid var(--sc,var(--line))}
/* Übergabe-Flagge */
.flagbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim);flex:none;font-size:14px}
.flagbtn.on{background:var(--grn-soft);border-color:var(--grn);color:var(--grn)}
.fl{color:var(--grn);font-weight:700}
.entry.ueb{background:var(--grn-soft)}
.pill.ueb{border-color:var(--grn);background:var(--grn-soft)}
.task.ueb .tt{color:var(--txt)}
.task.ueb{background:var(--grn-soft);border-radius:8px}
.ueb-btn.on{border-color:var(--grn);color:var(--grn)}
.uebcnt{background:var(--grn);color:#062a1e;border-radius:10px;padding:0 8px;font-size:12px;font-weight:700;line-height:18px;white-space:nowrap}
.uebsec{border-color:rgba(46,230,166,.5)}
.uebsec .sec-h h2{color:var(--grn)}
.ueblist{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.uebitem{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;background:var(--grn-soft)}
.uebkind{flex:none;min-width:64px;font-size:11px;font-weight:700;color:var(--grn);text-transform:uppercase;letter-spacing:.03em}
.uebtext{flex:1;min-width:0}
.optrow{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px}
.optrow.on{border-color:var(--line2)}
/* Labor gesamt */
.labsec{margin-bottom:16px}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px 18px;margin-bottom:10px}
@media (max-width:560px){.labgrid{grid-template-columns:1fr}}
.labgroup-h{color:var(--mut);font-size:12px;margin:2px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.labrow{grid-template-columns:32px 32px 112px 1fr 22px}
.labrow.ueb{background:var(--grn-soft)}
.labrow.imp.ueb{background:linear-gradient(90deg,var(--amb-soft),var(--grn-soft))}
/* Volumen intravasal / pulmonal */
.volsplit{display:grid;grid-template-columns:1fr;gap:8px}
.vollab{color:var(--mut);font-size:12px}
.volbig.iv,.volbig.pu{font-size:19px}
.voltile.pu-trocken .volbig.pu{color:var(--blu)} .voltile.pu-feucht .volbig.pu{color:var(--amb)} .voltile.pu-oedem .volbig.pu{color:var(--red)}
.volseg button.on.pu-trocken{background:var(--blu-soft);color:var(--tint-blu)}
.volseg button.on.pu-feucht{background:var(--amb-soft);color:var(--tint-amb)}
.volseg button.on.pu-oedem{background:var(--red-soft);color:var(--tint-red)}
.chip.static.vs.pu-trocken{border-color:var(--blu);color:var(--tint-blu)}
.chip.static.vs.pu-feucht{border-color:var(--amb);color:var(--tint-amb)}
.chip.static.vs.pu-oedem{border-color:var(--red);color:var(--tint-red)}
/* Infektio-Panel */
.infpanel{margin:0 0 12px;padding:10px 12px 12px;border:1px dashed var(--line2);border-radius:12px;background:var(--stripe)}
.inf-h{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mut);font-size:13px;margin:8px 0 6px}
.inf-h:first-child{margin-top:0}
.fokuscard{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin:6px 0 10px;background:var(--surf)}
.fokus-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fk-row{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.fk-row .lb{width:92px}
.llreg{font-weight:500;padding:3px 0}
.ther-opt{padding:4px 0;border-top:1px dashed var(--line)}
.ther-opt:first-child{border-top:0}
.fk-ther{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fk-text{color:var(--mut);font-size:13px;margin-top:2px}
.chip.mini{min-height:28px;font-size:13px;padding:0 9px}
.errlist{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.errrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.errw{color:var(--mut);font-size:13px;flex:1;min-width:180px}
.therrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px;border-radius:8px;background:var(--surf);border:1px solid var(--line);margin-bottom:4px}
.therrow.ended{opacity:.55}
.thername{min-width:120px}
.thertag{min-height:24px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;color:var(--dim)}
.thertag.on{background:var(--grn-soft);color:var(--grn)}
.therstart{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.therstart input{min-height:36px;padding:4px 8px;width:auto}
.infline{color:var(--txt);font-size:14px;flex:1}
/* Druck */
.pubox{border:1.5pt solid #000;border-radius:3pt;padding:5pt 7pt;margin:3pt 0 5pt;background:#f4f4f4}
.pubox-h{font-weight:700;font-size:10.5pt;margin-bottom:2pt}
.pubox-note{white-space:pre-wrap;margin-bottom:3pt;font-weight:600}
.pubox-item{display:flex;gap:6pt;padding:1pt 0}
.pubox-k{flex:none;min-width:46pt;color:#555;font-size:8.5pt;text-transform:uppercase;padding-top:1pt}
.pfl{font-weight:700}
.plabline .plab{display:inline;font-size:9.5pt;color:#111}
.pinf .v{font-size:9.5pt}
.llreg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.llbtn{min-height:32px;font-size:13px}

/* Arztbrief */
.briefgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:980px){.briefgrid{grid-template-columns:1fr}}
.brieftext{min-height:70vh;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
.briefout{position:sticky;top:76px}
@media (max-width:980px){.briefout{position:static}}
.medrow{border-top:1px solid var(--line)}
.medrow.sel .tt{color:var(--txt)}
.medrow:not(.sel) .tt{color:var(--mut)}
.medrow input{min-height:38px}

/* Blanko-Plan zum Ausfüllen */
.blankwrap{display:flex;flex-direction:column;gap:20px}
.paper.blank{display:flex;flex-direction:column}
.bp{border:1pt solid #333;border-radius:3pt;padding:3pt 6pt;margin-bottom:3mm;display:flex;flex-direction:column;justify-content:space-between;break-inside:avoid;page-break-inside:avoid;box-sizing:border-box;overflow:hidden}
.bp:last-child{margin-bottom:0}
.bp .l{color:#555;font-size:8pt;line-height:1;white-space:nowrap;flex:none}
.bp .ln{border-bottom:.6pt dotted #888;flex:1;min-width:0;display:block;height:100%}
.bp-h{display:flex;align-items:baseline;gap:6pt;border-bottom:1pt solid #333;padding-bottom:2pt;height:15pt;flex:none;overflow:hidden}
.bp-h .zi{font-weight:700;border:1.2pt solid #111;border-radius:3pt;padding:0 6pt;min-width:40pt;height:12pt;text-align:center;flex:none}
.bp-h .nm{font-weight:700;font-size:11pt;flex:1;min-width:90pt;border-bottom:.6pt dotted #888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-h .tg{color:#666;font-size:8pt;flex:none}
.bp-h .sl{border-bottom:.6pt dotted #888;height:11pt;flex:none}
.bp-h .sl.w1{width:26pt} .bp-h .sl.w2{width:150pt}
.bp-diag{display:grid;grid-template-columns:78pt 1fr;gap:5pt;align-items:end;padding:2pt 0 1pt}
.bp-diag .l{color:#111;font-size:8.5pt;font-weight:700}
.bp-diag .ln{border-bottom:1pt solid #333;font-weight:700;font-size:10pt;line-height:1.15;min-height:12pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-row{display:grid;grid-template-columns:78pt 1fr;gap:5pt;align-items:end;padding:1pt 0}
.bp-row .ln{height:11pt}
.bp-row.wide .ln{border-bottom:.8pt solid #aaa}
.bp-sys{display:grid;grid-template-columns:1fr 1fr;gap:0 10pt}
.bp-sys .bp-row{grid-template-columns:74pt 1fr}
.bp-sys .l{display:flex;align-items:center;gap:3pt}
.bp .emo{font-size:8.5pt;line-height:1}
.bp-todo{display:grid;grid-template-columns:78pt 1fr;gap:5pt;align-items:start;padding:2pt 0 1pt}
.bp-todo > .l{padding-top:3pt}
.bp-todo .tds{display:grid;grid-template-columns:1fr 1fr;gap:2pt 10pt}
.bp-todo .td{display:flex;align-items:end;gap:3pt;font-size:9pt;color:#333}
.bp-todo .td .ln{height:11pt}
.bp-foot{display:grid;grid-template-columns:78pt 1fr;gap:5pt;align-items:end;border-top:.6pt solid #ccc;margin-top:2pt;padding-top:2pt;flex:none}
.bp-foot .l{color:#333;font-weight:600}
.bp-foot .ln{height:11pt;border-bottom:.8pt solid #aaa}
@media print{
  .paper.blank{page-break-after:always;height:auto}
  .paper.blank:last-child{page-break-after:auto}
  .blankwrap{gap:0}
}
/* Emoji in Badges und Chips */
.sysbadge .emo,.sd .emo{font-size:11px;margin-right:4px;line-height:1}
.psys .l .emo{margin-right:2pt}

/* Laborfavoriten */
.gtab.fav{color:var(--amb)}
.gtab.fav.on{border-bottom-color:var(--amb)}
.labgroup.favcol{grid-column:1 / -1;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.labgroup.favcol .labgroup-h{color:var(--amb)}
@media (min-width:561px){.labgroup.favcol{column-count:2;column-gap:18px}.labgroup.favcol .labgroup-h{column-span:all}}

/* Tageseintrag */
.tagesnotiz{margin-bottom:16px;border-color:rgba(46,230,166,.45)}
.tagtext{min-height:96px;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

/* Scores */
.scoremodal{width:min(860px,100%)}
.scbox{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--surf)}
.scbox-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sctotal{font-size:14px;color:var(--mut)}
.sctotal.r-mittel{color:var(--amb)} .sctotal.r-hoch{color:var(--red)} .sctotal.r-niedrig{color:var(--grn)}
.scgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scf{display:flex;flex-direction:column;gap:4px;min-width:0}
.scf.wide{grid-column:span 2}
.scl{color:var(--mut);font-size:12px}
.scl .unit{color:var(--dim);margin-left:4px}
.scf select{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);padding:0 10px}
.scparts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.scrow{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--mut)}
.scrow b{color:var(--txt)}
.scrow b.miss{color:var(--dim)}
.sctext{min-height:110px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}

/* Warnhinweis Antikoagulation */
.vak{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em;background:transparent;border:1px solid var(--line2);color:var(--mut);flex:none}
.vak.sm{min-height:0;padding:0;border:0;font-size:11px;font-weight:600;color:var(--dim)}
.pvak{border:1.2pt solid #000;border-radius:2pt;padding:0 4pt;font-weight:700;font-size:8.5pt;letter-spacing:.04em}

/* generische "keine ..."-Zeilen */
.generics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.gen{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:8px;border:1px dashed var(--line2);color:var(--dim);font-size:14px;background:transparent}
.gen:active{background:var(--raise)}
.gtag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);opacity:.8}
/* Herkunft der Score-Werte */
.scl .from{margin-left:6px;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--grn);opacity:.85}
.chip .from{margin-left:6px;font-size:10px;text-transform:uppercase;color:var(--grn);opacity:.85}
.scinfo{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.scinfo .tag{flex:1;min-width:220px}

/* Laborwerte auf dem Blankoblatt */
.blab{display:block;font-size:8pt;line-height:1.2;color:#222;padding-bottom:1pt}
.blab .bl1{display:inline-block;margin-right:7pt;white-space:nowrap}
.blab .bl1.imp{font-weight:700}

/* aufklappbare Abschnitte */
.sec.fold{padding:0;overflow:hidden}
.sec.fold .sec-h{margin:0;padding:10px 14px;gap:8px;align-items:center}
.sec.fold.open .sec-h{border-bottom:1px solid var(--line)}
.sec.fold > *:not(.sec-h){padding-left:14px;padding-right:14px}
.sec.fold > *:not(.sec-h):last-child{padding-bottom:14px}
.foldbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:36px;text-align:left}
.foldbtn h2{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
.chev{color:var(--dim);font-size:12px;width:12px;flex:none}
.fsum{color:var(--mut);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.fold.sys .sec-h{background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 22%,transparent),transparent 70%)}
.sec.fold.sys.open .sec-h{border-bottom-color:var(--sc)}
.sec.fold.sys .foldbtn h2{color:var(--sc)}
html[data-theme="light"] .sec.fold.sys .foldbtn h2{color:color-mix(in srgb,var(--sc) 60%,#16294a)}
.allfold{display:flex;gap:8px;margin:0 0 10px;justify-content:flex-end}

/* Wissen */
.wissenrow{flex-basis:100%;display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.wissenrow .lb{width:auto;white-space:nowrap;padding-top:6px}
.chip.wchip{border-color:var(--line2);color:var(--txt)}
.wissenmodal{width:min(780px,100%)}
.wbox{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--surf)}
.wbox h3{margin:0 0 8px;font-size:18px}
.wsec{margin-top:8px}
.wsec-h{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.wsec.ther .wsec-h{color:var(--grn)}
.wsec ul{margin:0;padding-left:18px}
.wsec li{padding:3px 0;line-height:1.4}

/* Arbeitsstatus */
.statusbtns{display:flex;gap:6px;flex:none}
.stbtn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;padding:0 8px;border-radius:9px;border:1px solid var(--line2);color:var(--mut);font-size:15px}
.stbtn .sticon{font-size:13px;opacity:.9}
.stbtn.on{border-color:var(--grn);color:var(--grn);background:var(--grn-soft)}
.stdots{display:inline-flex;gap:3px;flex:none}
.stdot{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font-size:9px;background:transparent;color:var(--red);border:1px solid rgba(255,107,107,.35);opacity:.8}
.stdot.on{background:var(--grn-soft);color:var(--grn);border-color:rgba(46,230,166,.5);opacity:1}
.bed-status{grid-column:3/4;grid-row:2;display:flex;justify-content:flex-end;align-items:center}

/* Diagnose-Vorschläge beim Tippen */
.diagwrap{position:relative;flex:1;min-width:0}
.diagsug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:280px;overflow:auto}
.diagsug button{display:block;width:100%;min-height:44px;padding:0 12px;border-radius:8px;text-align:left;font-size:15px}
.diagsug button:hover,.diagsug button:active{background:var(--raise)}

/* Hauptproblem an Einträgen */
.entryrow{display:flex;align-items:center;gap:6px}
.entryrow .entry{flex:1;min-width:0}
.entryrow .flame{opacity:.45}
.entryrow.hot{background:var(--red-soft);border-radius:8px}
.entryrow.hot .flame{opacity:1}
.pill.hotpill{border-color:var(--red)}
.hotmark{color:var(--red);font-weight:700}
/* Weaning */
.weanbox{margin:6px 0 10px;padding:8px 10px;border:1px dashed var(--line2);border-radius:10px}
.weanhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.weanhint{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--grn-soft);border:1px solid var(--grn);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weanlist{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.weanrow{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:8px;width:100%;text-align:left}
.weanrow:nth-child(even){background:var(--stripe)}
.weanrow.cur{background:var(--blu-soft);border:1px solid var(--blu)}
.weanrow .ws{flex:none;width:64px;color:var(--mut);font-size:12px}
/* Ernährung */
.ernbox{margin:6px 0 10px;padding:8px 10px;border-radius:10px;border:1px solid var(--grn);background:var(--grn-soft);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ernbox.stop{border-color:var(--red);background:var(--red-soft)}
/* Post-Reanimation */
.realist{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.rearow{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:8px;flex-wrap:wrap}
.rearow:nth-child(even){background:var(--stripe)}
.rearow.faellig{background:var(--amb-soft)}
.rearow.done{opacity:.55}
.rearow .reah{flex:none;width:56px;color:var(--mut);font-size:12px}
.rearow .reat{flex:1;min-width:0}
/* Übergabepunkte */
.task.ueb{background:var(--grn-soft);border-radius:8px;margin-bottom:3px}
.task.ueb.hot{background:var(--amb-soft)}
/* Druck */
.pubox-note.hot{font-weight:700}

/* Post-Reanimation: Dauerziele */
.reaziele{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--stripe);border:1px dashed var(--line2)}
.reaziel{display:flex;gap:8px;align-items:baseline;font-size:14px}
.reak{flex:none;min-width:86px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
.rearow .reak{min-width:76px}

.rearow .reat{flex:1 1 320px}
.reaziel{flex-wrap:wrap}

/* Labor: unverändert-Knopf */
.same{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);color:var(--mut);font-size:14px;font-weight:700;display:grid;place-items:center;flex:none}
.same:disabled{opacity:.3}
.same:active{background:var(--raise)}
.labrow{grid-template-columns:32px 28px 32px 112px 1fr 22px}
/* Weaning: laufende Stufe */
.weanlaeuft{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--stripe);border:1px dashed var(--line2);color:var(--mut);font-size:13px}
/* Stammdaten: Speichern oben */
.modal .tophead{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--surf);padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.modal .tophead h2{margin:0}

/* Markiertes im Ausdruck wie in der App */
.pk .ueb, .plab .pl1.ueb, .ptodo .ueb, .pl .ueb{background:#e8f3ec;box-shadow:0 0 0 1pt #e8f3ec;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pk .ueb, .ptodo .ueb, .pl .ueb{font-weight:600}
.pfl{font-weight:700}
.pk .hot{font-weight:700}
.phot{color:#b00020;font-weight:700}
.pinfline{display:block;font-weight:600;margin-bottom:1pt}

/* ===== V1 · BurnICU ===== */
.blogo{display:flex;align-items:center;gap:8px}
.blogo img{width:36px;height:36px;border-radius:9px;display:block}
.blogo b{font-size:17px;font-weight:700}
.blogo .v1{font-size:11px;font-weight:700;color:#fff;background:#d4622c;border-radius:6px;padding:1px 6px;margin:0}
.dim{color:var(--dim)}
.burntag{color:#e8743b}
html[data-theme="light"] .burntag{color:#b4501d}
.topfolds{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.topfolds .labsec{margin-bottom:0}
.topfolds .volpanel{margin-bottom:0}
.v1f.open > .sec-h + *{margin-top:10px}

/* Zimmerplan: 8 Einzelzimmer */
.bed.single{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;min-height:104px;text-align:left;padding:9px 10px}
.bed.single .bed-pl{display:none}
.bed.single .bed-name{font-size:15px;min-width:0}
.bed.single .bed-row{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.bed.single .bed-row .bed-meta{min-width:0;flex-wrap:wrap}
.bed.single .bed-status{flex:none}
.bed.single .bed-sub{min-width:0}
.bed.single.empty{justify-content:center;align-items:center;text-align:center}
.bed.single.empty .bed-name{color:var(--mut)}
.bed-extra{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut);min-width:0}
.bed-extra>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed-op.soon{color:var(--amb);font-weight:600}
.room-h{align-items:center;min-height:22px}
.roomgrid.r8{grid-template-columns:repeat(8,1fr)}
@media (max-width:520px){.roomgrid.r8{grid-template-columns:repeat(4,1fr)}}

/* Diurese */
.diuchip{display:inline-flex;align-items:center;gap:2px;min-height:26px;padding:0 9px;border-radius:13px;font-size:13px;font-weight:700;border:1px solid var(--line2);background:var(--raise);white-space:nowrap}
.diuchip.sm{min-height:22px;font-size:12px;padding:0 7px}
.diuchip.st-ok{color:var(--grn);border-color:var(--grn);background:var(--grn-soft)}
.diuchip.st-low{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.diuchip.st-high{color:var(--amb);border-color:var(--amb);background:var(--amb-soft)}
.sec.diusec{border-width:2px}
.sec.diusec.st-ok{border-color:var(--grn)}
.sec.diusec.st-low{border-color:var(--red)}
.sec.diusec.st-high{border-color:var(--amb)}
.sec.diusec .sec-h{background:linear-gradient(90deg,rgba(201,168,0,.16),transparent 70%)}
.sec.diusec .foldbtn h2{font-size:16px}
.diusum{color:var(--mut)}
.diusum b{font-size:17px;color:var(--txt)}
.diustat{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap;flex:none}
.diustat.st-ok{color:var(--grn);background:var(--grn-soft)}
.diustat.st-low{color:var(--red);background:var(--red-soft)}
.diustat.st-high{color:var(--amb);background:var(--amb-soft)}
.diustat.st-nokg,.diustat.st-none{color:var(--mut);background:var(--raise)}
.diutiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media (max-width:640px){.diutiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.diutile{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.diutile .dl{color:var(--mut);font-size:12px}
.diutile .dv{font-size:24px;font-weight:700;line-height:1.2;white-space:nowrap}
.diutile .dv small{font-size:12px;font-weight:500;color:var(--mut)}
.diutile .dv.sm{font-size:16px;padding:4px 0}
.diutile .dk{color:var(--dim);font-size:12px;min-height:16px}
.diutile.big.st-ok{border-color:var(--grn)}.diutile.big.st-ok .dv{color:var(--grn)}
.diutile.big.st-low{border-color:var(--red)}.diutile.big.st-low .dv{color:var(--red)}
.diutile.big.st-high{border-color:var(--amb)}.diutile.big.st-high .dv{color:var(--amb)}
.diubars svg{width:100%;height:104px;display:block}
.diubars .band{fill:var(--grn-soft)}
.diubars .loline{stroke:var(--grn);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.diubars .bar.st-ok{fill:var(--grn)}
.diubars .bar.st-low{fill:var(--red)}
.diubars .bar.st-high{fill:var(--amb)}
.diuaxis{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:11px;margin-top:2px}
.diuadd{display:flex;gap:8px;align-items:center;margin-top:10px}
.diuadd input:first-child{flex:1;min-width:0;font-size:18px}
.diuadd input[type=time]{width:112px;flex:none}
.chip.static.diu.st-ok{color:var(--grn);border-color:var(--grn)}
.chip.static.diu.st-low{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.chip.static.diu.st-high{color:var(--amb);border-color:var(--amb)}
.diurow .lb{color:var(--txt);font-weight:600}

/* Hinweise */
.hint-box{border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0;border:1px solid var(--line2);background:var(--raise);line-height:1.35}
.hint-box.i{border-color:var(--blu);background:var(--blu-soft)}
.hint-box.o{border-color:var(--line2);background:var(--amb-soft)}
.hint-box.w{border-color:var(--amb);background:var(--amb-soft)}
.hint-box.e{border-color:var(--red);background:var(--red-soft)}

/* Verbrennung */
.sec.burnsec{border-color:rgba(232,116,59,.5)}
.sec.burnsec .sec-h{background:linear-gradient(90deg,rgba(232,116,59,.16),transparent 70%)}
.bfrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bf input{width:100%}
.burncalc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:6px 0 10px}
.bctile{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.bctile .dl{color:var(--mut);font-size:12px}
.bctile .dv{font-size:22px;font-weight:700}
.bctile .dv small{font-size:12px;color:var(--mut);font-weight:500}
.bctile .dk{color:var(--dim);font-size:12px}
.sollist{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mut);padding:8px 10px;border:1px dashed var(--line2);border-radius:10px;margin-bottom:8px}
.sollist b{color:var(--txt)}
.sollist .warnc b{color:var(--amb)}
.phasebox{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.phasebox .ph-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.phasebox ul{margin:6px 0 8px;padding-left:20px}
.phasebox li{margin:3px 0;font-size:14px}
.ph-other{margin-top:10px;opacity:.8}

/* PiCCO */
.pictab{display:flex;flex-direction:column;margin:4px 0 10px}
.prow{display:grid;grid-template-columns:96px 84px minmax(56px,1fr) 82px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.prow .pn{font-weight:700;font-size:14px;display:flex;flex-direction:column;line-height:1.15}
.prow .pu{font-weight:400;font-size:10px;color:var(--dim)}
.prow .pv{font-size:18px;font-weight:700;white-space:nowrap}
.prow .pv.st-lo{color:var(--blu)}
.prow .pv.st-hi{color:var(--amb)}
.prow .pv.st-ok{color:var(--grn)}
.prow .ptr{font-size:14px;margin-left:4px;color:var(--mut)}
.prow .prange{color:var(--dim);font-size:12px;text-align:right;white-space:nowrap}
@media (max-width:420px){.prow{grid-template-columns:78px 74px minmax(40px,1fr);}.prow .prange{display:none}}
.spark{width:100%;height:30px;display:block}
.spark .band{fill:var(--grn-soft)}
.spark .ln{fill:none;stroke:var(--mut);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark .pt{fill:var(--txt)}.spark .pt.lo{fill:var(--blu)}.spark .pt.hi{fill:var(--amb)}.spark .pt.ok{fill:var(--grn)}
.pform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:8px}
.pin{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);flex:1 1 70px;min-width:70px}
.pin input{width:100%}
.pmeas{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.pm{display:flex;gap:8px;align-items:center;font-size:13px}
.pm .td{color:var(--dim);white-space:nowrap}
.pm .pmv{flex:1;min-width:0}

/* Medikation, Eingriffe, Verlauf, Labor je System */
.medauto{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.chip.static.done{text-decoration:line-through;color:var(--dim)}
.eingr{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.eingr .edate{flex:none;width:74px;font-weight:700;font-size:13px;display:flex;flex-direction:column;line-height:1.15}
.eingr .edate small{font-weight:500;color:var(--mut)}
.eingr.today .edate{color:var(--amb)}
.eingr.over .edate{color:var(--red)}
.eingr .tt{flex:1;text-align:left;padding:6px 0;min-width:0}
.nue{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--blu-soft);color:var(--tint-blu)}
.nue.over{background:var(--red-soft);color:var(--red)}
.eform{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
.eform .field{flex:1 1 140px}
.sec.eingrsec.soon{border-color:var(--amb)}
.soonc{color:var(--amb);font-weight:600}
.autov{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2)}
.autov .tag{margin-bottom:6px}
.syslabs{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px}
.syslabs:first-child{margin-top:10px}
.chip.static.lab.imp{background:var(--amb-soft)}

/* Druck */
.pburn{color:#8a3d12;font-size:9.5pt;font-weight:600}
.pr.pdiu .v b{font-size:10.5pt}
.pr.pdiu.st-low .l,.pr.pdiu.st-low .v b{color:#b00020}
.pr.pdiu .l{font-weight:700;color:#111}
.pr.pmeds .v{font-size:9pt}
.ppicco{display:block;font-size:8.5pt;color:#333}
.plab.sl{display:block;margin-top:1pt}
.pfoot.legend{display:block;margin-top:3pt;font-size:7.5pt;color:#666}

/* Korrekturen Testlauf 1 */
.sec.fold > .hint-box{margin-left:14px;margin-right:14px;padding:8px 10px}
.sec.fold > .sec-h + .syslabs,.sec.fold > .flagpick + .syslabs{margin-top:10px}
.eingr .tt{overflow-wrap:anywhere}
.diuvals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.diuvals .chip{min-height:30px;padding:0 10px;font-size:13px}
.diuvals .chip .dim{margin-right:4px;font-size:12px}
.diuvals .chip.st-low b{color:var(--red)}
.diuvals .chip.st-high b{color:var(--amb)}
.diuvals .chip.new{box-shadow:inset 0 -2px 0 var(--grn)}
.rooms > .room{min-width:0}
.bed.single{min-width:0;overflow:hidden}
.bed.single .bed-name,.bed.single .bed-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.fold.open > .sec-h{margin-bottom:10px}
.pcard .row .tag{white-space:normal;overflow-wrap:anywhere;min-width:0}

/* ===== Fokus, Erinnerungen, Antikoagulation (Testlauf 2) ===== */
.sec.fokussec.lvl-e{border:2px solid var(--red)}
.sec.fokussec.lvl-w{border:2px solid var(--amb)}
.fitem2{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
.fitem2 .fdot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--amb)}
.fitem2.lvl-e .fdot{background:var(--red)}
.fitem2.lvl-e{font-weight:600}
.erin{margin-top:8px}
