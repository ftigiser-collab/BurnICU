<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Verbrennungs-Station · 8 Betten</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/favicon-32.png">
<link rel="manifest" href="./manifest.webmanifest">

<style>
:root{
  /* Papier und Tinte */
  --bg:#EFF2EE; --panel:#FFFFFF; --panel2:#F5F8F3; --line:#D5DCD4; --line2:#E7ECE6;
  --tx:#16202A; --mut:#5C6A74; --dim:#8B97A0;
  /* Zwei Akzente aus dem Verbrennungs-OP */
  --acc:#0E6B63;      /* OP-Abdeckung türkis — alles, was die App berechnet */
  --steel:#22608F;    /* Kurvenblau — alles, was du einträgst */
  --ember:#A85B1B;    /* Jod-Amber — verbrennungsspezifisch */
  --warn:#8A5A00; --dang:#A82219; --ok:#1D7A54;
  --tint-acc:#E8F2F0; --tint-steel:#E9F0F7; --tint-ember:#F7EEE4;
  --tint-warn:#FBF3E2; --tint-dang:#FAEBEA;
  --r:6px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:80px}
/* Messwerte immer in Ziffern gleicher Breite — Kurvenoptik */
.num,input,.val,.chip b,td.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- Kopf ---------- */
header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0))}
.hrow{display:flex;align-items:center;gap:10px}
.mark{border-radius:7px;flex:0 0 30px;display:block}
@media print{.mark{display:none}}
.brand{font-size:15px;font-weight:800;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--ember)}
.hsub{font-size:10px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.13em}
.hbtn{margin-left:auto;display:flex;gap:6px}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:var(--r);
  padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:active{background:var(--panel2)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.d{border-color:#E2C4C1;color:var(--dang)}
.btn.sm{padding:5px 9px;font-size:12px}

/* ---------- Tabs ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{background:none;border:0;border-top:2px solid transparent;padding:9px 2px 10px;color:var(--dim);
  font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  text-transform:uppercase;letter-spacing:.08em;font-weight:600}
nav button .ic{font-size:16px;line-height:1}
nav button.on{color:var(--acc);border-top-color:var(--acc);background:var(--tint-acc)}

main{padding:12px 12px 20px;max-width:820px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---------- Karten ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
details.acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:12px;font-size:10.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:9px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▾";margin-left:auto;color:var(--dim);font-size:13px;letter-spacing:0}
details.acc[open]>summary{border-bottom:1px solid var(--line2)}
details.acc[open]>summary::after{content:"▴"}
details.acc>summary::before{content:"";width:3px;height:13px;background:var(--acc);border-radius:1px}
details.acc .body{padding:12px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:420px){.g3{grid-template-columns:1fr 1fr}}

/* ---------- Eingaben: alles Blaue ist von dir ---------- */
label.f{display:block;font-size:10px;color:var(--mut);margin-bottom:4px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
input[type=text],input[type=number],input[type=datetime-local],input[type=date],select,textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;
  color:var(--steel);font-weight:700;font-family:var(--mono);font-size:14px}
input[type=text]{font-family:inherit}
textarea{color:var(--tx);font-weight:400;font-family:inherit;font-size:14px;min-height:56px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:#A9B3B9;font-weight:400;font-family:inherit}
select{-webkit-appearance:none;appearance:none;font-family:inherit;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 92px;min-width:92px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 7px;font-size:12.5px;line-height:1.25;color:var(--mut);cursor:pointer;white-space:normal;overflow-wrap:anywhere}
.seg button.on{background:var(--tint-steel);border-color:var(--steel);color:var(--steel);font-weight:700}
.seg.em button.on{background:var(--tint-ember);border-color:var(--ember);color:var(--ember)}
.seg.tight button{flex:1 1 54px;min-width:54px;font-size:13px}
input.badin{border-color:var(--dang);background:var(--tint-dang)}

/* ---------- Ergebnisse: alles Türkise rechnet die App ---------- */
.res{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);
  border-radius:0 var(--r) var(--r) 0;padding:9px 11px}
.res .lab{font-size:9.5px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.res .val{font-size:22px;font-weight:700;color:var(--acc);line-height:1.1;margin-top:3px;font-family:var(--mono);letter-spacing:-.02em}
.res .val.sm{font-size:17px}
.res .sub{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.res.em{border-left-color:var(--ember)}.res.em .val{color:var(--ember)}
.res.warn{border-left-color:var(--warn);background:var(--tint-warn)}.res.warn .val{color:var(--warn)}
.res.dang{border-left-color:var(--dang);background:var(--tint-dang)}.res.dang .val{color:var(--dang)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--mut)}
.chip b{color:var(--tx);font-family:var(--mono);font-weight:700}
.formula{background:var(--panel2);border-top:1px solid var(--line2);border-radius:0;padding:8px 0 0;
  font-size:10.5px;color:var(--mut);margin-top:10px;font-family:var(--mono);line-height:1.5;background:none}

/* ---------- Hinweise ---------- */
.note{border-radius:0 var(--r) var(--r) 0;padding:9px 11px;font-size:12.5px;margin-top:8px;border-left:3px solid;line-height:1.42}
.note.i{background:var(--tint-steel);border-color:var(--steel);color:#1A3A55}
.note.w{background:var(--tint-warn);border-color:var(--warn);color:#5C3D00}
.note.e{background:var(--tint-dang);border-color:var(--dang);color:#7A1912}
.note.o{background:var(--tint-ember);border-color:var(--ember);color:#6E3A0F}
.note b{font-weight:700}

/* ---------- Bettenraster ---------- */
.beds{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(min-width:620px){.beds{grid-template-columns:repeat(3,1fr)}}
.bed{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--line);
  border-radius:0 0 var(--r) var(--r);padding:11px;cursor:pointer;text-align:left;width:100%;display:block;position:relative}
.bed.occ{border-top-color:var(--acc)}
.bed:active{background:var(--panel2)}
.bed .no{font-size:9.5px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.bed .lb{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed .lb.free{color:var(--dim);font-weight:400}
.bed .meta{font-size:11.5px;color:var(--mut);margin-top:6px;font-family:var(--mono)}
.bed .day{position:absolute;top:10px;right:9px;font-size:10.5px;font-weight:700;color:var(--ember);
  background:var(--tint-ember);border:1px solid #E3C9AC;border-radius:3px;padding:1px 6px;font-family:var(--mono)}
.bed .flags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.fl{font-size:10px;border-radius:3px;padding:2px 6px;border:1px solid;font-weight:600}
.fl.w{color:var(--warn);border-color:#E0CDA0;background:var(--tint-warn)}
.fl.e{color:var(--dang);border-color:#E3BDB9;background:var(--tint-dang)}
.fl.i{color:var(--steel);border-color:#C3D5E5;background:var(--tint-steel)}

/* ---------- Zeitachse als Kurvenlineal ---------- */
.tl{margin-top:11px}
.tl .bar{position:relative;height:22px;border:1px solid var(--line);border-radius:3px;overflow:hidden;
  background:linear-gradient(90deg,var(--tint-ember) 0%,var(--tint-ember) 26%,var(--tint-acc) 40%,var(--tint-acc) 100%)}
.tl .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
.tl .mk::after{content:"";position:absolute;top:-1px;left:-3px;width:8px;height:8px;background:var(--tx);
  border-radius:50%;border:2px solid var(--panel)}
.tl .zl{position:absolute;top:4px;font-size:9px;letter-spacing:.14em;font-weight:700;color:var(--mut)}
.tl .ax{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-top:4px;
  letter-spacing:.06em;text-transform:uppercase}

/* ---------- Referenz ---------- */
.ref{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.ref>summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.ref>summary::-webkit-details-marker{display:none}
.ref>summary::after{content:"+";margin-left:auto;color:var(--acc);font-size:17px;font-weight:400}
.ref[open]>summary{border-bottom:1px solid var(--line2);color:var(--acc)}
.ref[open]>summary::after{content:"–"}
.ref .body{padding:11px 12px 13px;font-size:13px}
.ref .body table{width:100%;border-collapse:collapse;font-size:11.5px;margin:7px 0}
.ref .body th{text-align:left;background:var(--panel2);color:var(--mut);padding:5px 6px;border:1px solid var(--line);
  font-weight:700;font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.ref .body td{padding:5px 6px;border:1px solid var(--line);vertical-align:top}
.ref .body ul{margin:5px 0;padding-left:17px}
.ref .body li{margin-bottom:4px}
.ref .body b{color:var(--tx);font-weight:700}
.tag{font-size:9px;color:var(--ember);background:var(--tint-ember);border:1px solid #E3C9AC;border-radius:3px;
  padding:1px 5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.search{position:sticky;top:0;z-index:10;padding:2px 0 9px;background:var(--bg)}

.hr{height:1px;background:var(--line2);margin:12px 0}
.tiny{font-size:11.5px;color:var(--mut);line-height:1.45}
.disc{font-size:10.5px;color:var(--dim);text-align:center;padding:16px 6px 4px;line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:#fff;
  font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;z-index:99;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}


/* ---------- Schnittbilder Verbrennungstiefe ---------- */
.deplg{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:8px 0 4px}
.depthgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 8px}
.dep{margin:0;border:1px solid var(--line);border-radius:var(--r);padding:7px;background:var(--panel2)}
.dep svg{width:100%;height:auto;display:block;border-radius:3px}
.dep figcaption{font-size:10.5px;line-height:1.35;color:var(--mut);margin-top:5px}
.dep figcaption b{display:block;color:var(--tx);font-size:12px;margin-bottom:1px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.photo{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.photo img{width:100%;height:110px;object-fit:cover;display:block}
.photo span{display:block;font-size:10.5px;padding:4px 7px;color:var(--mut)}



/* ---------- Übergabefelder mit Vorschlag und Bausteinen ---------- */
.nf{margin-bottom:11px}
.nfh{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.autotag{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--acc);
  background:var(--tint-acc);border:1px solid #BEDBD6;border-radius:3px;padding:1px 5px}
.nfr{background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--acc);
  font-size:12px;line-height:1;padding:2px 6px;cursor:pointer;margin-left:auto}
.nfc{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.nfc button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;
  font-size:11px;color:var(--mut);cursor:pointer;line-height:1.3}
.nfc button:active{background:var(--tint-steel);border-color:var(--steel);color:var(--steel)}


/* ---------- Visitenliste (nur im Druck sichtbar) ---------- */
#visit{display:none}
.vtab{width:100%;border-collapse:collapse;font-size:8pt}
.vtab th{background:#eee;color:#000;text-align:left;padding:2pt 3pt;border:.4pt solid #999;font-size:6.5pt;
  letter-spacing:.05em;text-transform:uppercase}
.vtab td{padding:2pt 3pt;border:.4pt solid #999;vertical-align:top}
.vtab tr.vfree td{color:#888;font-style:italic}
.vtab .vw{font-size:6.5pt;line-height:1.2}
.vleg{font-size:6.5pt;color:#555;margin-top:3pt}
@media print{
  body.printvisit #visit{display:block}
  body.printvisit main,body.printvisit header,body.printvisit nav{display:none!important}
}

/* ---------- Dienstcheck ---------- */
.sgrp{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.sgt{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--mut);
  padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.sgrp .prow{padding:7px 10px}
.sgrp .prow:last-child{border-bottom:0}
.sgrp .prow.over{background:var(--tint-warn)}
.sgrp .prow.over .txt{font-weight:600}
.shist{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.sh{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--mut)}
.sh b{margin-left:4px;color:var(--tx)}
.sh.ok{background:var(--tint-acc);border-color:#BEDBD6}
.sh.w{background:var(--tint-warn);border-color:#E0CDA0;color:var(--warn)}
.sh.e{background:var(--tint-dang);border-color:#E3BDB9;color:var(--dang)}
.res .val small{font-size:11px;font-weight:400;color:var(--mut)}

/* ---------- Griff für die 24-Stunden-Achse ---------- */
.axh{display:flex;align-items:center;gap:8px;width:100%;margin-top:9px;padding:9px 11px;
  background:var(--tint-acc);border:1px solid #BEDBD6;border-radius:var(--r);color:var(--acc);
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.axh .g{width:26px;height:3px;border-radius:2px;background:var(--acc);opacity:.45;flex:0 0 26px}
.axh .c{margin-left:auto;font-size:14px;letter-spacing:0}
.axh:active{background:#DCECE9}

/* ---------- Vollbild 24-Stunden-Achse ---------- */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;
  transform:translateY(100%);transition:transform .22s ease;visibility:hidden;
  padding:calc(8px + env(safe-area-inset-top,0)) 12px calc(16px + env(safe-area-inset-bottom,0))}
.sheet.on{transform:translateY(0);visibility:visible}
.sh-top{display:flex;align-items:center;gap:8px;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.sh-ttl{flex:1;min-width:0;text-align:center;font-size:15px;line-height:1.2}
.sh-ttl b{font-weight:800}
.sh-ttl span{display:block;font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sh-nav{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:34px;height:34px;
  font-size:20px;line-height:1;color:var(--acc);cursor:pointer;flex:0 0 34px}
.sh-x{background:none;border:0;font-size:17px;color:var(--mut);cursor:pointer;padding:4px 2px 4px 6px}
.sh-dots{display:flex;gap:5px;justify-content:center;padding:9px 0 4px}
.sh-dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.sh-dots span.on{background:var(--acc);width:18px;border-radius:3px}
.sh-body{padding-top:6px}
.sh-key{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sh-key .val small{font-size:11px;font-weight:400;color:var(--mut);letter-spacing:0}
.sh-grp{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.sh-gt{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;padding:8px 11px;
  border-bottom:1px solid var(--line2);color:var(--mut)}
.sh-gt b{font-family:var(--mono);color:var(--tx)}
.sh-grp.over .sh-gt{background:var(--tint-warn);color:var(--warn)}
.sh-grp.now .sh-gt{background:var(--tint-steel);color:var(--steel)}
.sh-grp .prow{padding:8px 11px}
.sh-grp .prow:last-child{border-bottom:0}
.sh-hint{text-align:center;font-size:10px;color:var(--dim);letter-spacing:.06em;padding:14px 0 4px}
.plan.big .lane{height:52px}
.plan.big .lane.m{height:26px}
.plan.big .blk b{font-size:19px}
.plan.big .blk span{font-size:9.5px}
.plan.big .tick{width:20px;margin-left:-10px}
.plan.big .tick span{font-size:11px}
.plan.big .ax{font-size:10px}
.sheet.sl .sh-body{animation:inl .18s ease}
.sheet.sr .sh-body{animation:inr .18s ease}
@keyframes inl{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:.3;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media print{.sheet,.axh{display:none!important}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 24-Stunden-Plan ---------- */
.plan{margin:2px 0 10px}
.plan .lane-lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:7px 0 3px}
.plan .lane{position:relative;height:42px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);overflow:hidden}
.plan .lane.m{height:22px;overflow:visible}
.plan .blk{position:absolute;top:0;bottom:0;padding:7px 7px 0;border-right:1px solid var(--panel);overflow:hidden}
.plan .blk.a{background:var(--tint-ember)}
.plan .blk.b{background:var(--tint-acc)}
.plan .blk b{font-family:var(--mono);font-size:14px;line-height:1.1;color:var(--tx)}
.plan .blk b{display:inline}
.plan .blk span{display:block;font-size:8.5px;color:var(--mut);letter-spacing:.04em;white-space:nowrap;margin-top:1px}
.plan .tick{position:absolute;top:2px;bottom:2px;width:16px;margin-left:-8px;display:flex;align-items:center;
  justify-content:center;background:#DCE4DD;border-radius:3px;z-index:2}

/* ---------- Schnittbilder Verbrennungstiefe ---------- */
.deplg{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:8px 0 4px}
.depthgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 8px}
.dep{margin:0;border:1px solid var(--line);border-radius:var(--r);padding:7px;background:var(--panel2)}
.dep svg{width:100%;height:auto;display:block;border-radius:3px}
.dep figcaption{font-size:10.5px;line-height:1.35;color:var(--mut);margin-top:5px}
.dep figcaption b{display:block;color:var(--tx);font-size:12px;margin-bottom:1px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.photo{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.photo img{width:100%;height:110px;object-fit:cover;display:block}
.photo span{display:block;font-size:10.5px;padding:4px 7px;color:var(--mut)}



/* ---------- Griff für die 24-Stunden-Achse ---------- */
.axh{display:flex;align-items:center;gap:8px;width:100%;margin-top:9px;padding:9px 11px;
  background:var(--tint-acc);border:1px solid #BEDBD6;border-radius:var(--r);color:var(--acc);
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.axh .g{width:26px;height:3px;border-radius:2px;background:var(--acc);opacity:.45;flex:0 0 26px}
.axh .c{margin-left:auto;font-size:14px;letter-spacing:0}
.axh:active{background:#DCECE9}

/* ---------- Vollbild 24-Stunden-Achse ---------- */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;
  transform:translateY(100%);transition:transform .22s ease;visibility:hidden;
  padding:calc(8px + env(safe-area-inset-top,0)) 12px calc(16px + env(safe-area-inset-bottom,0))}
.sheet.on{transform:translateY(0);visibility:visible}
.sh-top{display:flex;align-items:center;gap:8px;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.sh-ttl{flex:1;min-width:0;text-align:center;font-size:15px;line-height:1.2}
.sh-ttl b{font-weight:800}
.sh-ttl span{display:block;font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sh-nav{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:34px;height:34px;
  font-size:20px;line-height:1;color:var(--acc);cursor:pointer;flex:0 0 34px}
.sh-x{background:none;border:0;font-size:17px;color:var(--mut);cursor:pointer;padding:4px 2px 4px 6px}
.sh-dots{display:flex;gap:5px;justify-content:center;padding:9px 0 4px}
.sh-dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.sh-dots span.on{background:var(--acc);width:18px;border-radius:3px}
.sh-body{padding-top:6px}
.sh-key{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sh-key .val small{font-size:11px;font-weight:400;color:var(--mut);letter-spacing:0}
.sh-grp{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.sh-gt{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;padding:8px 11px;
  border-bottom:1px solid var(--line2);color:var(--mut)}
.sh-gt b{font-family:var(--mono);color:var(--tx)}
.sh-grp.over .sh-gt{background:var(--tint-warn);color:var(--warn)}
.sh-grp.now .sh-gt{background:var(--tint-steel);color:var(--steel)}
.sh-grp .prow{padding:8px 11px}
.sh-grp .prow:last-child{border-bottom:0}
.sh-hint{text-align:center;font-size:10px;color:var(--dim);letter-spacing:.06em;padding:14px 0 4px}
.plan.big .lane{height:52px}
.plan.big .lane.m{height:26px}
.plan.big .blk b{font-size:19px}
.plan.big .blk span{font-size:9.5px}
.plan.big .tick{width:20px;margin-left:-10px}
.plan.big .tick span{font-size:11px}
.plan.big .ax{font-size:10px}
.sheet.sl .sh-body{animation:inl .18s ease}
.sheet.sr .sh-body{animation:inr .18s ease}
@keyframes inl{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:.3;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media print{.sheet,.axh{display:none!important}}

  if(!isFinite(t)) return null; return Math.floor((Date.now()-t)/86400000); };

const SHIFTS = [["T","Tagdienst","07:15–20:00"],["N","Nachtdienst","19:15–08:00"]];

/* Dienstzeiten der V1: zwei 12-Stunden-Dienste mit 45 Minuten Überlappung.
   In der Übergabezeit (19:15–20:00 und 07:15–08:00) wählt die App den
   einsteigenden Dienst — umschalten geht mit einem Tipp.
   Ein Nachtdienst über Mitternacht gehört zum Kalendertag seines Beginns. */
const SHIFT_START_DAY   = 7*60 + 15;
const SHIFT_START_NIGHT = 19*60 + 15;

function curShift(d){
  const t = d || new Date();
  const m = t.getHours()*60 + t.getMinutes();
  const day = new Date(t);
  let s;
  if(m >= SHIFT_START_NIGHT) s = "N";                               // ab 19:15
  else if(m >= SHIFT_START_DAY) s = "T";                            // 07:15 bis 19:14
  else { s = "N"; day.setDate(day.getDate()-1); }                   // vor 07:15: Nacht des Vortags
  return {s, d: new Date(day.getTime()-day.getTimezoneOffset()*60000).toISOString().slice(0,10)};
}
const shiftKey = (d,s) => d+"|"+s;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.beds) && d.beds.length === N_BEDS){

        return d;
      }
    }
  }catch(e){}
  return {beds:Array.from({length:N_BEDS},(_,i)=>blank(i+1)), cur:1, lastBackup:null};
}
let saveTimer=null;

/* ---------- Helfer ---------- */
const $  = s => document.querySelector(s);
const num = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x)?x:null; };
const r0 = x => x==null?"–":Math.round(x).toLocaleString("de-DE");

const r2 = x => x==null?"–":x.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- Klinische Rechenkerne ---------- */

const bsa = (kg,cm) => (kg&&cm) ? Math.sqrt(kg*cm/3600) : null;

function hoursSince(iso){
  if(!iso) return null;
  const t = new Date(iso).getTime();
  if(!isFinite(t)) return null;
  return (Date.now()-t)/3600000;
}

function calc(p){
  const kg = num(p.weight), cm = num(p.height), tbsa = num(p.tbsa), age = num(p.age);
  const h = hoursSince(p.injury);
  const o = {kg,cm,tbsa,age,h};
  o.bsa = bsa(kg,cm);
  o.bmi = (kg&&cm) ? kg/Math.pow(cm/100,2) : null;
  o.day = h==null ? null : Math.floor(h/24)+1;      // Burn-Tag 1 = Unfalltag

  // Kind über das Alter erkennen; ohne Altersangabe hilfsweise über das Gewicht
  o.child     = age!=null ? age<16 : (kg!=null && kg<30);
  o.childBy   = age!=null ? "Alter" : (o.child ? "Gewicht" : null);
  // Erhaltungsbedarf nach der 4-2-1-Regel (Holliday-Segar), glukosehaltig
  if(kg) o.maint = kg<=10 ? 4*kg : kg<=20 ? 40+2*(kg-10) : 60+(kg-20);

  if(kg && tbsa){
    if(o.child){
      o.burn24  = 3*kg*tbsa;              // Kinderformel: 3 ml × kg × % VKOF
      o.formel  = "Kinderformel 3 ml";
      o.brTotal = null;                   // Brooke ist eine Erwachsenenformel
    } else {
      o.burn24  = 4*kg*tbsa;              // Parkland
      o.formel  = "Parkland 4 ml";
      o.brTotal = 2*kg*tbsa;              // modifizierte Brooke / ABA-Start
      o.brRate8 = o.brTotal/2/8;
    }
    o.maint24   = o.child && o.maint ? o.maint*24 : 0;   // nur Kinder bekommen zusätzlich Erhaltungsbedarf
    o.pkTotal   = o.burn24;               // Verbrennungsanteil, Bezugsgröße der Formel
    o.total24   = o.burn24 + o.maint24;   // was in 24 h tatsächlich laufen soll
    o.pkRate8   = o.burn24/2/8 + (o.child ? o.maint : 0);
    o.rate16    = o.burn24/2/16 + (o.child ? o.maint : 0);
    o.ivy       = 250*kg;                 // Ivy-Index: ACS-Risiko
    o.rescue    = 6*kg*tbsa;              // Colloid-Rescue-Schwelle
  }
  if(kg){
    // Rule of Ten: validiert für Erwachsene 40–80 kg, Zuschlag je 10 kg darüber
    o.rot     = (tbsa && kg>=40) ? tbsa*10 + (kg>80 ? Math.floor((kg-80)/10)*100 : 0) : null;
    o.uoLo    = (o.child ? 1.0 : 0.5)*kg; o.uoHi = (o.child ? 1.5 : 1.0)*kg;
    o.uoRhab  = 2.0*kg;
    o.kcalLo  = 25*kg;  o.kcalHi = 30*kg;
    o.protLo  = 1.5*kg; o.protHi = 2.0*kg;
    o.gluMax  = 5*kg*60*24/1000;          // ESPEN-Obergrenze 5 mg/kg/min → g/d
  }
  if(o.bsa && tbsa!=null) o.evap = (25+tbsa)*o.bsa;   // ml/h Verdunstung

  // Soll/Ist der Schockphase
  const given = num(p.fluidGiven);
  if(o.pkTotal!=null && h!=null && h>=0){
    const half = o.burn24/2;
    const mh   = o.child && o.maint ? o.maint : 0;   // Erhaltungsbedarf läuft gleichmäßig weiter
    if(h < 8){
      o.sollPk = half*(h/8) + mh*h;
      o.sollBr = o.brTotal!=null ? (o.brTotal/2)*(h/8) : null;
      o.restH  = Math.max(0.25, 8-h);
      o.restMl = given!=null ? Math.max(0, (half + mh*8) - given) : null;
      o.phase  = "erste 8 h";
    } else if(h < 24){
      o.sollPk = half + half*((h-8)/16) + mh*h;
      o.sollBr = o.brTotal!=null ? o.brTotal/2 + (o.brTotal/2)*((h-8)/16) : null;
      o.restH  = Math.max(0.25, 24-h);
      o.restMl = given!=null ? Math.max(0, o.total24-given) : null;
      o.phase  = "Stunde 8–24";
    } else {
      o.phase = "nach 24 h";
    }
    // Restrate nur, wenn eine Istmenge eingetragen ist und noch sinnvoll Zeit bleibt
    if(o.restH!=null && o.restMl!=null && given!=null){
      if(o.restH >= 1){
        o.restRate = o.restMl/o.restH;
        // Rückstand, der sich rechnerisch nur mit unplausibler Rate aufholen ließe
        if(o.pkRate8 && o.restRate > 2*o.pkRate8) o.restCatchUp = true;
      } else {
        o.restShort = true;   // Phasenende < 1 h: Rate wäre irreführend
      }
    }
    if(given!=null && o.sollPk) o.devPk = (given/o.sollPk-1)*100;
    if(given!=null && kg) o.mlkgpct = tbsa ? given/(kg*tbsa) : null;
  }

  // ABSI
  if(age!=null && tbsa!=null){
    let a=0;
    a += (p.sex==="w")?1:0;
    a += age<=20?1: age<=40?2: age<=60?3: age<=80?4:5;
    a += p.inhal?1:0;
    a += p.tbsa3?1:0;
    a += Math.min(10, Math.max(1, Math.ceil(tbsa/10)));
    o.absi = a;
    o.absiTxt = a<=3?"≥99 %": a<=5?"98 %": a<=7?"80–90 %": a<=9?"50–70 %": a<=11?"20–40 %": a<=13?"~10 %":"<10 %";
    o.rbaux = age + tbsa + (p.inhal?17:0);
  }

  // Zentrumskriterien (LL 2025)
  o.center = [];
  if(tbsa!=null){
    if(!p.tbsa3 && tbsa>=15) o.center.push("Grad 2 ≥ 15 % VKOF");
    if(p.tbsa3 && tbsa>=10)  o.center.push("Grad 3 ≥ 10 % VKOF");
  }
  if(p.inhal) o.center.push("Inhalationstrauma mit äußeren Verbrennungen");
  if(p.strom) o.center.push("Stromverletzung inkl. Blitzschlag");
  if(age!=null && (age<8||age>60)) o.center.push("Alter < 8 oder > 60 Jahre");

  // Ernährung
  const feed = FEEDS[p.feedIdx]||FEEDS[0];
  const fk = feed.k===null ? num(p.feedK) : feed.k;
  const fp = feed.p===null ? num(p.feedP) : feed.p;
  if(fk && fp && o.protHi){
    const target = num(p.kcalTarget) || o.kcalHi;
    o.feedName = feed.k===null ? "eigenes Produkt" : feed.n;
    o.mlProt   = (o.protHi/fp)*100;          // ml/d für 2,0 g/kg Protein
    o.mlKcal   = target/fk;                  // ml/d für das Kalorienziel
    o.kcalAtProt = o.mlProt*fk;
    o.protAtKcal = o.mlKcal*fp/100;
    o.gapProt  = Math.max(0, o.protHi - o.protAtKcal);   // fehlendes Protein bei Kaloriensteuerung
    o.powder   = o.gapProt/0.88;             // g Proteinpulver (88 g/100 g)
    o.rateProt = o.mlProt/24; o.rateKcal = o.mlKcal/24;
  }
  const pr = num(p.propofol);
  if(pr!=null) o.propKcal = pr*24*1.1;       // Propofol 2 % ≈ 1,1 kcal/ml
  const ka = num(p.kcalAct), pa = num(p.protAct);
  if(ka!=null && o.kcalHi) o.kcalPct = ka/((num(p.kcalTarget)||o.kcalHi))*100;
  if(pa!=null && o.protHi) o.protPct = pa/o.protHi*100;


  // --- Lund-Browder aus angetippten Regionen ---
  const band = ageBand(p.age);
  let lbAll=0, lbDeep=0, lbCount=0;
  REGIONS.forEach(r=>{
    const e=(p.lb||{})[r.k]; if(!e||!e.d) return;
    const share=(e.f||100)/100, pc=regPct(r,band)*share;
    lbAll+=pc; lbCount++;
    if(e.d==="2b"||e.d==="3") lbDeep+=pc;
  });
  if(lbCount){ o.lbAll=Math.round(lbAll*10)/10; o.lbDeep=Math.round(lbDeep*10)/10; o.lbCount=lbCount;
    if(o.tbsa!=null) o.lbDiff = o.lbAll - o.tbsa; }
  o.band = band;

  // --- Diurese-Titration ---
  const uo = (p.uo||[]).slice(-24);
  if(uo.length && kg){
    const last = uo[uo.length-1];
    o.uoLast = last.ml;
    o.uoLastKg = last.ml/kg;
    // Erwachsene 0,5–1,0 ml/kg/h · Kind < 30 kg 1 ml/kg/h · Rhabdomyolyse/Strom 2 ml/kg/h
    const kind = o.child;
    o.uoMode     = p.rhabdo ? "rhabdo" : kind ? "kind" : "erw";
    o.uoTargetLo = p.rhabdo ? 1.5 : kind ? 1.0 : 0.5;
    o.uoTargetHi = p.rhabdo ? 2.5 : kind ? 1.5 : 1.0;
    o.uoSeries = uo.map(x=>({t:x.t, v:x.ml/kg}));
    const cur = num(p.curRate);
    if(o.uoLastKg < o.uoTargetLo){
      o.uoAct="up";   o.uoTxt="unter Ziel — Rate um 20–25 % erhöhen, in 1–2 h reevaluieren";
      if(cur){ o.uoNew=[cur*1.2, cur*1.25];
        // Endlose Eskalation verhindern: irgendwann ist Oligurie kein Volumenproblem mehr
        if(o.pkRate8 && cur*1.2 > 2*o.pkRate8) o.uoEscalate=true; }
    } else if(o.uoLastKg > o.uoTargetHi){
      o.uoAct="down"; o.uoTxt="über Ziel — Rate um 20 % senken";
      if(cur) o.uoNew=[cur*0.8, cur*0.8];
    } else {
      o.uoAct="hold"; o.uoTxt="im Zielkorridor — Rate beibehalten und in 1 h erneut prüfen";
    }
    // Drei aufeinanderfolgende Stunden über Ziel = Fluid Creep
    const l3=uo.slice(-3).map(x=>x.ml/kg);
    if(l3.length===3 && l3.every(v=>v>o.uoTargetHi)) o.uoCreep=true;
    if(l3.length===3 && l3.every(v=>v<o.uoTargetLo)) o.uoLowRun=true;
  }

  // --- Sepsis-Trend ---
  const tr=(p.trend||[]).slice(-14);
  if(tr.length){
    const L=tr[tr.length-1], Pv=tr.length>1?tr[tr.length-2]:null;
    o.trLast=L; o.trPrev=Pv; o.trSeries=tr;
    const d=(a,b)=>{ const x=num(a),y=num(b); return (x==null||y==null)?null:x-y; };
    o.trD={nor:d(L.nor,Pv&&Pv.nor), ins:d(L.ins,Pv&&Pv.ins), refl:d(L.refl,Pv&&Pv.refl),
           thr:d(L.thr,Pv&&Pv.thr), temp:d(L.temp,Pv&&Pv.temp)};
    // ABA-Trigger aus den erfassten Werten
    let tg=[], miss=0;
    const t=num(L.temp), hf=num(L.hf), amv=num(L.amv), thr=num(L.thr), ins=num(L.ins), refl=num(L.refl);
    if(t!=null){ if(t>39||t<36.5) tg.push("Temperatur"); } else miss++;
    if(hf!=null){ if(hf>110) tg.push("Herzfrequenz"); } else miss++;
    if(amv!=null){ if(amv>12) tg.push("Atemminutenvolumen"); } else miss++;
    if(thr!=null && o.day!=null && o.day>=3){ if(thr<100) tg.push("Thrombozyten"); }
    else miss++;   // vor Tag 3 bzw. ohne Unfallzeitpunkt laut ABA nicht anwendbar
    if(ins!=null){ const prev=Pv?num(Pv.ins):null;
      if(ins>7 || (prev&&prev>0&&(ins-prev)/prev>0.25)) tg.push("Insulinbedarf"); } else miss++;
    if(L.fi==="1") tg.push("Nahrungsintoleranz"); else if(L.fi==null) miss++;
    o.abaHits=tg; o.abaMiss=miss;
    if(Pv && num(L.nor)!=null && num(Pv.nor)!=null && num(Pv.nor)>0 && (num(L.nor)-num(Pv.nor))/num(Pv.nor)>0.25) o.norRise=true;
  }

  // --- Sepsis-Check je Dienst ---
  const cs = curShift();
  if(SHIFT_OVERRIDE) cs.s = SHIFT_OVERRIDE;
  o.shiftNow = cs;
  const sh = (p.shifts||[]);
  o.shiftEntry = sh.find(x=>x.k===shiftKey(cs.d,cs.s)) || null;
  o.shiftDone  = !!o.shiftEntry;
  if(o.shiftEntry){
    const on = o.shiftEntry.on||{};
    o.shAba = SEPSIS_ITEMS.filter(([g,k])=>g==="aba" && on[k]).map(([,k])=>k);
    o.shFw  = SEPSIS_ITEMS.filter(([g,k])=>g==="fw"  && on[k]).map(([,k])=>k);
  } else { o.shAba=[]; o.shFw=[]; }
  o.shiftHist = sh.slice(-6);

  // --- Wundkarte / Transplantat-POD ---
  const W=[];
  REGIONS.forEach(r=>{
    const e=(p.wound||{})[r.k]; if(!e||!e.st) return;
    const pod=daysSince(e.dt);
    const it={k:r.k, n:r.n, st:e.st, dt:e.dt, pod, pct:regPct(r,band)};
    if(e.st==="graft" && pod!=null){
      it.note = pod<=4 ? "POD "+pod+" · Ruhigstellung, keine Scherkräfte · erster Verbandwechsel nach Hausstandard (meist Tag 3–5)"
              : pod<=6 ? "POD "+pod+" · vorsichtige Mobilisation nach chirurgischer Rücksprache"
              : "POD "+pod+" · Mobilisation und Kompression nach chirurgischer Freigabe";
      if(pod<=4) it.hold=true;
    }
    if(e.st==="donor" && pod!=null){
      it.note = pod<10 ? "Tag "+pod+" · Abheilung läuft, frühestens ab Tag 10–14 erneut abernten"
                       : "Tag "+pod+" · abgeheilt, erneute Entnahme möglich";
      if(pod>=10) it.ready=true;
    }
    if(e.st==="exc" && pod!=null) it.note="seit "+pod+" d offen · Deckung planen";
    W.push(it);
  });
  if(W.length){
    o.wound=W;
    o.wGraftHold = W.filter(x=>x.hold);
    o.wDonorReady= W.filter(x=>x.ready);
    o.wOpen      = W.filter(x=>x.st==="burn"||x.st==="exc");
    o.wOpenPct   = Math.round(o.wOpen.reduce((s,x)=>s+x.pct,0)*10)/10;
  }

  return o;
}



/* Altersabhängige Grenzwerte nach der International Pediatric Sepsis Consensus
   Conference (Goldstein 2005). Beim Erwachsenen gelten die ABA-Werte. */
function sirsLimits(age){
  const a = num(age);
  if(a==null || a>=18) return {hrHi:110, rrHi:25, tHi:39.0, tLo:36.5, adult:true, grp:"Erwachsene"};
  if(a < 1/12)  return {hrHi:180, rrHi:50, tHi:38.5, tLo:36.0, grp:"Neugeborenes"};
  if(a < 1)     return {hrHi:180, rrHi:34, tHi:38.5, tLo:36.0, grp:"Säugling"};
  if(a <= 5)    return {hrHi:140, rrHi:22, tHi:38.5, tLo:36.0, grp:"2–5 Jahre"};
  if(a <= 12)   return {hrHi:130, rrHi:18, tHi:38.5, tLo:36.0, grp:"6–12 Jahre"};
  return {hrHi:110, rrHi:14, tHi:38.5, tLo:36.0, grp:"13–17 Jahre"};
}
const sepText = (k,l) =>
  k==="temp" ? `Temperatur > ${r1(l.tHi)} °C oder < ${r1(l.tLo)} °C`
: k==="hf"   ? `Herzfrequenz > ${l.hrHi}/min`
: k==="af"   ? `Atemfrequenz > ${l.rrHi}/min${l.adult?" bzw. AMV > 12 l/min":""}`
: null;

/* Trendwerte in die Trigger des laufenden Dienstes übertragen.
   Von Hand gesetzte Haken bleiben unangetastet. */
function syncShiftFromTrend(p, c){
  const L = c.trLast; if(!L) return;
  const cs = c.shiftNow, k = shiftKey(cs.d, cs.s);
  p.shifts = p.shifts||[];
  let e = p.shifts.find(x=>x.k===k);
  if(!e){ e = {k, d:cs.d, s:cs.s, on:{}, auto:{}, manual:{}, ts:Date.now()}; p.shifts.push(e); }
  e.auto = e.auto||{}; e.manual = e.manual||{};
  const lim = sirsLimits(c.age);
  const set = (key,pos)=>{
    if(pos===null || e.manual[key]) return;
    if(pos){ e.on[key]=true; e.auto[key]=true; }
    else if(e.auto[key]){ delete e.on[key]; delete e.auto[key]; }
  };
  const t=num(L.temp), hf=num(L.hf), af=num(L.af), amv=num(L.amv), thr=num(L.thr), ins=num(L.ins);
  set("temp", t==null   ? null : (t>lim.tHi || t<lim.tLo));
  set("hf",   hf==null  ? null : hf>lim.hrHi);
  set("af",   (af==null && amv==null) ? null : ((af!=null && af>lim.rrHi) || (amv!=null && amv>12)));
  set("thr",  thr==null ? null : (c.day!=null && c.day>=3 ? thr<100 : false));
  const pi = c.trPrev ? num(c.trPrev.ins) : null;
  set("glu",  ins==null ? null : (ins>7 || (pi && pi>0 && (ins-pi)/pi > 0.25)));
  set("fi",   L.fi==null ? null : L.fi==="1");
  e.ts = Date.now();
  if(p.shifts.length>24) p.shifts = p.shifts.slice(-24);
}

/* ---------- Plausibilität der Eingaben ----------
   Ein Zahlendreher beim Gewicht verzehnfacht das Volumen. Diese Prüfung
   rechnet nichts anders, sie macht nur laut auf Unsinn aufmerksam. */
function plausi(p,c){
  const W=[]; const bad=new Set();
  const kg=num(p.weight), cm=num(p.height), age=num(p.age), tb=num(p.tbsa), g=num(p.fluidGiven);
  if(kg!=null && (kg<2 || kg>300)){ W.push(`Gewicht ${r1(kg)} kg ist unplausibel — Zahlendreher?`); bad.add("weight"); }
  if(cm!=null && (cm<30 || cm>250)){ W.push(`Größe ${r0(cm)} cm ist unplausibel.`); bad.add("height"); }
  if(age!=null && (age<0 || age>120)){ W.push(`Alter ${r0(age)} Jahre ist unplausibel.`); bad.add("age"); }
  if(tb!=null && tb>100){ W.push(`VKOF ${r1(tb)} % ist nicht möglich — mehr als 100 % gibt es nicht.`); bad.add("tbsa"); }
  if(tb!=null && tb<0){ W.push("VKOF kann nicht negativ sein."); bad.add("tbsa"); }
  if(c.bmi!=null && (c.bmi<8 || c.bmi>90)){ W.push(`Gewicht und Größe ergeben einen BMI von ${r0(c.bmi)} — bitte prüfen.`); bad.add("weight"); bad.add("height"); }
  if(c.h!=null && c.h<-0.2){ W.push("Der Unfallzeitpunkt liegt in der Zukunft."); bad.add("injury"); }
  if(c.h!=null && c.h>24*120){ W.push("Der Unfallzeitpunkt liegt über 120 Tage zurück — Jahreszahl prüfen."); bad.add("injury"); }
  if(g!=null && kg!=null && g > 60*kg && c.h!=null && c.h<24){ W.push(`${r0(g)} ml in ${r1(c.h)} h sind mehr als 60 ml/kg — Eingabe prüfen.`); bad.add("fluidGiven"); }
  if(g!=null && g>60000){ W.push("Die eingetragene Volumenmenge ist unplausibel hoch."); bad.add("fluidGiven"); }
  const ka=num(p.kcalAct), pa=num(p.protAct);
  if(ka!=null && ka>8000){ W.push("Die erreichte Kalorienmenge ist unplausibel hoch."); bad.add("kcalAct"); }
  if(pa!=null && kg!=null && pa>6*kg){ W.push("Die erreichte Eiweißmenge ist unplausibel hoch."); bad.add("protAct"); }
  return {list:W, bad};
}

/* ---------- Warnungen / phasenabhängige Prüfpunkte ---------- */
function alerts(p,c){
  const A=[];
  const add=(lv,t)=>A.push({lv,t});
  if(!p.injury) add("i","Unfallzeitpunkt fehlt — ohne ihn sind Volumenrechnung und Burn-Tag nicht möglich.");
  if(c.tbsa!=null && c.tbsa>=15 && c.h!=null && c.h<48) add("o","Ab > 15 % VKOF gezielte Volumensubstitution.");
  if(c.tbsa!=null && c.tbsa>=30) add("w","IAP mindestens 8-stündlich messen (ACS-Risiko).");
  const g=num(p.fluidGiven);
  if(g!=null && c.ivy && g>c.ivy) add("e","Ivy-Index überschritten (> 250 ml/kg): hohes ACS-Risiko. Zufuhr drosseln, IAP prüfen.");
  else if(g!=null && c.rescue && g>c.rescue) add("w","Über 6 ml/kg/% — Colloid-Rescue erwägen statt weiter Kristalloid.");
  if(c.devPk!=null && c.h<24){
    if(c.devPk>25) add("w","Deutlich über Parkland-Soll ("+ (c.devPk>0?"+":"") + r0(c.devPk) +" %) — Rate senken und reevaluieren.");
    if(c.devPk<-25) add("w","Deutlich unter Parkland-Soll ("+ r0(c.devPk) +" %) — Perfusion und Diurese prüfen.");
  }
  if(c.h!=null && c.h>=24) add("o","Succinylcholin ab ca. 24–48 h nach Trauma kontraindiziert (Hyperkaliämie). Nicht-depolarisierende Relaxanzien: höhere Dosis, Relaxometrie.");
  if(c.h!=null && c.h>=12 && !p.nutritxt && !num(p.kcalAct)) add("w","Enterale Ernährung sollte binnen 12 h begonnen sein.");
  if(c.protPct!=null && c.protPct<80) add("w","Proteinziel nur zu "+r0(c.protPct)+" % erreicht — Proteinmodul erwägen.");
  if(c.day!=null && c.day>=3) add("i","Ab Tag 3: Sepsis-Trigger prüfen (Katecholamin-, Insulinbedarf, Nahrungsintoleranz, Thrombozyten).");
  if(c.day!=null && c.day>=5) add("i","Antiinfektiva bei ARC: Loading Dose, verlängerte Infusion, TDM. Kreatinintrend gegen die Dosis prüfen.");
  if(c.child) add("o","Kind (" + (c.age!=null?r0(c.age)+" Jahre":"unter 30 kg") + "): Volumen nach Kinderformel 3 ml/kg/% <b>plus Erhaltungsbedarf</b> " + r0(c.maint) + " ml/h, Zieldiurese 1 ml/kg/h. Für Kinder gilt die eigene Leitlinie AWMF 006-128.");
  if(p.inhal) add("i","Inhalationstrauma: keine Steroide, keine Antibiotikaprophylaxe.");
  if(p.rhabdo) add("o","Rhabdomyolyse: Zieldiurese 2 ml/kg/h, Kompartment engmaschig, CK/Myoglobin.");
  if(p.strom && !p.rhabdo) add("o","Stromunfall ohne gesetzten Rhabdo-Schalter: <b>Die Zieldiurese steht weiterhin auf 0,5–1,0 ml/kg/h.</b> CK und Myoglobin bestimmen — bei Myoglobinurie den Rhabdo-Schalter setzen, dann rechnet die App mit 2 ml/kg/h.");
  if(p.strom) add("o","Stromunfall: EKG-Monitoring ≥ 24 h bei initialem Kreislaufstillstand, Bewusstlosigkeit oder pathologischem EKG. Myoglobin und Herzenzyme, Kompartment engmaschig auch beim Sedierten, Augenkonsil. Die Hautläsion sagt nichts über die Tiefe — Beurteilung intraoperativ.");
  if(c.uoAct==="up") add("w","Diurese unter Ziel ("+r1(c.uoLastKg)+" ml/kg/h) — Rate erhöhen, in 1–2 h reevaluieren. In der Schockphase kein Furosemid.");
  if(c.uoEscalate) add("e","Die Rate liegt bereits weit über der Parkland-Kalkulation. Anhaltende Oligurie ist dann selten ein Volumenproblem — an abdominelles Kompartmentsyndrom, Blutung, kardiale Ursache oder Rhabdomyolyse denken, statt weiter zu eskalieren.");
  if(c.uoCreep) add("w","Drei Stunden in Folge über der Zieldiurese — Rate senken, sonst Fluid Creep.");
  if(c.uoLowRun) add("e","Drei Stunden in Folge unter der Zieldiurese — Perfusion, Blutung und intraabdominellen Druck prüfen.");
  if(c.shiftDone===false && c.day!=null && c.day>=2) add("w","Sepsis-Check für den laufenden Dienst ("+SHIFTS.find(x=>x[0]===c.shiftNow.s)[1]+") noch nicht dokumentiert.");
  if(c.shAba && c.shAba.length>=3) add("e","Dienstcheck: "+c.shAba.length+" von 6 ABA-Triggern auffällig — Fokus suchen. Die Diagnose muss an einen gefundenen Fokus gebunden werden.");
  else if(c.shAba && c.shAba.length===2) add("w","Dienstcheck: zwei ABA-Trigger auffällig — engmaschig beobachten.");
  if(c.shFw && c.shFw.length>=2) add("w","Dienstcheck: "+c.shFw.length+" Frühzeichen auffällig. Diese Trends gehen dem Fieber oft voraus.");
  if(c.abaHits && c.abaHits.length>=3) add("e","ABA-Sepsis-Trigger erfüllt ("+c.abaHits.length+" von 6: "+c.abaHits.join(", ")+") — Fokus suchen, Diagnose an einen Fokus binden.");
  else if(c.abaHits && c.abaHits.length===2) add("w","Zwei ABA-Trigger positiv ("+c.abaHits.join(", ")+") — engmaschig beobachten.");
  if(c.norRise) add("w","Noradrenalinbedarf gegenüber dem Vortag um mehr als 25 % gestiegen — oft das erste Sepsiszeichen.");
  if(c.wGraftHold && c.wGraftHold.length) add("o","Frische Transplantate ("+c.wGraftHold.map(x=>x.n).join(", ")+") — Ruhigstellung, keine Scherkräfte.");
  if(c.wDonorReady && c.wDonorReady.length) add("i","Spenderareale wieder verfügbar: "+c.wDonorReady.map(x=>x.n).join(", ")+".");
  if(c.lbDiff!=null && Math.abs(c.lbDiff)>=5) add("w","Lund-Browder ergibt "+r1(c.lbAll)+" % gegenüber eingetragenen "+r0(c.tbsa)+" % — VKOF prüfen und übernehmen.");
  if(c.center && c.center.length) add("o","Zentrumskriterium erfüllt: "+c.center.join(" · "));
  return A;
}

      const bits=[];

      if(c.absi!=null) bits.push(`ABSI ${c.absi}`);

      if(c.shAba && c.shAba.length>=3) h += `<span class="fl e">Sepsis ${c.shAba.length}/6</span>`;
      else if(c.shAba && c.shAba.length===2) h += `<span class="fl w">Sepsis 2/6</span>`;
      if(c.shFw && c.shFw.length>=2) h += `<span class="fl w">${c.shFw.length} Frühzeichen</span>`;
      if(!c.shiftDone && c.day!=null && c.day>=2) h += `<span class="fl w">Check offen</span>`;
      if(c.abaHits && c.abaHits.length>=3) h += `<span class="fl e">Sepsis-Trigger</span>`;
      if(c.wGraftHold && c.wGraftHold.length) h += `<span class="fl i">Graft POD ${c.wGraftHold[0].pod}</span>`;
      if(p.inhal)  h += `<span class="fl i">Inhalation</span>`;
      if(p.rhabdo) h += `<span class="fl i">Rhabdo</span>`;
      if(p.strom)  h += `<span class="fl i">Strom</span>`;
      if(worst==="e") h += `<span class="fl e">${A.filter(a=>a.lv==="e").length} kritisch</span>`;

/* ---------- 24-Stunden-Plan: Volumenregime und Pflichtinterventionen ---------- */
function plan24(p,c){
  const A=[]; const t=c.tbsa;
  const add=(k,t0,t1,txt,cond)=>{ if(cond===undefined||cond) A.push({k,t0,t1,txt}); };
  add("vkof",   0,2,  "VKOF mit Lund-Browder nachmessen — nur Grad 2 und 3 zählen");
  add("bga",    0,1,  "BGA mit COHb, MetHb und Laktat");
  add("dk",     0,1,  "Blasenkatheter, stündliche Diurese als Steuerparameter");
  add("waerme", 0,24, "Wärme: Raum aufheizen, Warmluftdecke, Infusionen wärmen, Temperatur dokumentieren");
  add("eschar", 0,4,  "Escharotomie prüfen: > 2/3 Zirkumferenz, Beatmungsdruck, Doppler distal");
  add("analg",  0,2,  "Analgesiekonzept: Hintergrund- und Prozedurschmerz getrennt festlegen");
  add("lager",  0,2,  "Oberkörper 20–45°, Extremitäten hoch, Antikontrakturlagerung");
  add("tet",    0,4,  "Tetanusschutz prüfen");
  add("foto",   0,6,  "Fotodokumentation und Lund-Browder-Schema anlegen");
  add("broncho",0,6,  "Bronchoskopie: Ruß, Ödem, AIS-Grad dokumentieren — keine Steroide, keine Prophylaxe", p.inhal);
  add("auge",   0,6,  "Augenkonsil, Hornhautschutz" + (p.strom?" — Katarakt-Risiko":""), p.inhal || p.strom || t>=15);
  add("ck",     0,6,  "CK und Myoglobin, bei Myoglobinurie Zieldiurese 2 ml/kg/h", p.rhabdo||p.strom);
  add("ekg",    0,24, "EKG-Monitoring mindestens 24 h", p.rhabdo||p.strom);
  add("komp",   0,24, "Kompartment engmaschig prüfen, auch beim sedierten Patienten", p.strom||p.rhabdo);
  add("explor", 0,24, "Tiefenausdehnung nur intraoperativ beurteilbar — Hautläsion täuscht", p.strom);
  add("ern",    6,12, "Enterale Ernährung beginnen — niedrig starten, dann steigern");
  add("alb",    8,12, "Albumin erwägen bei Instabilität oder übermäßigem Bedarf");
  add("iap",    8,24, "IAP messen, mindestens 8-stündlich", t!=null && t>=30);
  add("bil",   12,12, "Kumulativbilanz gegen Ivy-Index prüfen");
  add("ulcus",  0,6,  "Ulkus- und Thromboembolieprophylaxe ansetzen");
  add("deesk", 24,24, "Volumen deeskalieren, VKOF und Tiefe neu bewerten");
  add("succ",  24,24, "Ab jetzt kein Succinylcholin mehr");
  add("op",    24,24, "Erste Nekrektomie planen — Flächen- und Zeitlimit vereinbaren");
  return A;
}

function renderPlan(p,c){
  if(c.pkTotal==null || c.h==null) return "";
  const items = plan24(p,c);
  const done = p.done||{};
  const nowPct = Math.min(100, Math.max(0, c.h/24*100));
  const past = c.h>=24;
  const pos = x => (x/24*100);
  // Pflichtpunkte, deren Fenster abgelaufen ist und die nicht abgehakt sind
  const overdue = items.filter(i=>!done[i.k] && c.h > i.t1);
  const openNow = items.filter(i=>!done[i.k] && c.h >= i.t0 && c.h <= i.t1);

  let h = `<details class="acc" data-k="plan" ${accOpen("plan", !past)}><summary>24-Stunden-Plan</summary><div class="body">`;

  // Grafik
  h += `<div class="plan">
    <div class="lane-lab">Volumen</div>
    <div class="lane">
      <div class="blk a" style="left:0;width:${pos(8)}%">
        <b>${r0(c.pkRate8)}</b> ml/h
        <span>Hälfte in 8 h</span>
      </div>
      <div class="blk b" style="left:${pos(8)}%;width:${pos(16)}%">
        <b>${r0(c.rate16)}</b> ml/h
        <span>Rest über 16 h</span>
      </div>
      ${!past?`<div class="now" style="left:${nowPct}%"></div>`:""}
    </div>
    <div class="lane-lab">Pflichtpunkte</div>
    <div class="lane m">
      ${(()=>{ const g={};
        items.forEach(i=>{ (g[i.t0]=g[i.t0]||[]).push(i); });
        return Object.keys(g).map(k=>{
          const t0=+k, grp=g[k];
          const anyOver = grp.some(i=>!done[i.k] && c.h>i.t1);
          const anyNow  = grp.some(i=>!done[i.k] && c.h>=i.t0 && c.h<=i.t1);
          const allDone = grp.every(i=>done[i.k]);
          const st = anyOver?"o":anyNow?"n":allDone?"d":"";
          const side = t0===0 ? "left:0;margin-left:0" : t0>=24 ? "right:0;margin-left:0" : `left:${pos(t0)}%`;
          return `<div class="tick ${st}" style="${side}"><span>${grp.length}</span></div>`;
        }).join(""); })()}
      ${!past?`<div class="now" style="left:${nowPct}%"></div>`:""}
    </div>
    <div class="ax">${[0,4,8,12,16,20,24].map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="axlab">Stunden ab Unfallzeitpunkt</div>
  </div>`;

  if(overdue.length) h += `<div class="note w"><b>${overdue.length} Punkt${overdue.length>1?"e":""} überfällig</b> — Zeitfenster abgelaufen und nicht abgehakt.</div>`;
  else if(openNow.length) h += `<div class="note i"><b>${openNow.length} Punkt${openNow.length>1?"e":""} jetzt fällig.</b></div>`;

  // Liste
  h += `<div class="plist">`;
  items.forEach(i=>{
    const st = done[i.k] ? "done" : (c.h>i.t1 ? "over" : (c.h>=i.t0 ? "now" : "fut"));
    const win = i.t0===i.t1 ? `ab ${i.t0} h` : `${i.t0}–${i.t1} h`;
    h += `<label class="prow ${st}">
      <input type="checkbox" data-plan="${i.k}" ${done[i.k]?"checked":""}>
      <span class="win">${win}</span>
      <span class="txt">${esc(i.txt)}</span>
    </label>`;
  });
  h += `</div>
  <div class="formula">Fenster orientierend nach Leitlinie und Hausablauf · abgehakte Punkte erscheinen im Übergabetext</div>
  </div></details>`;
  return h;
}

/* ---------- Vorschläge aus den eingegebenen Daten ---------- */
function autoHand(p,c){
  const A={}, dt = x => x ? x.split("-").reverse().join(".").slice(0,6)+x.slice(0,4).slice(2) : "";
  const dmy = x => { if(!x) return ""; const [y,m,d2]=x.split("-"); return `${d2}.${m}.`; };

  if(p.injury){
    const d = new Date(p.injury);
    const bits = [`Unfall ${d.toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}`];
    if(c.day!=null) bits.push(`Burn-Tag ${c.day}`);
    if(p.strom) bits.push("Stromverletzung");
    if(p.inhal) bits.push("Inhalationstrauma");
    if(p.rhabdo) bits.push("Rhabdomyolyse");
    A.injury = bits.join(", ");
  }
  if(c.tbsa!=null){
    let t = `${r0(c.tbsa)} % VKOF (Grad 2 und 3)`;
    if(c.lbCount) t += `, nach Lund-Browder ${r1(c.lbAll)} % davon ${r1(c.lbDeep)} % tief (2b/3)`;
    else if(p.tbsa3) t += ", drittgradige Anteile vorhanden";
    if(c.center && c.center.length) t += `. Zentrumskriterium: ${c.center.join(", ")}`;
    A.extent = t;
  }
  A.inhal = p.inhal ? "ja — keine Steroide, keine Antibiotikaprophylaxe" : "nein";

  if(c.wound){
    const off = c.wound.filter(x=>x.st==="burn"||x.st==="exc");
    if(off.length) A.wounds = off.map(x=>`${x.n}: ${WSTAT[x.st].n}${x.pod!=null?` seit ${x.pod} d`:""}`).join(" · ")
      + (c.wOpenPct?` — offen ca. ${r1(c.wOpenPct)} % KOF`:"");
    const ex = c.wound.filter(x=>x.st==="exc"||x.st==="graft").sort((a,b)=>(a.pod??99)-(b.pod??99));
    if(ex.length) A.surgery = `zuletzt ${ex[0].n}: ${WSTAT[ex[0].st].n} am ${dmy(ex[0].dt)}${ex[0].pod!=null?` (POD ${ex[0].pod})`:""}`;
    const gr = c.wound.filter(x=>x.st==="graft");
    if(gr.length) A.grafts = gr.map(x=>`${x.n}: POD ${x.pod}${x.hold?" — Ruhigstellung, keine Scherkräfte":""}`).join(" · ");
    const dn = c.wound.filter(x=>x.st==="donor");
    if(dn.length) A.donor = dn.map(x=>`${x.n}: Tag ${x.pod}${x.ready?" — erneute Entnahme möglich":" — Abheilung läuft"}`).join(" · ");
    if(gr.some(x=>x.hold)) A.mobility = `Ruhigstellung ${gr.filter(x=>x.hold).map(x=>x.n).join(", ")} — keine Scherkräfte. Übrige Areale nach Plan mobilisieren.`;
  }
  const giv = num(p.fluidGiven);
  if(c.pkTotal!=null){
    const f=[];
    if(giv!=null) f.push(`bisher ${r0(giv)} ml${c.mlkgpct!=null?` (${r1(c.mlkgpct)} ml/kg/%)`:""}`);
    if(c.sollPk!=null) f.push(`Parkland-Soll jetzt ${r0(c.sollPk)} ml`);
    f.push(`Ivy-Grenze ${r0(c.ivy)} ml`);
    f.push(`Zieldiurese ${p.rhabdo?r0(c.uoRhab):r0(c.uoLo)+"–"+r0(c.uoHi)} ml/h`);
    if(c.uoLastKg!=null) f.push(`zuletzt ${r1(c.uoLastKg)} ml/kg/h`);
    A.fluidtxt = f.join(", ");
  }
  if(c.kcalHi!=null){
    const n2=[`Ziel ${r0(num(p.kcalTarget)||c.kcalHi)} kcal und ${r1(c.protLo)}–${r1(c.protHi)} g Eiweiß`];
    if(num(p.kcalAct)!=null||num(p.protAct)!=null) n2.push(`erreicht ${r0(num(p.kcalAct))} kcal / ${r0(num(p.protAct))} g`);
    if(c.feedName) n2.push(c.feedName);
    if(c.propKcal) n2.push(`Propofol ${r0(c.propKcal)} kcal/d`);
    A.nutritxt = n2.join(", ");
  }
  if(c.shiftDone){
    A.infect = `Dienstcheck ${SHIFTS.find(x=>x[0]===c.shiftNow.s)[1]}: ${c.shAba.length}/6 ABA-Trigger, ${c.shFw.length} Frühzeichen`
      + (c.shAba.length>=3 ? " — Fokussuche läuft" : "");
  }
  return A;
}

/* ---------- Ein Textfeld mit Vorschlag, Rücksetzer und Bausteinen ---------- */
function noteField(scope, key, label, ph, autoTxt, p){
  const store = scope==="hand" ? (p.hand||{}) : (p.rout||{});
  const flags = scope==="hand" ? (p.handAuto||{}) : (p.routAuto||{});
  const isAuto = autoTxt!=null && flags[key]!==false && !store[key];
  const val = isAuto ? autoTxt : (store[key]||"");
  const chips = CHIPS[key]||[];
  return `<div class="nf" data-nf="${scope}|${key}">
    <div class="nfh"><label class="f" style="margin:0">${label}</label>
      ${isAuto?`<span class="autotag">automatisch</span>`:""}
      ${autoTxt!=null?`<button class="nfr" data-reset="${scope}|${key}" title="Vorschlag wiederherstellen">↺</button>`:""}
    </div>
    <textarea data-fld="${scope}|${key}" placeholder="${esc(ph)}">${esc(val)}</textarea>
    ${chips.length?`<div class="nfc">${chips.map(t=>`<button type="button" data-chip="${scope}|${key}|${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}
  </div>`;
}


/* ---------- Visitenliste: alle Betten auf eine Seite ---------- */
function renderVisit(){
  const rows = S.beds.map(p=>{
    const c = calc(p);
    const occ = !!(p.label||p.weight||p.tbsa||p.injury);
    if(!occ) return `<tr class="vfree"><td>${p.id}</td><td colspan="7">frei</td></tr>`;
    const A = alerts(p,c).filter(a=>a.lv==="e"||a.lv==="w").map(a=>a.t.replace(/<[^>]+>/g,""));
    const vol = c.total24!=null
      ? `${r0(num(p.fluidGiven))||0} / ${r0(c.total24)} ml${c.devPk!=null?` (${c.devPk>0?"+":""}${r0(c.devPk)} %)`:""}`
      : "–";
    const uo = c.uoLastKg!=null ? `${r1(c.uoLastKg)} ml/kg/h` : "–";
    const chk = c.shiftDone ? `${c.shAba.length}/6 · ${c.shFw.length} FZ` : "offen";
    const off = c.wOpenPct ? `${r1(c.wOpenPct)} %` : "–";
    return `<tr>
      <td><b>${p.id}</b></td>
      <td>${esc(p.label||"—")}</td>
      <td>${c.day!=null?"Tag "+c.day:"–"}</td>
      <td>${c.tbsa!=null?r0(c.tbsa)+" %":"–"}${c.child?" K":""} / ${c.kg!=null?r0(c.kg)+" kg":"–"}</td>
      <td>${vol}</td>
      <td>${uo}</td>
      <td>${chk}</td>
      <td class="vw">${A.length?A.map(x=>"• "+x).join("<br>"):"—"}</td>
    </tr>`;
  }).join("");
  return `<div class="printhdr">
      <div class="t">Visitenliste · Verbrennungs-Station</div>
      <div class="s">Stand ${new Date().toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})} · ${SHIFTS.find(x=>x[0]===curShift().s)[1]} · Arbeitshilfe, keine Handlungsanweisung</div>
    </div>
    <table class="vtab"><tr>
      <th>Bett</th><th>Kürzel</th><th>Tag</th><th>VKOF / kg</th>
      <th>Volumen Ist/Soll 24 h</th><th>Diurese</th><th>Check</th><th>Offene Punkte</th></tr>
      ${rows}</table>
    <div class="vleg">K = Kind (Kinderformel) · Check = ABA-Trigger von 6 und Zahl der Frühzeichen des laufenden Dienstes</div>`;
}

/* ============================================================
   Ansicht: Patient
   ============================================================ */
function tl(h){
  if(h==null) return "";
  const span = 168;                      // 7 Tage Achse
  const pos = Math.min(100, Math.max(0, h/span*100));
  return `<div class="tl"><div class="bar">
      <span class="zl" style="left:6px">SCHOCK</span>
      <span class="zl" style="left:32%">FLOW</span>
      <div class="mk" style="left:${pos}%"></div>
    </div><div class="ax"><span>Unfall</span><span>24 h</span><span>Tag 3</span><span>Tag 5</span><span>Tag 7+</span></div></div>`;
}

  // Kennzahlen
  h += `<details class="acc" data-k="kenn" ${accOpen("kenn",true)}><summary>Kennzahlen</summary><div class="body"><div class="grid g2">
    <div class="res"><div class="lab">Körperoberfläche</div><div class="val sm num">${r2(c.bsa)} m²</div><div class="sub">Mosteller</div></div>

    <div class="res"><div class="lab">Zieldiurese</div><div class="val sm num">${p.rhabdo?r0(c.uoRhab):r0(c.uoLo)+"–"+r0(c.uoHi)} ml/h</div><div class="sub">${p.rhabdo?"2 ml/kg/h bei Rhabdomyolyse":(c.kg<30?"1 ml/kg/h (Kind < 30 kg)":"0,5–1,0 ml/kg/h")}${p.strom&&!p.rhabdo?" · bei Myoglobinurie auf 2 ml/kg/h anheben":""}</div></div>
  </div>

  // Volumen

             <div class="sub">4-2-1-Regel, glukosehaltig · ${r0(c.maint24)} ml/24 h — <b>zusätzlich</b> zum Verbrennungsanteil</div></div>`
        : `<div class="res"><div class="lab">Brooke / ABA-Start</div><div class="val num">${r0(c.brTotal)} ml</div><div class="sub">2 ml × kg × %</div></div>`}
    </div>
    ${c.child?`<div class="res em" style="margin-top:8px"><div class="lab">Gesamt in 24 h</div><div class="val num">${r0(c.total24)} ml</div>

    ${c.child?`<div class="note o"><b>Kind erkannt${c.childBy?" über das "+c.childBy:""}.</b> Gerechnet wird mit <b>3 ml × kg × % VKOF</b> und <b>zusätzlichem Erhaltungsbedarf</b> nach der 4-2-1-Regel — Erwachsene bekommen keinen Erhaltungsbedarf, Kinder schon. Zieldiurese 1 ml/kg/h. Eigene Leitlinie: AWMF 006-128 für das Kindesalter. Ab dem Kriterium Alter &lt; 8 Jahre gehört das Kind in ein Kinderverbrennungszentrum.</div>`:`<div class="note i"><b>Welche Formel?</b> Beide sind zulässig — sie legen nur den <b>Startwert</b> fest, gesteuert wird über die Diurese.
      <b>Parkland (4 ml)</b> ist der eingeführte deutsche Standard und die sichere Wahl, wenn engmaschig nach unten titriert wird.
      <b>Brooke (2 ml)</b> empfiehlt die ABA seit 2024 als Einstieg, um Fluid Creep zu vermeiden — sinnvoll bei großer Fläche, Adipositas, Herz- oder Niereninsuffizienz und immer dann, wenn stündliches Nachsteuern gesichert ist.
      Praktisch: <b>mit Brooke starten und nach oben titrieren ist sicherer als mit Parkland zu starten und nicht nach unten zu titrieren.</b> Bei Inhalationstrauma und Elektrotrauma liegt der tatsächliche Bedarf regelhaft höher als jede Formel.</div>`}
    <div class="chips">
      <span class="chip">erste 8 h <b>${r0(c.pkRate8)} ml/h</b></span>

    </div>`;
  if(c.restRate!=null){
    h += `<div class="res ${c.restCatchUp?"warn":""}" style="margin-top:8px"><div class="lab">Restrate bis Ende ${esc(c.phase)}</div>
      <div class="val num">${r0(c.restRate)} ml/h</div>

  h += `<div class="chips">

  // Ernährung
  const feed = FEEDS[p.feedIdx]||FEEDS[0];
  h += `<details class="acc" data-k="ern" ${accOpen("ern",false)}><summary>Ernährung</summary><div class="body">
